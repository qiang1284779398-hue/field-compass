<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171916"><title>幻想三国·乱世称雄</title>
<style>
:root{--bg:#111512;--panel:#20251f;--panel2:#292d25;--gold:#c6a66a;--gold2:#e5cb91;--ink:#eee5d1;--muted:#a9a18e;--red:#8f3930;--green:#6f8a61;--line:#514735}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#394033 0,#171c18 48%,#0d100e 100%);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}#app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}
header{padding:22px 18px 15px;background:linear-gradient(180deg,#101410,#20251f);border-bottom:1px solid #69583a;position:relative;overflow:hidden}
header:after{content:"漢";position:absolute;right:22px;top:-20px;font-size:130px;color:#c6a66a;opacity:.07}
.brand{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase}.title{font-size:29px;letter-spacing:4px;margin:5px 0 3px;color:#f0dfb8;text-shadow:0 2px 12px #000}.subtitle{font-size:11px;color:#9f9886;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 14px;background:#171c18;border-bottom:1px solid #38382d}
.stat{background:linear-gradient(145deg,#292d25,#1c211c);border:1px solid #484333;border-radius:7px;padding:8px 5px;text-align:center}.stat b{display:block;color:var(--gold2);font:600 16px Georgia}.stat small{font-size:10px;color:var(--muted)}
main{padding:14px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:5px 1px 12px}.section-head h2{font-size:18px;letter-spacing:2px;margin:0;color:#e4d1a5}.section-head span{font-size:10px;color:#9d927b;letter-spacing:1px}
.hero{height:175px;border:1px solid #75603c;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(0deg,rgba(10,13,11,.96),rgba(10,13,11,.08)),linear-gradient(125deg,#4c4631,#242b26 55%,#574332);margin-bottom:14px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 35%,#d5a45a33,transparent 40%),linear-gradient(160deg,transparent 45%,#090c0b 46%,#26332a 58%,#101511 72%);opacity:.95}
.hero:after{content:"";position:absolute;right:10%;top:18px;width:95px;height:95px;border:1px solid #d4b57566;border-radius:50%;box-shadow:0 0 40px #d6b36b22,inset 0 0 20px #d6b36b22}
.hero-content{position:absolute;z-index:1;left:17px;bottom:15px}.hero-kicker{color:var(--gold2);font-size:10px;letter-spacing:3px}.hero h2{font-size:23px;margin:5px 0}.hero p{font-size:11px;color:#c6bda9;margin:0}
.card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action-card{min-height:105px;text-align:left;padding:13px;border-radius:9px;border:1px solid #514735;background:linear-gradient(145deg,#2b3028,#1d221d);position:relative;transition:.15s}.action-card:active{transform:scale(.98);border-color:var(--gold)}.action-card .ico{font-size:23px;display:block;margin-bottom:7px}.action-card strong{display:block;font-size:14px;color:#ead9b5;letter-spacing:1px}.action-card small{display:block;color:#a69d89;font-size:10px;margin-top:4px}.action-card em{position:absolute;right:11px;top:12px;color:#8e8063;font-style:normal;font-size:10px}
.panel{background:linear-gradient(145deg,#272c25,#1a201b);border:1px solid #514735;border-radius:9px;padding:13px;margin-bottom:11px}.panel h3{margin:0 0 9px;font-size:15px;color:#e4d1a5}.muted{color:var(--muted);font-size:12px;line-height:1.7}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:10px;color:#d7c08f;border:1px solid #69583a;border-radius:20px;padding:3px 8px}
.btn{border:1px solid #947849;background:linear-gradient(180deg,#695334,#463823);padding:9px 13px;border-radius:6px;color:#f3dfb4;font-size:12px}.btn.secondary{background:#292e27;border-color:#59533f;color:#d1c5a9}.btn.danger{background:#5b2925;border-color:#8b4a3e}.btn:disabled{opacity:.35;cursor:not-allowed}
.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:11px;background:#20251f;border:1px solid #484333;border-radius:8px}.portrait{width:48px;height:48px;border-radius:7px;border:1px solid #92764b;background:linear-gradient(145deg,#62513a,#272b24);display:grid;place-items:center;font-size:24px;flex-shrink:0}.item-info{flex:1;min-width:0}.item-info b{font-size:13px;color:#e8d8b8}.item-info p{font-size:10px;color:#a9a18e;margin:4px 0 0;line-height:1.5}.item-side{text-align:right;font-size:10px;color:var(--gold2)}
.tabs{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:rgba(18,22,18,.97);border-top:1px solid #69583a;backdrop-filter:blur(10px)}
.tab{border:0;background:transparent;color:#9d9684;font-size:10px;padding:4px 0}.tab span{display:block;font-size:19px;margin-bottom:3px}.tab.active{color:var(--gold2)}
.notice{padding:10px 12px;background:#2c3027;border-left:2px solid var(--gold);font-size:11px;color:#c8bea8;line-height:1.6;margin:10px 0;border-radius:0 6px 6px 0}
.progress{height:6px;border-radius:9px;background:#101410;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8d6d3d,#e0c17d)}
.event{border:1px solid #74603f;background:linear-gradient(145deg,#33372c,#1d231d);border-radius:9px;padding:14px;margin-bottom:10px}.event h3{margin:0 0 7px;color:#e9d5a8;font-size:16px}.event p{font-size:12px;color:#b9b09d;line-height:1.8}
.log{font-size:11px;color:#aaa18d;line-height:1.8;border-top:1px dashed #4c4637;margin-top:10px;padding-top:8px}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(520px,100%);max-height:85vh;overflow:auto;background:#20251f;border:1px solid #9a7c4a;border-radius:11px;padding:17px;box-shadow:0 20px 70px #000}.modal-box h2{margin:0 0 10px;color:#e7d1a4;font-size:19px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
footer{text-align:center;color:#6f6a5d;font-size:9px;padding:18px;letter-spacing:2px}
@media(min-width:600px){.hero{height:210px}.card-grid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div id="app">
<header><div class="brand">THE AGE OF HEROES · THREE KINGDOMS</div><div class="title">幻想三国</div><div class="subtitle">乱世将起 · 天下待定</div></header>
<div class="stats" id="stats"></div>
<main id="view"></main>
<footer>山河为局 · 英雄为子 · 天下为棋</footer>
</div>
<nav class="tabs">
<button class="tab active" data-tab="home"><span>🏯</span>主城</button>
<button class="tab" data-tab="generals"><span>⚔️</span>武将</button>
<button class="tab" data-tab="world"><span>🗺️</span>征战</button>
<button class="tab" data-tab="quests"><span>📜</span>任务</button>
<button class="tab" data-tab="bag"><span>🎒</span>行囊</button>
</nav>
<div class="modal" id="modal"><div class="modal-box" id="modalbox"></div></div>
<script>
const initial={name:"无名主公",level:1,exp:0,gold:500,food:800,wood:500,stone:300,iron:200,prestige:0,cityLevel:1,turn:1,army:100,building:{farm:1,barracks:1,wall:1},generals:[{id:"liu",name:"刘备",title:"仁德之主",rarity:"稀有",level:1,atk:18,def:15,hp:120,icon:"🗡️",desc:"仁义宽厚，善于凝聚人心。",owned:true},{id:"zhang",name:"张飞",title:"万夫不当",rarity:"精良",level:1,atk:24,def:12,hp:135,icon:"🐯",desc:"勇猛刚烈，冲阵无双。",owned:true}],items:["粗布军旗","行军干粮"],quests:{bandit:false,recruit:false,build:false},log:["你在乱世中醒来，成为一方新主。"]}
let state;try{state=JSON.parse(localStorage.getItem("huanxiang_sanguo_save"))||structuredClone(initial)}catch(e){state=JSON.parse(JSON.stringify(initial))}if(!state.recruitGrant999){state.recruitTokens=999;state.recruitGrant999=true;localStorage.setItem("huanxiang_sanguo_save",JSON.stringify(state))}
const $=s=>document.querySelector(s);const fmt=n=>Math.floor(n).toLocaleString("zh-CN");
function save(){localStorage.setItem("huanxiang_sanguo_save",JSON.stringify(state));renderStats()}
function log(t){state.log.unshift("第"+state.turn+"日 · "+t);state.log=state.log.slice(0,8);save()}
function renderStats(){$("#stats").innerHTML=[["💰","黄金",state.gold],["🌾","粮草",state.food],["🪵","木材",state.wood],["⚔️","兵力",state.army]].map(x=>'<div class="stat"><b>'+fmt(x[2])+'</b><small>'+x[0]+' '+x[1]+'</small></div>').join("")}
function setTab(tab){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));({home:home,generals:generals,world:world,quests:quests,bag:bag}[tab]||home)()}
function shell(title,sub,body){$("#view").innerHTML='<div class="section-head"><h2>'+title+'</h2><span>'+sub+'</span></div>'+body}
function home(){shell("主城 · 新野","第 "+state.turn+" 日 · 城主府",'<div class="hero"><div class="hero-content"><div class="hero-kicker">东汉末年 · 群雄并起</div><h2>新野城</h2><p>城池等级 '+state.cityLevel+' · 威望 '+state.prestige+'</p></div></div><div class="panel"><div class="row"><h3>主公信息</h3><span class="pill">等级 '+state.level+'</span></div><div class="muted">'+state.name+' · 初入乱世，尚需积蓄力量。经验 '+state.exp+'/100</div><div class="progress"><i style="width:'+Math.min(100,state.exp)+'%"></i></div></div><div class="section-head"><h2>城中事务</h2><span>点击卡片进入</span></div><div class="card-grid"><button class="action-card" onclick="buildings()"><span class="ico">🏗️</span><strong>城池建设</strong><small>发展农田、兵营与城防</small><em>01</em></button><button class="action-card" onclick="tavern()"><span class="ico">🍶</span><strong>英雄酒馆</strong><small>寻访天下豪杰名将</small><em>02</em></button><button class="action-card" onclick="training()"><span class="ico">🎯</span><strong>演武校场</strong><small>训练士卒，提升军力</small><em>03</em></button><button class="action-card" onclick="market()"><span class="ico">🏮</span><strong>集市贸易</strong><small>用资源换取发展物资</small><em>04</em></button></div><div class="section-head" style="margin-top:19px"><h2>城中传闻</h2><span>最新消息</span></div><div class="panel"><div class="muted">'+(state.log[0]||"暂无消息")+'</div></div>')}
function buildings(){const data=[["farm","农田","🌾","粮草产量","food",150],["barracks","兵营","⚔️","征募士卒","army",180],["wall","城墙","🧱","城防等级","def",200]];modal("城池建设",'<div class="muted">城池是逐鹿天下的根基。升级建筑需要黄金与木材。</div>'+data.map(d=>'<div class="item"><div class="portrait">'+d[2]+'</div><div class="item-info"><b>'+d[1]+' · Lv.'+state.building[d[0]]+'</b><p>'+d[3]+'提升 · 升级消耗 '+(d[5]*state.building[d[0]])+' 金 / 80 木</p></div><button class="btn" onclick="upgrade(\''+d[0]+'\','+d[5]+')">升级</button></div>').join(""))}
function upgrade(key,cost){let n=state.building[key],g=cost*n;if(state.gold<g||state.wood<80){toast("资源不足，无法升级");return}state.gold-=g;state.wood-=80;state.building[key]++;if(key==="farm")state.food+=100;if(key==="barracks")state.army+=30;state.quests.build=true;log(({farm:"农田",barracks:"兵营",wall:"城墙"})[key]+"升级至 "+state.building[key]+" 级");save();buildings()}
function legacyGeneralPortrait(g){const ids={liu:"liu-bei",guan:"guan-yu",zhang:"zhang-fei",zhao:"zhao-yun",zhu:"zhuge-liang",huang:"huang-zhong"};const id=ids[g.id];return id?'<img class="general-portrait" src="app/src/main/assets/characters/2d/portraits/'+id+'.svg" alt="'+g.name+'" loading="eager" decoding="async">' :(g.icon||"⚔️")}
function tavern(){const pool=[{name:"赵云",title:"常胜将军",rarity:"史诗",atk:30,def:22,hp:160,icon:"🐉",desc:"枪出如龙，忠勇无双。",id:"zhao"},{name:"关羽",title:"武圣",rarity:"传说",atk:38,def:28,hp:190,icon:"🐲",desc:"义薄云天，威震华夏。",id:"guan"},{name:"诸葛亮",title:"卧龙先生",rarity:"传说",atk:20,def:25,hp:140,icon:"🪶",desc:"运筹帷幄，决胜千里。",id:"zhu"},{name:"黄忠",title:"老当益壮",rarity:"精良",atk:27,def:18,hp:145,icon:"🏹",desc:"百步穿杨，箭无虚发。",id:"huang"}];modal("招贤馆",'<div class="notice">良将择主。当前招贤令：<b>'+fmt(state.recruitTokens||0)+'</b>。寻访消耗1枚招贤令。</div>'+pool.map(g=>'<div class="item"><div class="portrait">'+legacyGeneralPortrait(g)+'</div><div class="item-info"><b>'+g.name+' · '+g.title+'</b><p>'+g.rarity+' · 攻 '+g.atk+' / 防 '+g.def+' / 体 '+g.hp+'</p></div></div>').join("")+'<div class="modal-actions"><button class="btn" onclick="recruit()">消耗1枚招贤令寻访</button></div>')}
function recruit(){if((state.recruitTokens||0)<1){toast("招贤令不足");return}state.recruitTokens--;let pool=[{name:"赵云",title:"常胜将军",rarity:"史诗",atk:30,def:22,hp:160,icon:"🐉",desc:"枪出如龙，忠勇无双。",id:"zhao"},{name:"关羽",title:"武圣",rarity:"传说",atk:38,def:28,hp:190,icon:"🐲",desc:"义薄云天，威震华夏。",id:"guan"},{name:"诸葛亮",title:"卧龙先生",rarity:"传说",atk:20,def:25,hp:140,icon:"🪶",desc:"运筹帷幄，决胜千里。",id:"zhu"},{name:"黄忠",title:"老当益壮",rarity:"精良",atk:27,def:18,hp:145,icon:"🏹",desc:"百步穿杨，箭无虚发。",id:"huang"}];let available=pool.filter(g=>!state.generals.some(x=>x.id===g.id));if(!available.length){state.recruitTokens++;toast("可招募武将已全部入列，招贤令已退回")}else{let g=available[Math.floor(Math.random()*available.length)];state.generals.push({...g,level:1,owned:true});state.quests.recruit=true;toast("招募成功："+g.name+"加入麾下！")}log("招贤馆寻访结束");save();tavern()}

function training(){modal("演武校场",'<p class="muted">操练士卒，提升军队规模。训练需要粮草与黄金。</p><div class="event"><h3>募兵操练</h3><p>当前兵力：'+fmt(state.army)+'。每次训练可增加 50 名士卒。</p><button class="btn" onclick="train()">训练士卒 · 100粮 / 80金</button></div>')}
function train(){if(state.food<100||state.gold<80){toast("粮草或黄金不足");return}state.food-=100;state.gold-=80;state.army+=50;log("校场训练完成，新增50名士卒");save();training()}
function market(){modal("集市贸易",'<p class="muted">商贾云集，可用黄金购入急需物资。</p>'+[['粮草','food',100],['木材','wood',80],['石料','stone',70],['铁矿','iron',60]].map(x=>'<div class="item"><div class="item-info"><b>'+x[0]+'</b><p>购买 '+x[2]+' 单位</p></div><button class="btn" onclick="buy(\''+x[1]+'\','+x[2]+')">花费 '+Math.ceil(x[2]/2)+' 金</button></div>').join(""))}
function buy(k,n){let c=Math.ceil(n/2);if(state.gold<c){toast("黄金不足");return}state.gold-=c;state[k]+=n;save();market()}
function generals(){shell("麾下武将","名将录 · "+state.generals.length+" 位豪杰",'<div class="notice">武将是军团的灵魂。提升等级可增强战斗属性，出征时将自动派遣麾下武将。</div><div class="list">'+state.generals.map(g=>'<div class="item"><div class="portrait">'+g.icon+'</div><div class="item-info"><b>'+g.name+' · '+g.title+'</b><p>'+g.rarity+' · Lv.'+g.level+'<br>攻击 '+g.atk+' / 防御 '+g.def+' / 体力 '+g.hp+'</p></div><button class="btn secondary" onclick="trainGeneral(\''+g.id+'\')">培养</button></div>').join("")+'</div>')}
function trainGeneral(id){let g=state.generals.find(x=>x.id===id),cost=g.level*100;if(state.gold<cost){toast("黄金不足，需要 "+cost+" 金");return}state.gold-=cost;g.level++;g.atk+=3;g.def+=2;g.hp+=10;log(g.name+"提升至 "+g.level+" 级");save();generals()}
function world(){shell("征战天下","烽火连天 · 群雄割据",'<div class="hero" style="height:145px"><div class="hero-content"><div class="hero-kicker">天下十三州 · 逐鹿中原</div><h2>山河破碎，英雄当立</h2><p>率领麾下将士，平定乱世</p></div></div><div class="list"><div class="event"><div class="row"><h3>黄巾余党 · 村外山道</h3><span class="pill">推荐兵力 50</span></div><p>村外山道盘踞着一伙黄巾残部，百姓深受其害。若能剿灭，可获得黄金与粮草。</p><button class="btn" onclick="battle('bandit')">⚔ 出征讨伐</button></div><div class="event"><div class="row"><h3>汝南流寇 · 荒野营寨</h3><span class="pill">推荐兵力 180</span></div><p>流寇聚众劫掠商旅，营寨中似有一名悍将坐镇。</p><button class="btn" onclick="battle('raider')" '+(state.army<180?'disabled':'')+'>⚔ 进攻营寨</button></div><div class="event"><div class="row"><h3>虎牢关 · 董卓军</h3><span class="pill">推荐兵力 500</span></div><p>十八路诸侯会盟讨董，虎牢关前，天下第一猛将吕布横戟立马。</p><button class="btn" disabled>尚未开放</button></div></div>')}
function battle(type){let enemy=type==="bandit"?{name:"黄巾余党",power:55,reward:180,food:150}: {name:"汝南流寇",power:190,reward:420,food:260};let my=state.army+state.generals.reduce((a,g)=>a+g.atk*2+g.def,0);let win=my>=enemy.power;let loss=win?Math.min(state.army,Math.ceil(enemy.power*.18)):Math.min(state.army,Math.ceil(enemy.power*.35));state.army-=loss;if(win){state.gold+=enemy.reward;state.food+=enemy.food;state.exp+=50;state.prestige+=15;state.quests.bandit=true;if(state.exp>=100){state.level++;state.exp-=100;toast("主公升级！当前等级 "+state.level)}log("击败"+enemy.name+"，缴获"+enemy.reward+"黄金，损失"+loss+"士卒")}else{state.exp+=15;log("与"+enemy.name+"交战失利，撤退损失"+loss+"士卒")}state.turn++;save();modal("战报 · "+enemy.name,'<div class="event"><h3>'+(win?"大获全胜！":"战况不利")+'</h3><p>'+ (win?"我军阵列严整，诸将奋勇，当场击溃敌军。":"敌军顽强抵抗，我军暂避锋芒，整军再战。")+'</p><div class="log">敌军战力：'+enemy.power+'<br>我军战力：'+my+'<br>士卒损失：'+loss+'<br>当前剩余兵力：'+state.army+'</div></div><div class="modal-actions"><button class="btn" onclick="closeModal();world()">返回战场</button></div>')}
function quests(){let qs=[["bandit","平定黄巾","讨伐村外山道的黄巾余党。","黄金180、粮草150"],["recruit","招贤纳士","在酒馆招募一位新武将。","威望15、经验30"],["build","固本培元","升级任意一座城池建筑。","木材100、经验30"]];shell("军令任务","完成任务 · 领取赏赐",'<div class="list">'+qs.map((q,i)=>'<div class="item"><div class="portrait">'+["⚔️","📯","🏗️"][i]+'</div><div class="item-info"><b>'+q[1]+'</b><p>'+q[2]+'<br>奖励：'+q[3]+'</p></div>'+(state.quests[q[0]]?'<span class="pill">已完成</span>':'<span class="pill">进行中</span>')+'</div>').join("")+'</div><div class="notice">完成任务后，赏赐将自动发放。更多军令将在后续章节开放。</div>')}
function bag(){shell("行囊物资","随军补给 · 资源总览",'<div class="panel"><h3>基础物资</h3>'+[["黄金","gold","💰"],["粮草","food","🌾"],["木材","wood","🪵"],["石料","stone","🪨"],["铁矿","iron","⛏️"],["兵力","army","⚔️"],["威望","prestige","🏅"]].map(x=>'<div class="row" style="padding:8px 0;border-bottom:1px solid #3b3b30"><span>'+x[2]+' '+x[0]+'</span><b style="color:#e1c78f">'+fmt(state[x[1]])+'</b></div>').join("")+'</div><div class="panel"><h3>随身物品</h3><div class="muted">'+state.items.join(" · ")+'</div></div><button class="btn danger" onclick="if(confirm(\'确定重置全部游戏进度吗？\')){localStorage.removeItem(\'huanxiang_sanguo_save\');location.reload()}">重置游戏存档</button>')}
function modal(title,body){$("#modalbox").innerHTML='<div class="row"><h2>'+title+'</h2><button class="btn secondary" onclick="closeModal()">关闭</button></div>'+body;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
function toast(t){let el=document.createElement("div");el.textContent=t;el.style.cssText="position:fixed;z-index:20;top:22%;left:50%;transform:translateX(-50%);background:#3b3324;border:1px solid #b6975d;color:#f0dfb8;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 30px #000";document.body.appendChild(el);setTimeout(()=>el.remove(),1900)}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
renderStats();home();
</script></body></html>
