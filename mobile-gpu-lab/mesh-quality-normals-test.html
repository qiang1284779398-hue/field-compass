<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第十一阶段：法线与网格质量验证</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:20px;background:#10151d;color:#e8eef7;font:15px system-ui;line-height:1.6}.wrap{max-width:760px;margin:auto}h1{font-size:23px}.card{background:#1a2431;border:1px solid #344355;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#9fb0c4}.big{font-size:23px;font-weight:700;overflow-wrap:anywhere}button{width:100%;padding:14px;border:0;border-radius:10px;background:#5c9cff;color:#071321;font-size:16px;font-weight:700;margin:5px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1118;padding:12px;border-radius:10px;font-size:12px}.bar{height:12px;background:#344355;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#70e0a1}
</style></head><body><main class="wrap">
<h1>第十一阶段：法线、面朝向与网格质量验证</h1>
<p class="muted">在第十阶段的 GPU 球面网格基础上，增加法线数据、三角面朝向修正、几何完整性检查，并将 POSITION、NORMAL、索引一起写入标准 GLB。法线用于后续光照和真实材质渲染。</p>
<div class="card"><div class="muted">运行状态</div><div class="big" id="status">等待开始</div><div class="bar"><i id="progress"></i></div><p class="muted" id="detail">点击开始，在手机 GPU 上生成并验证网格。</p></div>
<button id="run">运行 GPU 网格质量测试</button><button id="download" disabled>下载带法线的 GLB</button>
<div class="card"><div class="muted">质量检查结果</div><div class="big" id="stats">尚未运行</div><p id="verdict" class="muted">将检查顶点、法线、索引、面朝向和 GLB 文件结构。</p></div>
<div class="card"><b>详细日志</b><pre id="log">等待运行。</pre></div>
</main><script>
const $=id=>document.getElementById(id),U=64,V=32,N=(U+1)*(V+1);let blob=null,url=null;
const shader=`
struct Out { data: array<f32>, }
@group(0) @binding(0) var<storage,read_write> out: Out;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
 let id=gid.x;if(id>=2145u){return;}
 let u=id%65u;let v=id/65u;
 let theta=6.28318530718*f32(u)/64.0;
 let phi=3.14159265359*f32(v)/32.0;
 let x=sin(phi)*cos(theta);let y=cos(phi);let z=sin(phi)*sin(theta);
 let k=id*3u;out.data[k]=x;out.data[k+1u]=y;out.data[k+2u]=z;
}`;
function buildGLB(p,n,idx){
 const pLen=p.byteLength,nOff=pLen,nLen=n.byteLength,iOff=(nOff+nLen+3)&~3,iLen=idx.byteLength,binLen=iOff+iLen;
 const bin=new Uint8Array(binLen);bin.set(new Uint8Array(p.buffer,p.byteOffset,pLen),0);bin.set(new Uint8Array(n.buffer,n.byteOffset,nLen),nOff);bin.set(new Uint8Array(idx.buffer,idx.byteOffset,iLen),iOff);
 const min=[-1,-1,-1],max=[1,1,1];
 const j={asset:{version:"2.0",generator:"Mobile GPU Geometry Lab Stage 11"},scene:0,scenes:[{nodes:[0]}],nodes:[{mesh:0}],meshes:[{primitives:[{attributes:{POSITION:0,NORMAL:1},indices:2,mode:4}]}],buffers:[{byteLength:binLen}],bufferViews:[{buffer:0,byteOffset:0,byteLength:pLen,target:34962},{buffer:0,byteOffset:nOff,byteLength:nLen,target:34962},{buffer:0,byteOffset:iOff,byteLength:iLen,target:34963}],accessors:[{bufferView:0,componentType:5126,count:N,type:"VEC3",min,max},{bufferView:1,componentType:5126,count:N,type:"VEC3"},{bufferView:2,componentType:5125,count:idx.length,type:"SCALAR",min:[0],max:[N-1]}]};
 const jb=new TextEncoder().encode(JSON.stringify(j)),jl=(jb.length+3)&~3,bl=(bin.length+3)&~3,total=12+8+jl+8+bl,out=new ArrayBuffer(total),dv=new DataView(out);let o=0;
 dv.setUint32(o,0x46546c67,true);o+=4;dv.setUint32(o,2,true);o+=4;dv.setUint32(o,total,true);o+=4;dv.setUint32(o,jl,true);o+=4;dv.setUint32(o,0x4e4f534a,true);o+=4;new Uint8Array(out,o,jb.length).set(jb);new Uint8Array(out,o+jb.length,jl-jb.length).fill(0x20);o+=jl;dv.setUint32(o,bl,true);o+=4;dv.setUint32(o,0x004e4942,true);o+=4;new Uint8Array(out,o,bin.length).set(bin);
 return new Blob([out],{type:"model/gltf-binary"});
}
async function run(){
 const btn=$('run');btn.disabled=true;$('download').disabled=true;$('status').textContent='正在申请 GPU…';$('progress').style.width='5%';
 try{
  if(!navigator.gpu)throw Error('当前浏览器未开放 WebGPU，请使用最新版 Android Chrome。');
  const adapter=await navigator.gpu.requestAdapter();if(!adapter)throw Error('GPU adapter 不可用。');const device=await adapter.requestDevice();
  const size=N*12,out=device.createBuffer({size,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC}),read=device.createBuffer({size,usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST});
  const mod=device.createShaderModule({code:shader}),ci=await mod.getCompilationInfo(),errs=ci.messages.filter(x=>x.type==='error');if(errs.length)throw Error(errs.map(x=>x.message).join('\n'));
  const pipe=device.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'main'}}),bg=device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:out}}]});
  const enc=device.createCommandEncoder(),pass=enc.beginComputePass();pass.setPipeline(pipe);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(Math.ceil(N/64));pass.end();enc.copyBufferToBuffer(out,0,read,0,size);device.queue.submit([enc.finish()]);
  await read.mapAsync(GPUMapMode.READ);const p=new Float32Array(read.getMappedRange().slice(0));read.unmap();$('progress').style.width='40%';$('status').textContent='GPU 顶点已生成，计算法线并检查面朝向…';
  const normals=new Float32Array(p.length);let finite=true,normalErr=0;
  for(let i=0;i<N;i++){const x=p[i*3],y=p[i*3+1],z=p[i*3+2],len=Math.hypot(x,y,z);if(!Number.isFinite(len)||len<0.99||len>1.01)finite=false;normals[i*3]=x/len;normals[i*3+1]=y/len;normals[i*3+2]=z/len;normalErr=Math.max(normalErr,Math.abs(Math.hypot(normals[i*3],normals[i*3+1],normals[i*3+2])-1));}
  const ids=new Uint32Array(U*V*6);let q=0;
  for(let y=0;y<V;y++)for(let x=0;x<U;x++){const a=y*(U+1)+x,b=a+U+1,d=a+1,c=b+1;
   // 反转绕序，使三角形外法线朝外
   ids[q++]=a;ids[q++]=d;ids[q++]=b;ids[q++]=d;ids[q++]=c;ids[q++]=b;
  }
  let range=true;for(const ix of ids)if(ix>=N){range=false;break;}
  let volume6=0;for(let i=0;i<ids.length;i+=3){const a=ids[i]*3,b=ids[i+1]*3,c=ids[i+2]*3;volume6+=p[a]*(p[b+1]*p[c+2]-p[b+2]*p[c+1])+p[a+1]*(p[b+2]*p[c]-p[b]*p[c+2])+p[a+2]*(p[b]*p[c+1]-p[b+1]*p[c]);}
  const outward=volume6>0,allOk=finite&&range&&outward&&normalErr<0.0001;
  if(!allOk)throw Error('网格质量检查未全部通过：finite='+finite+', indexRange='+range+', outward='+outward+', normalError='+normalErr);
  $('progress').style.width='70%';$('status').textContent='网格检查通过，正在写入 GLB…';
  blob=buildGLB(p,normals,ids);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);
  const head=await blob.slice(0,12).arrayBuffer(),dv=new DataView(head),header=dv.getUint32(0,true)===0x46546c67&&dv.getUint32(4,true)===2&&dv.getUint32(8,true)===blob.size;
  if(!header)throw Error('GLB 文件头校验失败。');
  $('stats').textContent=N.toLocaleString()+' 顶点 · '+(ids.length/3).toLocaleString()+' 三角面';
  $('verdict').textContent='全部通过：顶点有限且位于单位球面，法线单位长度误差小于 0.0001，索引无越界，三角面整体朝外，GLB 2.0 文件头有效。';
  $('status').textContent='第十一阶段质量验证通过';$('status').style.color='#70e0a1';$('progress').style.width='100%';$('download').disabled=false;
  $('log').textContent=['WebGPU compute：PASS','顶点数：'+N,'法线数：'+N,'三角面：'+ids.length/3,'索引越界：'+(!range?'有':'无'),'顶点有限性/单位球半径：'+finite,'法线最大单位长度误差：'+normalErr,'有向体积符号：'+volume6.toFixed(6),'整体面朝外：'+outward,'GLB 2.0 头部与长度：'+header,'POSITION + NORMAL + indices：已写入','文件大小：'+blob.size+' bytes'].join('\n');
  out.destroy();read.destroy();device.destroy();
 }catch(e){$('status').textContent='测试失败';$('status').style.color='#ff8585';$('verdict').textContent=e.message;$('log').textContent=e.stack||String(e);$('progress').style.width='0%';}
 finally{btn.disabled=false;$('detail').textContent='成功后可下载包含顶点、法线和索引的 GLB 模型。';}
}
$('run').addEventListener('click',run);$('download').addEventListener('click',()=>{if(!blob)return;const a=document.createElement('a');a.href=url;a.download='mobile-gpu-sphere-normals.glb';a.click();});
</script></body></html>
