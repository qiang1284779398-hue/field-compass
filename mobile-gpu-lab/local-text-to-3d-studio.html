<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>手机端文字转 3D · 本地生成器</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;background:#10151d;color:#e8eef7;font:15px system-ui;line-height:1.6}.wrap{max-width:820px;margin:auto}h1{font-size:23px}.card{background:#1a2431;border:1px solid #344355;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#9fb0c4}textarea{width:100%;min-height:110px;background:#0c1118;color:#fff;border:1px solid #40536a;border-radius:10px;padding:12px;font:15px system-ui}button{width:100%;padding:14px;border:0;border-radius:10px;background:#5c9cff;color:#071321;font-size:16px;font-weight:700;margin:5px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1118;padding:12px;border-radius:10px;font-size:12px}.big{font-size:22px;font-weight:700}.tag{display:inline-block;background:#293c53;border-radius:20px;padding:3px 9px;margin:3px;font-size:12px}
</style></head><body><main class="wrap">
<h1>手机端文字转 3D · 本地生成器</h1>
<p class="muted">第一版场景编译器：将中文描述解析为可组合的几何部件，在本机浏览器内生成网格并导出 GLB。无需联网请求、无需云端推理。当前采用规则与参数化几何，不冒充已经训练好的神经网络模型；后续会把这里的场景表达作为真正 AI 几何生成模型的输出接口。</p>
<div class="card"><b>输入模型描述</b><textarea id="prompt">一个古代中国武将，穿着绿色铠甲，头戴头盔，手持一把竖直的长柄大刀</textarea><button id="generate">解析描述并生成 3D 模型</button><button id="download" disabled>导出 GLB 模型</button></div>
<div class="card"><div class="muted">生成状态</div><div class="big" id="status">等待输入</div><p id="summary" class="muted">支持人物、头盔、铠甲、刀剑、盾牌、树木、箱子等基础组合词汇。</p><div id="parts"></div></div>
<div class="card"><b>场景结构（Scene Graph）</b><pre id="scene">尚未生成。</pre></div>
<div class="card"><b>生成日志</b><pre id="log">所有几何数据均在当前设备内存中生成。</pre></div>
</main>
<script>
const $=id=>document.getElementById(id);let outputBlob=null,objectUrl=null,lastScene=null;
const M={green:[0.12,0.32,0.18,1],dark:[0.10,0.12,0.15,1],gold:[0.72,0.48,0.12,1],skin:[0.72,0.43,0.30,1],red:[0.48,0.08,0.07,1],steel:[0.48,0.55,0.62,1],wood:[0.28,0.16,0.08,1],leaf:[0.10,0.34,0.13,1],stone:[0.36,0.38,0.40,1]};
function scenePart(name,type,pos,scale,material,extra={}){return {name,type,position:pos,scale,material,...extra};}
function compilePrompt(s){
 const t=s.toLowerCase(),p=[],has=(...w)=>w.some(x=>t.includes(x));
 if(has('人','人物','武将','角色','士兵','关羽','刘备','张飞')){
  p.push(scenePart('躯干铠甲','box',[0,1.55,0],[0.78,0.92,0.42],has('绿','关羽')?'green':'dark'));
  p.push(scenePart('腰甲','box',[0,1.02,0],[0.82,0.22,0.46],'gold'));
  p.push(scenePart('头部','sphere',[0,2.35,0],[0.42,0.48,0.38],'skin'));
  p.push(scenePart('头盔','box',[0,2.72,0],[0.58,0.22,0.48],'gold'));
  p.push(scenePart('左臂','cylinder',[-0.58,1.62,0],[0.16,0.62,0.16],'green',{rotation:[0,0,-0.28]}));
  p.push(scenePart('右臂','cylinder',[0.58,1.62,0],[0.16,0.62,0.16],'green',{rotation:[0,0,0.28]}));
  p.push(scenePart('左腿','cylinder',[-0.22,0.48,0],[0.19,0.62,0.19],'dark'));
  p.push(scenePart('右腿','cylinder',[0.22,0.48,0],[0.19,0.62,0.19],'dark'));
  if(has('胡子','长须','关羽'))p.push(scenePart('长须','cone',[0,1.98,0.32],[0.13,0.5,0.13],'dark'));
 }
 if(has('刀','剑','武器','长柄')){
  const x=has('右手','右边')?0.95:0.9,z=0.05;
  p.push(scenePart('武器握柄','cylinder',[x,1.25,z],[0.065,1.25,0.065],'wood'));
  p.push(scenePart(has('刀','偃月')?'刀刃':'剑刃','box',[x,2.12,z],[0.14,0.9,0.035],'steel'));
  if(has('偃月','大刀','长柄大刀'))p.push(scenePart('刀头外扩','cone',[x,2.55,z],[0.22,0.3,0.10],'steel'));
  p.push(scenePart('护手','box',[x,1.72,z],[0.34,0.07,0.12],'gold'));
 }
 if(has('盾'))p.push(scenePart('盾牌','box',[-0.95,1.5,0.05],[0.16,0.85,0.62],'gold'));
 if(has('树','松树')){p.push(scenePart('树干','cylinder',[0,0.8,0],[0.16,0.8,0.16],'wood'));p.push(scenePart('树冠','cone',[0,1.8,0],[0.8,1.2,0.8],'leaf'));}
 if(has('箱子','木箱')){p.push(scenePart('箱体','box',[0,0.55,0],[1.2,1.1,0.8],'wood'));p.push(scenePart('箱盖','box',[0,1.13,0],[1.25,0.14,0.84],'gold'));}
 if(!p.length){p.push(scenePart('主体方块','box',[0,0.5,0],[1,1,1],'steel'));}
 return {name:s.trim().slice(0,40)||'未命名模型',parts:p,units:'meter',generator:'On-device procedural scene compiler v0.1'};
}
function rot(v,r){let [x,y,z]=v,[ax,ay,az]=r||[0,0,0];let c=Math.cos(ax),s=Math.sin(ax);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(ay);s=Math.sin(ay);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(az);s=Math.sin(az);[x,y]=[x*c-y*s,x*s+y*c];return [x,y,z];}
function meshPart(part){
 const [cx,cy,cz]=part.position,[sx,sy,sz]=part.scale,r=part.rotation||[0,0,0],v=[],n=[],idx=[];
 const add=(a,b,c)=>{const A=rot([a[0]*sx,a[1]*sy,a[2]*sz],r).map((q,i)=>q+[cx,cy,cz][i]),B=rot([b[0]*sx,b[1]*sy,b[2]*sz],r).map((q,i)=>q+[cx,cy,cz][i]),C=rot([c[0]*sx,c[1]*sy,c[2]*sz],r).map((q,i)=>q+[cx,cy,cz][i]);const ab=B.map((q,i)=>q-A[i]),ac=C.map((q,i)=>q-A[i]),nn=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]],L=Math.hypot(...nn)||1;for(const P of [A,B,C]){v.push(...P);n.push(nn[0]/L,nn[1]/L,nn[2]/L);idx.push(idx.length);}};
 const quad=(a,b,c,d)=>{add(a,b,c);add(a,c,d);};
 if(part.type==='box'){
 const a=[-.5,-.5,-.5],b=[.5,-.5,-.5],c=[.5,.5,-.5],d=[-.5,.5,-.5],e=[-.5,-.5,.5],f=[.5,-.5,.5],g=[.5,.5,.5],h=[-.5,.5,.5];
 quad(a,d,c,b);quad(e,f,g,h);quad(a,e,h,d);quad(b,c,g,f);quad(a,b,f,e);quad(d,h,g,c);
 }else if(part.type==='sphere'){
 const rings=12,segs=20;for(let y=0;y<rings;y++)for(let x=0;x<segs;x++){const point=(yy,xx)=>{const ph=Math.PI*yy/rings,th=2*Math.PI*xx/segs;return [Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];};const a=point(y,x),b=point(y+1,x),c=point(y+1,x+1),d=point(y,x+1);quad(a,b,c,d);}
 }else{
 const seg=20,top=part.type==='cone';for(let i=0;i<seg;i++){const a=2*Math.PI*i/seg,b=2*Math.PI*(i+1)/seg,A=[Math.cos(a),-.5,Math.sin(a)],B=[Math.cos(b),-.5,Math.sin(b)],C=top?[0,.5,0]:[Math.cos(b),.5,Math.sin(b)],D=top?[0,.5,0]:[Math.cos(a),.5,Math.sin(a)];add(A,B,C);if(!top)add(A,C,D);add([0,-.5,0],B,A);if(!top)add([0,.5,0],D,C);}
 }
 return {positions:new Float32Array(v),normals:new Float32Array(n),indices:new Uint32Array(idx),material:part.material,name:part.name};
}
function makeGLB(meshes){
 const allP=[],allN=[],allI=[],views=[],access=[],gltfMeshes=[],nodes=[],materials=[],matIndex={};let po=0,no=0,io=0,idxBase=0;
 const align4=x=>(x+3)&~3;let chunks=[];
 function append(typed){const bytes=new Uint8Array(typed.buffer,typed.byteOffset,typed.byteLength),offset=chunks.reduce((s,c)=>s+c.length,0),pad=align4(offset)-offset;if(pad)chunks.push(new Uint8Array(pad));const actual=chunks.reduce((s,c)=>s+c.length,0);chunks.push(new Uint8Array(bytes));return {offset:actual,length:bytes.length};}
 for(const m of meshes){const p=append(m.positions),n=append(m.normals),ix=append(m.indices);const mi=matIndex[m.material]??(matIndex[m.material]=materials.push({pbrMetallicRoughness:{baseColorFactor:M[m.material]||M.steel,metallicFactor:m.material==='steel'?0.75:0.05,roughnessFactor:0.7}})-1);
  const pView=views.push({buffer:0,byteOffset:p.offset,byteLength:p.length,target:34962})-1,nView=views.push({buffer:0,byteOffset:n.offset,byteLength:n.length,target:34962})-1,iView=views.push({buffer:0,byteOffset:ix.offset,byteLength:ix.length,target:34963})-1;
  const pAcc=access.push({bufferView:pView,componentType:5126,count:m.positions.length/3,type:'VEC3'})-1,nAcc=access.push({bufferView:nView,componentType:5126,count:m.normals.length/3,type:'VEC3'})-1,iAcc=access.push({bufferView:iView,componentType:5125,count:m.indices.length,type:'SCALAR'})-1;
  gltfMeshes.push({name:m.name,primitives:[{attributes:{POSITION:pAcc,NORMAL:nAcc},indices:iAcc,material:mi}]});nodes.push({mesh:gltfMeshes.length-1,name:m.name});
 }
 const binLen=chunks.reduce((s,c)=>s+c.length,0),bin=new Uint8Array(binLen);let off=0;for(const c of chunks){bin.set(c,off);off+=c.length;}
 const j={asset:{version:'2.0',generator:'On-device text-to-3D scene compiler'},scene:0,scenes:[{nodes:nodes.map((_,i)=>i)}],nodes,meshes:gltfMeshes,materials,buffers:[{byteLength:binLen}],bufferViews:views,accessors:access};
 const jb=new TextEncoder().encode(JSON.stringify(j)),jl=align4(jb.length),bl=align4(bin.length),total=12+8+jl+8+bl,out=new ArrayBuffer(total),dv=new DataView(out);let o=0;dv.setUint32(o,0x46546c67,true);o+=4;dv.setUint32(o,2,true);o+=4;dv.setUint32(o,total,true);o+=4;dv.setUint32(o,jl,true);o+=4;dv.setUint32(o,0x4e4f534a,true);o+=4;new Uint8Array(out,o,jb.length).set(jb);new Uint8Array(out,o+jb.length,jl-jb.length).fill(0x20);o+=jl;dv.setUint32(o,bl,true);o+=4;dv.setUint32(o,0x004e4942,true);o+=4;new Uint8Array(out,o,bin.length).set(bin);return new Blob([out],{type:'model/gltf-binary'});
}
function generate(){try{const scene=compilePrompt($('prompt').value),meshes=scene.parts.map(meshPart);outputBlob=makeGLB(meshes);if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(outputBlob);lastScene=scene;$('status').textContent='模型生成完成';$('status').style.color='#70e0a1';$('summary').textContent='生成 '+meshes.length+' 个独立部件；包含几何顶点、三角面、法线与 PBR 材质。文件大小 '+(outputBlob.size/1024).toFixed(1)+' KiB。';$('parts').innerHTML=scene.parts.map(p=>'<span class="tag">'+p.name+'</span>').join('');$('scene').textContent=JSON.stringify(scene,null,2);$('log').textContent='本地解析完成。\n部件数：'+meshes.length+'\n顶点数：'+meshes.reduce((s,m)=>s+m.positions.length/3,0)+'\n三角面数：'+meshes.reduce((s,m)=>s+m.indices.length/3,0)+'\n材质数：'+new Set(scene.parts.map(p=>p.material)).size+'\n导出格式：GLB 2.0\n联网请求：0\n模型来源：参数化规则组合（非神经网络推理）';$('download').disabled=false;}catch(e){$('status').textContent='生成失败';$('log').textContent=e.stack||String(e);}}
$('generate').addEventListener('click',generate);$('download').addEventListener('click',()=>{if(!outputBlob)return;const a=document.createElement('a');a.href=objectUrl;a.download='local-text-to-3d.glb';a.click();});
</script></body></html>
