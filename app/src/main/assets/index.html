function say(t){log(t);save()}

function spyOfficePanel(){ensureSpyNetwork();return box("密探机关 · 长期谍报",'<div class="statsline"><span>在册密探</span><b>'+s.spyAgents.length+' / 3</b></div><div class="statsline"><span>反间防谍</span><b>'+(s.counterIntelUntil>=s.day?"戒备中 · 至第"+s.counterIntelUntil+"日":"未布防")+'</b></div><p class="muted">密探拥有能力、忠诚、身份掩护和行动冷却。情报、断粮、谣言与反间行动会留下持续记录。</p><button class="btn primary" onclick="openSpyOffice()">进入密探机关</button>')}
function openSpyOffice(){ensureSpyNetwork();let targets=Object.keys(s.enemyGarrisons||{}).map(Number).filter(i=>s.regionControl[i]==="enemy"&&(s.explored||[]).includes(i));let opts=targets.map(i=>'<option value="'+i+'">'+CHAPTERS[Math.min(i,24)].region+' · '+enemyFaction(i)+'</option>').join("");let body='<div class="banner"><h3>密探档案与行动部署</h3><p>密探可在敌境潜伏、刺探兵力、破坏军粮、散布谣言；失败可能暴露身份或被捕。每次行动都要承担黄金与时间成本。</p><span class="tag">在册 '+s.spyAgents.length+'/3</span><span class="tag">情报 '+s.intel+'</span></div><label>行动目标区域</label><select id="spyTarget" class="field" style="width:100%;margin:8px 0"><option value="">选择已探索的敌方区域</option>'+opts+'</select><div class="list">'+(s.spyAgents.length?s.spyAgents.map(a=>'<div class="spy-agent"><b>🕵️ '+a.name+' · '+a.codename+'</b><div class="spy-meta">专长：'+a.specialty+' · 技能 '+a.skill+'/5 · 忠诚 '+a.loyalty+'/100 · 掩护 '+a.cover+'/5<br>状态：'+(a.caughtUntil>=s.day?'被捕，预计第'+(a.caughtUntil+1)+'日归队':a.infiltration&&a.infiltration.untilDay>=s.day?'潜伏中：'+CHAPTERS[Math.min(a.infiltration.region,24)].region+'，至第'+a.infiltration.untilDay+'日':a.readyDay>s.day?'行动疲劳，'+(a.readyDay-s.day)+'日后可用':'待命')+'</div><div class="btnrow"><button class="btn" '+(a.readyDay>s.day||a.caughtUntil>=s.day?'disabled':'')+' onclick="spyMission(\''+a.id+'\',\'intel\')">刺探军情 · 35金</button><button class="btn" '+(a.readyDay>s.day||a.caughtUntil>=s.day?'disabled':'')+' onclick="spyMission(\''+a.id+'\',\'infiltrate\')">潜伏敌城 · 100金</button><button class="btn" '+(a.readyDay>s.day||a.caughtUntil>=s.day?'disabled':'')+' onclick="spyMission(\''+a.id+'\',\'sabotage\')">断敌粮道 · 80金50粮</button><button class="btn" '+(a.readyDay>s.day||a.caughtUntil>=s.day?'disabled':'')+' onclick="spyMission(\''+a.id+'\',\'rumor\')">散布谣言 · 60金</button><button class="btn ghost" '+(a.readyDay>s.day||a.caughtUntil>=s.day?'disabled':'')+' onclick="spyMission(\''+a.id+'\',\'counter\')">反间布防 · 50金</button></div></div>').join(""):'<p class="muted">尚无密探。招募后才能执行长期潜伏任务。</p>')+'</div><button class="btn primary" '+(s.spyAgents.length>=3?'disabled':'')+' onclick="recruitSpy()">招募密探 · 180金</button><button class="btn" onclick="trainSpy()">训练一名密探 · 45金</button><div class="box"><h3>近期谍报</h3>'+(s.spyLog.length?s.spyLog.slice(0,6).map(x=>'<p class="muted">· '+x+'</p>').join(""):'<p class="muted">暂无行动记录。</p>')+'</div>';modal("密探机关 · 谍报司",body)}
function recruitSpy(){ensureSpyNetwork();if(s.spyAgents.length>=3)return toast("密探编制已满，最多三人");if(s.gold<180)return toast("招募密探需要180黄金");s.gold-=180;let names=["顾影","夜枭","沈鸦","闻蝉","青梧","无咎"],specialties=["伪装潜伏","军情刺探","破坏渗透","反间识破"],idx=(s.day+s.spyAgents.length)%names.length;let n=names[idx],sp=specialties[(s.day+s.spyAgents.length)%specialties.length];s.spyAgents.push({id:"spy_"+s.day+"_"+s.spyAgents.length+"_"+Math.floor(Math.random()*999),name:n,codename:sp,specialty:sp,skill:1,loyalty:72,cover:2,readyDay:s.day,caughtUntil:0});s.spyLog.unshift("第"+s.day+"日：招募密探"+n+"，专长"+sp);log("密探机关招募"+n+"加入谍报司");save();openSpyOffice();toast("密探已入册")}
function trainSpy(){ensureSpyNetwork();if(!s.spyAgents.length)return toast("先招募一名密探");if(s.gold<45)return toast("训练需要45黄金");let a=s.spyAgents.slice().sort((x,y)=>x.skill-y.skill)[0];if(a.skill>=5)return toast("密探能力已达上限");s.gold-=45;a.skill++;a.loyalty=Math.min(100,a.loyalty+3);s.spyLog.unshift("第"+s.day+"日："+a.name+"完成训练，技能提升至"+a.skill);save();openSpyOffice();toast(a.name+"的谍报能力提升")}
function recoverSpyAgents(){ensureSpyNetwork();s.spyAgents.forEach(a=>{if(a.caughtUntil&&a.caughtUntil<s.day){a.caughtUntil=0;a.loyalty=Math.max(25,a.loyalty-8);a.cover=Math.max(1,a.cover-1);s.spyLog.unshift("第"+s.day+"日："+a.name+"脱离拘押，但身份掩护受损")}if(a.infiltration&&a.infiltration.untilDay<s.day){s.spyLog.unshift("第"+s.day+"日："+a.name+"结束敌境潜伏并返回");a.infiltration=null}});s.spyLog=s.spyLog.slice(0,20)}
function resolveEnemyEspionage(force){ensureSpyNetwork();if(!force&&(s.day%3!==0||Math.random()>.22))return "";if(s.counterIntelUntil>=s.day){s.spyLog.unshift("第"+s.day+"日：反间网截获敌方细作，未能破坏军府补给");log("反间机关识破敌方细作，挫败一次渗透");return "敌方细作被我方反间网截获"}let loss=Math.min(s.food,Math.max(20,Math.ceil(s.food*.035)));s.food-=loss;s.morale=Math.max(10,s.morale-3);s.spyLog.unshift("第"+s.day+"日：敌方细作潜入军府，焚毁粮草"+loss+"，军心-3");log("敌方细作袭扰军府，粮草损失"+loss);return "敌方细作袭扰，粮草损失"+loss}
function spyMission(id,mission){ensureSpyNetwork();let a=s.spyAgents.find(x=>x.id===id);if(!a)return toast("密探档案不存在");if(a.caughtUntil>=s.day)return toast("该密探仍被敌方拘押");if(a.readyDay>s.day)return toast("密探尚在行动恢复期");let target=Number(document.getElementById("spyTarget")?.value);if(mission!=="counter"&&(!Number.isInteger(target)||!s.enemyGarrisons[target]||s.regionControl[target]!=="enemy"||!(s.explored||[]).includes(target)))return toast("请选择已探索的敌方区域");let costs={intel:{gold:35},infiltrate:{gold:100},sabotage:{gold:80,food:50},rumor:{gold:60},counter:{gold:50}}[mission];if(!costs||!costOK(costs))return toast("行动资源不足");spend(costs);a.readyDay=s.day+(mission==="sabotage"?4:mission==="intel"?2:mission==="infiltrate"?1:3);if(mission==="infiltrate"){a.infiltration={region:target,untilDay:s.day+3};s.spyLog.unshift("第"+s.day+"日："+a.name+"以商旅身份潜入"+CHAPTERS[Math.min(target,24)].region+"，建立三日情报据点");log(a.name+"开始潜伏"+CHAPTERS[Math.min(target,24)].region);save();openSpyOffice();toast("密探已潜入敌城，三日内行动成功率提高");return}if(mission==="counter"){s.counterIntelUntil=s.day+4;a.loyalty=Math.min(100,a.loyalty+4);s.spyLog.unshift("第"+s.day+"日："+a.name+"建立反间联络网，四日内提高识破敌方细作的能力");log(a.name+"部署反间防谍");save();openSpyOffice();toast("反间防线已建立，持续四日");return}let specialtyBonus=a.specialty==="军情刺探"&&mission==="intel"?.14:a.specialty==="破坏渗透"&&mission==="sabotage"?.14:a.specialty==="伪装潜伏"&&mission==="rumor"?.12:0;let infiltrationBonus=a.infiltration&&a.infiltration.region===target&&a.infiltration.untilDay>=s.day?.15:0;let chance=Math.max(.25,Math.min(.92,.48+a.skill*.075+a.cover*.045+(a.loyalty-60)*.002+specialtyBonus+infiltrationBonus+((s.enemyMoraleByRegion[target]||70)<30?.08:0)));let success=Math.random()<chance,region=CHAPTERS[Math.min(target,24)].region,g=s.enemyGarrisons[target];if(success){if(mission==="intel"){s.spyReports[target]={day:s.day,inf:g.inf,cav:g.cav,arch:g.arch,fort:g.fort,general:enemyCommander(target),faction:factionForRegion(target).name,deep:true};s.intel=Math.min(20,s.intel+3);s.spyLog.unshift("第"+s.day+"日："+a.name+"潜入"+region+"，查明敌军部署与主将")}else if(mission==="sabotage"){let before=g.inf+g.cav+g.arch,loss=Math.max(5,Math.ceil(before*(.1+a.skill*.015))),left=loss;for(let k of ["inf","cav","arch"]){let cut=Math.min(g[k],Math.ceil(loss*(k==="inf"?.5:.25)));g[k]-=cut;left-=cut}if(left>0)g.inf=Math.max(0,g.inf-left);s.enemyMoraleByRegion[target]=Math.max(15,(s.enemyMoraleByRegion[target]||70)-18);s.spyReports[target]={day:s.day,inf:g.inf,cav:g.cav,arch:g.arch,fort:g.fort,general:enemyCommander(target),faction:factionForRegion(target).name,sabotaged:true,deep:true};s.spyLog.unshift("第"+s.day+"日："+a.name+"烧毁"+region+"粮秣，敌军损失约"+loss+"人")}else{s.enemyMoraleByRegion[target]=Math.max(10,(s.enemyMoraleByRegion[target]||70)-20);s.spyLog.unshift("第"+s.day+"日："+a.name+"在"+region+"散布谣言，敌军士气受挫")};a.loyalty=Math.min(100,a.loyalty+2);playSfx("critical");toast("密探行动成功："+region)}else{a.loyalty=Math.max(0,a.loyalty-10);let captured=Math.random()>.55;if(captured)a.caughtUntil=s.day+2;else a.cover=Math.max(0,a.cover-1);s.spyLog.unshift("第"+s.day+"日："+a.name+"在"+region+"行动失败，"+(captured?"被敌方拘押":"身份掩护受损"));playSfx("hit");toast(captured?"行动失败：密探被捕":"行动失败：身份暴露，掩护下降")}save();openSpyOffice()}
function campaignLegacy(){let humanity=Math.min(4,Math.floor((s.flags&&s.flags.humanity||0)/3)),strategy=Math.min(6,Math.floor((s.flags&&s.flags.strategy||0)/2));return {humanity,strategy}}
function storyEcho(chapter){let legacy=campaignLegacy(),history=Array.isArray(s.choiceHistory)?s.choiceHistory.filter(Boolean):[],f=factionForRegion(chapter),tier=factionRelationTier(s.factionRelations&&s.factionRelations[f.id]||-20),local=tier==="友善"?"当地"+f.name+"已愿意与我军互通消息。":tier==="中立"?"当地"+f.name+"暂时观望，仍有交涉余地。":tier==="戒备"?"当地"+f.name+"保持戒心，军需与情报往来受限。":"当地"+f.name+"敌意未消，前线必须提防其反扑。";if(chapter===0&&!history.length)return "初入乱世，你的第一道军令将决定军中如何看待百姓与胜利。"+local;let recent=history.slice(-3).map(x=>x.choice===0?"仁义":"谋略");let echo=recent.length?"近三次军议留下的风声："+recent.join("、")+"。":"";if(legacy.humanity&&legacy.strategy)return echo+local+"军中既有仁义之名，也有奇谋之声：本场将士防御提升，敌军士气受到压制。";if(legacy.humanity)return echo+local+"沿途百姓记得你曾施以援手，本场民众运粮支援，前线将士防御提升。";if(legacy.strategy)return echo+local+"数次奇袭令敌军提高戒备，但你已掌握其弱点，本场敌军士气将下降。";return echo+local+"各方仍在观察你的选择；名声尚未定型，下一次抉择可能改变盟友态度."}

function topInit(){checkInvariants();save();render();if(s.pendingSiege)showPendingSiege()}
topInit();
</script>
</body></html>
