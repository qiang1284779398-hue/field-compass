<html lang="zh-CN">
<head>

<meta name="theme-color" content="#101713"><title>幻想三国：山河志</title>
<style>
:root{--bg:#101713;--panel:#1c2820;--panel2:#26352a;--gold:#e6c58c;--muted:#b0bdad;--line:#657454;--red:#cb7061;--blue:#8cb3d2;--green:#9ec18a}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#465b42,#18231b 52%,#101713 100%);color:#eee8d9;font-family:"Noto Serif SC","Songti SC",serif;font-size:14px;min-height:100vh}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.top{position:sticky;top:0;z-index:6;padding:10px 12px 9px;background:linear-gradient(130deg,#26382aee,#121a15f5);backdrop-filter:blur(10px);border-bottom:1px solid #88734b;box-shadow:0 5px 18px #0005}
.eyebrow{font-size:9px;letter-spacing:3px;color:var(--gold)}.brand{display:flex;align-items:center;justify-content:space-between;margin:5px 0 9px}.brand h1{margin:0;font-size:25px;letter-spacing:5px;color:#f3dbab;text-shadow:0 2px 12px #dbb56d44}.brand small{font-size:10px;color:#b5c0ae}.music-toggle{margin-top:5px;padding:4px 8px;border:1px solid #756542;border-radius:6px;background:#1c2a20;color:#e8cf9e;font-size:9px}
.resources{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.res{min-width:0;text-align:center;background:#101812;border:1px solid #52634d;border-radius:6px;padding:5px 1px}.res b{display:block;font:700 13px system-ui;color:#f0d49d}.res span{font-size:8px;color:#b7c1b1}
.main{max-width:820px;margin:auto;padding:11px 12px 100px}.head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.head h2{font-size:17px;color:var(--gold);margin:0}.sub{font-size:10px;color:#bac4b2}
.banner{position:relative;overflow:hidden;border:1px solid #92774c;border-radius:11px;padding:15px;background:linear-gradient(130deg,#40543d,#1d2b21 58%,#3b3021);box-shadow:inset 0 1px #ffffff16,0 7px 18px #0003}.banner:after{content:"漢";position:absolute;right:9px;top:-27px;font-size:132px;color:#f0d7a0;opacity:.07;pointer-events:none}.banner h3{font-size:19px;color:#f1d8a7;margin:4px 0 7px}.banner p{font-size:11px;line-height:1.9;color:#d0d6c8;margin:5px 0;max-width:87%}.tag{display:inline-block;border:1px solid #95794d;color:#ebd09b;border-radius:15px;padding:3px 8px;font-size:9px;margin:5px 4px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.tile{min-height:89px;text-align:left;padding:11px;border:1px solid #4e604b;border-radius:9px;background:linear-gradient(145deg,#2d4031,#18241c);box-shadow:0 4px 13px #0003;transition:.15s}.tile:active{transform:scale(.98);border-color:var(--gold)}.tile b{display:block;color:#efd29b;font-size:13px;margin:2px 0 6px}.tile small{display:block;color:#b9c5b3;font-size:9px;line-height:1.65}.wide{grid-column:1/-1}
.box{margin-top:11px;padding:12px;background:#1a261f;border:1px solid #465744;border-radius:9px}.box h3{margin:0 0 8px;font-size:14px;color:#e9cb91}.box p{font-size:11px;color:#c5cebf;line-height:1.8}.statsline{display:flex;justify-content:space-between;gap:8px;margin:7px 0;color:#c7cfbf;font-size:10px}.statsline b{color:#f0d49d}
.btn{border:1px solid #90764b;border-radius:7px;padding:9px 10px;background:linear-gradient(#56482f,#30281e);color:#f1d9aa;font-size:11px;min-height:36px}.btn.primary{background:linear-gradient(#927044,#604829);border-color:#c7a36b}.btn.ghost{background:#202d23;border-color:#576951}.btn.red{background:#542e29;border-color:#a55e53}.btn.blue{background:#263c4b;border-color:#668da3}.btnrow{display:flex;gap:7px;margin-top:9px}.btnrow>*{flex:1;min-width:0}
.list{display:grid;gap:8px;margin-top:9px}.rowcard{display:flex;align-items:center;gap:9px;padding:9px;background:linear-gradient(120deg,#26352a,#1a251e);border:1px solid #4c5d49;border-radius:8px}.portrait{width:50px;height:58px;flex:none;display:grid;place-items:center;border:1px solid #8b774d;border-radius:6px;background:radial-gradient(circle at 50% 25%,#d5b77d,#596446 47%,#1c281f);font-size:27px;overflow:hidden}.info{flex:1;min-width:0}.info b{display:block;color:#f0d29b;font-size:12px}.info small{display:block;color:#bdc8b8;font-size:9px;line-height:1.6;margin-top:3px}.bar{height:5px;background:#101713;border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6e9869,#b1c98c);transition:width .35s}.muted{color:var(--muted);font-size:10px;line-height:1.7}.gold{color:#f2d49a}.divider{height:1px;background:#455542;margin:10px 0}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));background:#101713f5;border-top:1px solid #756542;backdrop-filter:blur(9px)}.nav button{flex:1;background:none;border:0;color:#aebaaa;font-size:9px;padding:1px}.nav button span{display:block;font-size:18px;margin-bottom:2px}.nav button.active{color:#f0cf92}
.backdrop{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:15px;background:linear-gradient(#27362a,#17221b);border:1px solid #a08451;border-radius:15px 15px 0 0;box-shadow:0 -12px 45px #0009}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}.modalhead h3{margin:0;color:#f1d49e;font-size:16px}.modal p{font-size:11px;color:#c8d0c0;line-height:1.9}
.toast{position:fixed;z-index:40;left:50%;bottom:84px;transform:translateX(-50%);max-width:90vw;width:max-content;padding:11px 15px;border:1px solid #d0b177;border-radius:9px;background:#17231bf5;color:#f6dfb5;box-shadow:0 7px 25px #000a;font-size:12px;line-height:1.6;text-align:center;pointer-events:none;animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.stagebar{display:flex;justify-content:space-between;align-items:center;margin:9px 0;color:#d2d9ca;font-size:10px}.progress{height:6px;border-radius:8px;background:#0f1711;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8d7044,#e2c486)}
/* cinematic battle */
.battle-shell{border:1px solid #a08755;border-radius:11px;overflow:hidden;background:#152019;box-shadow:0 7px 22px #0006}
.battle-top{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:linear-gradient(100deg,#1b2c20,#30271d);font-size:10px;color:#edd19a}
.doctrine-chip{display:inline-block;padding:3px 7px;border:1px solid #b69a62;border-radius:12px;background:#1c281f;color:#f1d69e;font-size:9px;white-space:nowrap}.battle-scene:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0}.battle-scene.doctrine-yellow:after{background:radial-gradient(ellipse at 50% 80%,#e7c56b66,transparent 65%);animation:doctrinePulse .8s ease-out}.battle-scene.doctrine-xiliang:after{background:linear-gradient(105deg,transparent 25%,#d8b16c66 50%,transparent 72%);animation:doctrineSweep .65s ease-out}.battle-scene.doctrine-yuan:after{background:linear-gradient(180deg,#aab9a844,transparent 65%);animation:doctrinePulse .8s ease-out}.battle-scene.doctrine-cao:after{background:radial-gradient(ellipse at 50% 50%,#e8d9a455,transparent 60%);animation:doctrinePulse .8s ease-out}.battle-scene.doctrine-shu:after{background:linear-gradient(0deg,#718e5c66,transparent 65%);animation:doctrinePulse .8s ease-out}.battle-scene.doctrine-jingwu:after{background:repeating-linear-gradient(105deg,transparent 0 22px,#d9e8d966 23px 25px,transparent 26px 42px);animation:doctrineSweep .65s ease-out}@keyframes doctrinePulse{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}@keyframes doctrineSweep{0%{opacity:0;transform:translateX(-18%)}35%{opacity:.9}100%{opacity:0;transform:translateX(18%)}}.warrior.ai-targeted{outline:2px solid #e6ad55;outline-offset:3px;box-shadow:0 0 0 5px #e6ad5530,0 0 18px #f0bc67aa;animation:enemyLockPulse .72s ease-in-out infinite alternate}.warrior.ai-targeted:before{content:"";position:absolute;left:50%;bottom:25px;width:78px;height:78px;transform:translateX(-50%);border:2px solid #ffd27a;border-radius:50%;box-shadow:0 0 13px #ffc36c;pointer-events:none;z-index:1;animation:enemyLockRing .9s ease-out infinite}.warrior.ai-targeted:after{content:"⚠ 敌军锁定";position:absolute;left:50%;top:-19px;transform:translateX(-50%);padding:2px 5px;border-radius:8px;background:#6d321e;color:#ffe2a8;font-size:9px;white-space:nowrap;z-index:6}@keyframes enemyLockPulse{from{filter:brightness(1)}to{filter:brightness(1.22)}}@keyframes enemyLockRing{0%{opacity:.95;scale:.72}100%{opacity:0;scale:1.35}}@media(prefers-reduced-motion:reduce){.warrior.ai-targeted,.warrior.ai-targeted:before{animation:none!important}}.battle-scene{height:300px;position:relative;overflow:hidden;background:linear-gradient(180deg,#72816b 0%,#9b936e 42%,#746345 43%,#4d5638 48%,#2d402b 100%);isolation:isolate}
.battle-scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#c6d5c477,transparent 42%),repeating-linear-gradient(170deg,transparent 0 36px,#ffffff0b 37px 38px);z-index:-1}
.horizon{position:absolute;left:0;right:0;top:40%;height:40px;background:linear-gradient(180deg,#253b2b99,#24352200);filter:blur(4px)}
.flag{position:absolute;top:32px;width:6px;height:93px;background:#3c3327;box-shadow:2px 2px 2px #0005}.flag:after{content:"";position:absolute;top:0;left:5px;width:45px;height:29px;background:#9d3830;clip-path:polygon(0 0,100% 12%,76% 56%,100% 100%,0 88%);box-shadow:inset 0 0 0 1px #e4bc78}.flag.right{right:22px;left:auto}.flag.right:after{background:#354e75}
.formation-row{position:absolute;z-index:2;left:2%;right:2%;display:flex;justify-content:space-around;align-items:flex-end;gap:4px}.formation-row.friendly{bottom:13px}.formation-row.hostile{top:11px;transform:scale(.92)}
.warrior{position:relative;flex:1;max-width:105px;min-width:0;height:119px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:0;background:transparent;text-align:center;transition:filter .2s;overflow:visible}
.warrior .body-art{position:relative;width:75px;height:91px;display:block;filter:drop-shadow(0 5px 2px #0007);transition:transform .15s}.warrior .label{width:100%;padding:3px 1px;background:#142018df;border:1px solid #748164;border-radius:5px;color:#f3d9a7;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.warrior.enemy .label{border-color:#a46a57;background:#261a18e8}.warrior .unit-hp{width:75%;height:4px;background:#111;border-radius:5px;margin-top:3px;overflow:hidden}.warrior .unit-hp i{display:block;height:100%;background:#91bc7a;transition:width .35s}.warrior.enemy .unit-hp i{background:#db7665}
.warrior.dead{opacity:.22;filter:grayscale(1)}.warrior.selected .label{outline:2px solid #f2d49a;box-shadow:0 0 12px #efcd82}.warrior.enemy[role="button"]{cursor:pointer}.warrior.targeted .label{outline:2px solid #f2d49a;box-shadow:0 0 14px #f2d49a99}.warrior.targeted .body-art{filter:drop-shadow(0 0 9px #ffcc69) brightness(1.12)}
.warrior.attack-right .body-art{animation:chargeRight .48s cubic-bezier(.15,.8,.2,1)}.warrior.attack-left .body-art{animation:chargeLeft .48s cubic-bezier(.15,.8,.2,1)}.warrior.cast .body-art{animation:castHero .7s ease}.warrior.hurt .body-art{animation:bodyHit .36s ease}
@keyframes chargeRight{0%{transform:translate(0,0) scale(1)}48%{transform:translate(66px,-7px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes chargeLeft{0%{transform:translate(0,0) scale(1)}48%{transform:translate(-66px,-7px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes castHero{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) scale(1.2);filter:drop-shadow(0 0 15px #f6dc91)}100%{transform:translateY(0) scale(1)}}
@keyframes bodyHit{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-5deg)}55%{transform:translateX(8px) rotate(5deg)}}
.battle-vs{position:absolute;left:0;right:0;top:47%;text-align:center;color:#f5d9a1;font-weight:bold;letter-spacing:5px;font-size:12px;text-shadow:0 2px 5px #000}.slash-fx{position:absolute;z-index:9;left:50%;top:43%;width:115px;height:52px;transform:translate(-50%,-50%) rotate(-22deg);border-top:7px solid #fff2bd;border-bottom:3px solid #ffb86e;border-radius:50%;filter:drop-shadow(0 0 12px #fff);animation:slash .42s ease-out forwards;pointer-events:none}
@keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-40deg) scale(.25)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) rotate(9deg) scale(1.5)}}
.damage{position:absolute;z-index:12;left:50%;top:10%;transform:translateX(-50%);font:900 20px system-ui;color:#ffedbd;text-shadow:0 3px 5px #000;animation:damageUp .95s ease-out forwards;pointer-events:none;white-space:nowrap}.damage.critical{font-size:25px;color:#ff987b}
@keyframes damageUp{0%{opacity:0;transform:translate(-50%,10px) scale(.65)}18%{opacity:1;transform:translate(-50%,0) scale(1.25)}100%{opacity:0;transform:translate(-50%,-46px) scale(.95)}}
.fx-flash{position:absolute;inset:0;z-index:7;background:radial-gradient(circle at 50% 52%,#fff9,transparent 55%);animation:fadeFlash .35s ease-out forwards;pointer-events:none}
@keyframes fadeFlash{to{opacity:0}}.unit-status{font-size:8px;color:#ffbd82;background:#341d18cc;border-radius:4px;padding:1px 4px;margin:2px auto;max-width:95%;white-space:nowrap;overflow:hidden}.battle-scene:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(165deg,transparent 0 23px,#d9d0a8 24px 25px,transparent 26px 50px),radial-gradient(ellipse at 50% 90%,#9b7c45 0,transparent 60%)}.terrain-2:before{background:repeating-linear-gradient(0deg,transparent 0 18px,#8fc5d7 19px 21px,transparent 22px 39px)}.terrain-3:before{background:radial-gradient(ellipse at 15% 30%,#66805a 0 8%,transparent 9%),radial-gradient(ellipse at 85% 20%,#536b48 0 10%,transparent 11%)}.battle-status{padding:7px 10px;background:#111a14;color:#d9cfb4;font-size:9px;display:flex;justify-content:space-between}
.combat-log{padding:8px 10px;max-height:96px;overflow:auto;background:#111914;color:#c8d1c0;font-size:9px;line-height:1.7;border-top:1px solid #43513e}.combat-log div{animation:logIn .22s ease}
@keyframes logIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.battle-controls{padding:10px;background:#1b281f}.actor-select{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.actor-pick{padding:7px 3px;background:#26372a;border:1px solid #53654d;border-radius:6px;font-size:9px}.actor-pick.active{border-color:#e8c889;box-shadow:0 0 9px #dfbb7755;color:#f6d9a4}.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.action-grid .btn{padding:8px 3px;font-size:10px;min-height:43px}
.story-card{border:1px solid #8b754b;border-radius:10px;padding:13px;background:linear-gradient(145deg,#2d3d2d,#19231c)}.story-speaker{font-size:10px;color:#e9c98d;letter-spacing:2px}.story-text{font-size:13px;line-height:2;color:#f0ead9;margin:10px 0}.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:10px;border-radius:7px;background:#243329;border:1px solid #637052;color:#e9d7b0;font-size:11px;line-height:1.7}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.map-node{padding:12px 5px;border:1px solid #52634b;border-radius:8px;background:linear-gradient(145deg,#344735,#18241c);text-align:center}.map-node b{display:block;color:#efd39b;font-size:11px}.map-node small{color:#b9c4b2;font-size:9px}.map-node.explored{border-color:#b89b61;background:linear-gradient(145deg,#48533b,#202c20)}.map-node:disabled{opacity:.35;filter:grayscale(.7)}
@media(min-width:650px){.main{padding-left:18px;padding-right:18px}.battle-scene{height:340px}.warrior{height:135px}.warrior .body-art{width:88px;height:105px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.skill-aura{position:absolute;z-index:10;left:50%;top:49%;transform:translate(-50%,-50%);width:170px;height:170px;border:4px solid #f7dfa1;border-radius:50%;box-shadow:0 0 24px #f4d89c,inset 0 0 24px #fff8;display:grid;place-items:center;color:#fff0c6;font-weight:900;font-size:20px;text-shadow:0 2px 6px #000;animation:auraBurst .68s ease-out forwards;pointer-events:none}
.skill-aura.fire{border-color:#ff9864;box-shadow:0 0 35px #ff693f,inset 0 0 35px #ffb15d;background:#ff6a3022}
.skill-aura.heal{border-color:#b4f2b0;box-shadow:0 0 34px #8fffa2,inset 0 0 28px #c8ffc5;background:#9affaa22}
.skill-aura.shield{border-color:#8bd8ff;box-shadow:0 0 34px #72cfff,inset 0 0 28px #9cddff;background:#7acfff22}
.skill-aura.charm{border-color:#e6a9ea;box-shadow:0 0 34px #db7de4,inset 0 0 28px #ffb9ef;background:#d887eb22}
.skill-aura.roar{border-color:#ffd46c;box-shadow:0 0 38px #ffb846,inset 0 0 30px #ffd36f;background:#ffbd4722}
@keyframes auraBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-40deg)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(30deg)}}
.boss-wave{position:absolute;z-index:11;left:50%;top:52%;width:240px;height:125px;transform:translate(-50%,-50%);border-top:10px solid #ffbd7c;border-bottom:5px solid #f36b58;border-radius:50%;filter:drop-shadow(0 0 16px #ff663f);animation:bossWave .8s ease-out forwards;pointer-events:none}
@keyframes bossWave{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.65)}}

/* Battle presentation pass: battlefield depth, idle motion, impact and defeat feedback */
.battle-scene{height:340px;perspective:700px}

.formation-row{z-index:2}
.warrior .body-art{animation:unitIdle 2.7s ease-in-out infinite;transform-origin:50% 100%}
.warrior:nth-child(2n) .body-art{animation-delay:.35s}
.warrior:nth-child(3n) .body-art{animation-delay:.75s}

.warrior.cast .body-art{animation:castPulse .55s ease-in-out}
.warrior.hurt{animation:impactShake .42s ease-out;filter:brightness(1.9) saturate(1.4)}
.warrior.dead{filter:grayscale(1) brightness(.55);opacity:.52}
.warrior.dead .body-art{transform:rotate(76deg) translateY(14px) scale(.72);transform-origin:50% 100%;animation:none}
.warrior.targeted .label{box-shadow:0 0 9px #f3c76d;animation:targetGlow 1.1s ease-in-out infinite}

.fx-flash{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 54%,#fff8d5a0,transparent 48%);animation:flashFade .38s ease-out forwards}
.boss-wave{position:absolute;z-index:5;inset:0;background:radial-gradient(circle,#f3c97966,#a32f2555 45%,transparent 70%);animation:bossReveal .82s ease-out;pointer-events:none}
.battle-scene.terrain-forest{background:linear-gradient(180deg,#455c43 0%,#6c7650 38%,#514a2f 42%,#2a3d26 100%)}
.battle-scene.terrain-river{background:linear-gradient(180deg,#879a94 0%,#8c927a 38%,#4c6b70 43%,#2a4849 62%,#34442d 100%)}
.battle-scene.terrain-city{background:linear-gradient(180deg,#85817a 0%,#9b8467 38%,#64513c 44%,#34302a 100%)}
.battle-scene.terrain-pass{background:linear-gradient(180deg,#8b9485 0%,#a29a82 38%,#6b6551 43%,#3e4336 100%)}
.battle-scene.terrain-forest:before{background:radial-gradient(ellipse at 12% 25%,#233e2588 0 15%,transparent 16%),radial-gradient(ellipse at 88% 20%,#243e2688 0 17%,transparent 18%),linear-gradient(180,#c5d1a433,transparent 42%),repeating-linear-gradient(170deg,transparent 0 36px,#ffffff09 37px 38px)}

@keyframes chargeRight{0%{transform:translateX(0)}55%{transform:translateX(22px) rotate(8deg)}100%{transform:translateX(5px)}}
@keyframes chargeLeft{0%{transform:translateX(0)}55%{transform:translateX(-22px) rotate(-8deg)}100%{transform:translateX(-5px)}}

:root{--gold:#f0ce8b;--panel:#1d2a23;--panel2:#293a30;--line:#75876b;--muted:#c0cbbd}
.banner,.box,.rowcard,.tile,.story-card{border-color:#78866b66;box-shadow:0 8px 22px #0003,inset 0 1px #ffffff0a}
.banner{background:linear-gradient(132deg,#344b3b 0%,#1b2922 62%,#392f22 100%);position:relative;overflow:hidden}

.tile{background:linear-gradient(145deg,#2b3b30,#1a251f);transition:transform .16s,border-color .16s,background .16s}

.damage.critical{font-size:1.25em;color:#ffe08a;text-shadow:0 2px 5px #5b1a0a,0 0 14px #ff6b36}
.slash-fx{height:5px;border-radius:99px;box-shadow:0 0 10px #ffe7a4,0 0 24px #f28d39}
@keyframes damageRise{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.tile,.btn,.choice,.map-node{transition:none!important}.damage{animation:none!important}}

const CHAPTERS=[
{title:"桃园余烬",era:"中平元年·春",region:"涿郡",intro:"涿郡连日风沙，官道上逃难的百姓挤成一线。你奉县令之命护送粮车，却在芦苇荡外听见了第一声战鼓。",dialog:[["刘备","百姓不是乱世的筹码。粮车若失，沿途数百户人家便要断炊。"],["关羽","前方烟尘不散，似有黄巾斥候。先护住车队，再寻其主力。"],["张飞","何必多言？俺带一队人马冲开道路！"]],battle:"涿郡护粮",boss:"黄巾头目·程远志",choice:["分粮给逃民，获得民心与少量粮草","集中护送粮车，获得额外黄金和军械"],side:"芦苇荡中的求救声",sideText:"一名受伤的乡勇藏在河堤下。他知道黄巾军下一处集结点，但救治他会耽误行军。"},
{title:"颍川烽火",era:"中平元年·夏",region:"颍川",intro:"颍川数县同时告急，黄巾军以流民为掩护，白日分散、夜间聚集。斥候带回一张染血的粮道图。",dialog:[["简雍","敌军并非乌合之众。他们切断驿道，又故意留下空营，引我们深入。"],["刘备","百姓被裹挟其中，不能只看旗号。攻营之前先查明粮仓里有多少人质。"],["张飞","若真有百姓，俺便收住矛头；若是诱饵，俺也不会让他们得逞。"]],battle:"长社外围",boss:"黄巾渠帅·波才",choice:["夜袭粮营，战斗难度降低并获得粮草","先救援村庄，提升民心并获得声望"],side:"失散的信使",sideText:"一名驿卒握着半封密信，信中提到黄巾军内部有人愿意倒戈。"},
{title:"广宗围城",era:"中平元年·秋",region:"广宗",intro:"广宗城外，官军与黄巾军对峙多日。城中粮食见底，城外却有人不断把箭书射进营地，要求谈判。",dialog:[["卢植","围城最怕急功。壕沟、粮道、民心，哪一样都不能落下。"],["关羽","城门并非唯一入口。夜里水渠涨潮，或许能送入一支小队。"],["刘备","先把城中百姓安置妥当，再决定如何破城。"]],battle:"广宗破围",boss:"黄巾大将·张角亲卫",choice:["筑垒围困，稳扎稳打","潜入水渠，冒险奇袭"],side:"城下的药童",sideText:"药童请求你救出被困在城中的师父，师父手里有一份城防图。"},
{title:"洛阳风雪",era:"中平六年·冬",region:"洛阳",intro:"京师的雪落得很厚，宫门内外却比战场更冷。何进召集诸将，密议诛除宦官。你奉命送信入城，发现各方势力都在暗中调兵。",dialog:[["曹操","兵刃一旦入宫，便不会只听一个人的号令。"],["袁绍","大事在即，优柔寡断只会让祸根继续蔓延。"],["刘备","若只想着胜负，最后受苦的仍是城中百姓。"]],battle:"宫门乱军",boss:"禁军都尉·蹇硕旧部",choice:["保护宫门百姓，获得民望","协助控制军械库，获得武器材料"],side:"宫墙下的密诏",sideText:"一个小黄门递来密诏，声称能证明某位大臣通敌。"},
{title:"虎牢关前",era:"初平元年·春",region:"虎牢关",intro:"十八路诸侯会盟，旌旗连绵数十里。联军看似声势浩大，各营却各怀心思。关前吕布单骑挑战，军中一时无人应答。",dialog:[["袁绍","诸侯齐聚，粮草军械皆已备足。"],["关羽","关前那人气势惊人，但阵前斗将不该决定全军生死。"],["张飞","三姓家奴！待俺去会会他！"],["刘备","切记，今日要争的不只是名声，还有盟军的信任。"]],battle:"虎牢关突围",boss:"并州飞将·吕布",choice:["与诸侯联军协同攻关，提升盟友信任","独立突袭侧翼，获得稀有战利品"],side:"诸侯营中的争吵",sideText:"两支盟军因军粮分配即将火并，调停可能改变之后的盟友态度。"},
{title:"长安夜变",era:"初平三年·夏",region:"长安",intro:"董卓死后，长安并未迎来安宁。李傕、郭汜反目，街市被火光照亮。你必须在混乱中找到天子车驾的去向。",dialog:[["贾诩","乱局里最危险的不是敌人，而是看不清谁在利用谁。"],["刘备","先护送难民离开，再设法查明车驾路线。"],["关羽","巷战不宜铺开，盾兵走前，弓手压住屋顶。"]],battle:"长安护驾",boss:"西凉叛将·郭汜",choice:["护送难民出城，民心大涨","追击叛军主将，获得军械和威望"],side:"被焚毁的医馆",sideText:"医馆里还有伤兵和一位不愿离开的老郎中。"},
{title:"徐州春雨",era:"兴平元年·春",region:"徐州",intro:"徐州遭逢兵灾，田地荒芜。陶谦求援的书信送到时，城外已能看见流民队伍。你要在有限粮草里决定先救谁。",dialog:[["糜竺","城中仓廪不多，若全数赈济，军队恐怕撑不过三日。"],["刘备","若百姓都离开了，守住一座空城又有何用？"],["张飞","俺去守粮仓，谁也别想趁乱抢粮。"]],battle:"徐州救民",boss:"曹军先锋·夏侯惇",choice:["分仓赈济，民心与伙伴羁绊提升","集中粮草守城，军队补给增加"],side:"泥泞中的孤儿",sideText:"一群孩子躲在倒塌的祠堂里，领头的女孩认识一条通往敌军后方的小路。"},
{title:"小沛风云",era:"兴平二年·秋",region:"小沛",intro:"徐州易手，吕布驻军小沛。城中商旅不断传出异动，陈宫的书信被截获一半。你要弄清这座城究竟忠于谁。",dialog:[["陈宫","只凭一纸盟约，救不了一座城。"],["关羽","城门守备松紧有序，不像临时驻军。有人提前布置过。"],["刘备","先查百姓口中的消息，不要轻信营中传闻。"]],battle:"小沛夺门",boss:"陷阵营统领·高顺",choice:["策反守门军士，减少敌方数量","正面攻城，获得更多战功"],side:"酒肆里的旧部",sideText:"一名旧部愿意献出城门钥匙，但要求你赦免其家人。"},
{title:"下邳寒潮",era:"建安三年·冬",region:"下邳",intro:"下邳城外水势渐涨，吕布军粮渐少。城中有人主张死战，也有人想开城投降。你必须在决战前争取城内人心。",dialog:[["陈登","水围之计可行，但若决堤，城中百姓也会遭殃。"],["刘备","不能为了胜利把整座城变成坟场。"],["张飞","若能逼吕布出城，俺愿率前锋去拦他。"]],battle:"下邳决战",boss:"飞将·吕布",choice:["断其粮道，战斗更稳妥","水攻城外营寨，获得快速胜利但民心受损"],side:"城头白旗",sideText:"城中守将暗中挂起白旗，究竟是真降还是诱敌，需要你判断。"},
{title:"官渡前夜",era:"建安四年·秋",region:"延津",intro:"袁绍大军南下，曹操据官渡迎战。粮道、渡口与斥候成为胜负关键。你受命协助曹军守住延津，却发现军报中有数处矛盾。",dialog:[["曹操","兵多不等于胜。能让敌人犯错，比让自己拼命更重要。"],["荀彧","粮秣若失，前线再勇也只能撤退。"],["关羽","若敌将轻进，可趁其阵形未成时截断侧翼。"]],battle:"延津截粮",boss:"袁军先锋·颜良",choice:["潜袭粮车，削弱后续敌军","稳守渡口，获得盟军支援"],side:"无主的军令牌",sideText:"一块军令牌遗落在河岸，牌上刻着不属于袁军的印记。"},
{title:"乌巢夜火",era:"建安五年·冬",region:"乌巢",intro:"乌巢粮仓守备森严，夜色里只有巡逻火把移动。许攸带来的情报或真或假，行动只有一次机会。",dialog:[["许攸","仓中粮秣堆积如山，守将淳于琼却疏于防备。"],["曹操","情报越是顺耳，越要留一条退路。"],["赵云","我愿先行探路，若有伏兵便放烟示警。"]],battle:"乌巢夜袭",boss:"淳于琼",choice:["轻骑潜入，速度快但补给少","伪装押粮队，风险较低但消耗黄金"],side:"粮仓里的俘虏",sideText:"你发现被强征的民夫被锁在粮仓边屋，放走他们会延误撤离。"},
{title:"官渡决战",era:"建安五年·冬",region:"官渡",intro:"袁绍大营开始动摇，但主力仍有十余万。曹军营中粮少士疲，最后一场会战不能只靠勇猛。你要在敌军中军与两翼之间找到破绽。",dialog:[["曹操","我军虽少，士气尚在。今日只争一线生机。"],["荀攸","敌军号令不一，击其鼓角，便能使各部互疑。"],["刘备","战后仍要收容伤兵，不可让胜利变成新的灾难。"]],battle:"官渡大会战",boss:"袁绍中军·审配",choice:["先破鼓角，扰乱敌军指挥","强攻中军，追求速战"],side:"袁军降卒",sideText:"一队降卒愿献出营门路线，但其中有人曾参与屠掠村庄。"},
{title:"荆州暗流",era:"建安六年·春",region:"襄阳",intro:"荆州牧刘表病重，蔡氏与蒯氏各有谋划。你奉刘备之命前往襄阳，却发现城内的每一份礼单都藏着利益交换。",dialog:[["诸葛亮","局势未明时，最有用的不是站队，而是知道谁害怕什么。"],["伊籍","州府档案记录着粮税、兵籍和各家田产，可以查出谁在暗中扩军。"],["刘备","荆州不能再起战火。能谈成的事，就不要先拔刀。"]],battle:"襄阳暗巷",boss:"蔡氏亲卫·蔡中",choice:["公开账册，获得百姓支持","秘密结盟，获得战略情报"],side:"蒯府密账",sideText:"一名书吏愿意交出账簿，但要求保护其家人离开襄阳。"},
{title:"新野屯田",era:"建安七年·夏",region:"新野",intro:"新野成为暂时的栖身之所。城墙不高，兵马不多，最要紧的是让百姓安心耕种。你要把一座小城经营成能支撑长期战事的根基。",dialog:[["诸葛亮","城池的命脉有三：粮仓、道路和人心。只修城墙是不够的。"],["糜竺","商路若通，城中便有余粮，也能吸引工匠和流民。"],["刘备","让百姓先种下这一季的庄稼。我们要有能守住的家。"]],battle:"新野护田",boss:"曹军游骑·于禁",choice:["优先修水渠，提升长期粮产","优先修兵营，提升军队上限"],side:"荒田里的铜匣",sideText:"农夫在荒田挖出一只铜匣，里面是前朝留下的兵书残页。"},
{title:"博望设伏",era:"建安八年·秋",region:"博望坡",intro:"曹军南下探路，夏侯惇自恃兵强，沿山谷推进。诸葛亮首次独立调度军阵，火攻、伏兵和撤退路线都要提前准备。",dialog:[["诸葛亮","火不是目的，逼敌人离开最有利的阵地才是目的。"],["赵云","我带骑兵守住谷口，待敌军追击时再切断退路。"],["张飞","俺埋伏在林后，等他们的旗子进来就冲！"]],battle:"博望坡火阵",boss:"夏侯惇",choice:["按计划诱敌入谷，降低敌军攻势","提前破坏粮车，敌军数量减少"],side:"误入山谷的百姓",sideText:"山谷里有百姓躲避兵灾，火攻计划若不调整，便会危及他们。"},
{title:"长坂惊尘",era:"建安十三年·秋",region:"当阳",intro:"曹操大军疾驰南下，刘备携百姓撤退。道路被辎重堵塞，孩童哭声混在马蹄声里。赵云请命深入敌阵寻找失散的家眷。",dialog:[["刘备","百姓愿随我走，是信任。不能把他们留在这里。"],["赵云","主公放心，我去去便回。"],["张飞","桥头有我！敌军若敢追来，先问俺的丈八蛇矛！"]],battle:"长坂突围",boss:"曹军虎豹骑统领",choice:["护送百姓缓行，伤亡较低","分兵救援失散者，可能获得赵云羁绊"],side:"断桥上的马车",sideText:"一辆马车横在桥上，车中有人呼救，后方追兵已近。"},
{title:"江夏借兵",era:"建安十三年·冬",region:"夏口",intro:"刘备退至夏口，江东孙权正在衡量战与和。鲁肃前来会面，带来的并不是盟约，而是一连串关于曹军水师的难题。",dialog:[["鲁肃","孙刘结盟并非没有代价。江东需要看见你们守住承诺的能力。"],["诸葛亮","江面风向、船只吃水、火油储量，都是谈判桌上的筹码。"],["周瑜","若无水军训练，纵有十万兵也只是岸上的看客。"]],battle:"夏口水寨",boss:"曹军水将·蔡瑁",choice:["协助训练水军，提升江东关系","夺取敌船图册，获得稀有图纸"],side:"江东老船工",sideText:"一名老船工知道暗流所在，但他不肯为陌生人冒险。"},
{title:"赤壁连环",era:"建安十三年·冬",region:"赤壁",intro:"曹军连环战船停泊江面，铁索相连，营中疫病和北方士卒不习水性的问题逐渐暴露。周瑜与诸葛亮对火攻时机意见不一。",dialog:[["周瑜","风向不稳，贸然纵火会把火带回自己船队。"],["诸葛亮","敌军虽连舟，却并非没有防备。先让他们相信我们已无战意。"],["黄盖","苦肉之计可以一试，但必须把撤离路线算到每一条船。"]],battle:"赤壁前哨",boss:"曹军水寨统领",choice:["配合黄盖诈降，风险高但削弱敌军","夜间破坏铁索，稳妥但消耗材料"],side:"病船上的伤兵",sideText:"一艘船上爆发疫病，若封船可能救不了伤兵，若放任又会传染全营。"},
{title:"东风火起",era:"建安十三年·冬",region:"乌林",intro:"东南风终于转起，火船在江雾中缓缓靠近。敌营鼓声突然改变节奏，说明有人识破了计策。真正的决战提前开始。",dialog:[["周瑜","火船入阵之后，诸军必须按旗号行动，不许争功。"],["黄盖","若我未能回来，记住先救水里的人。"],["诸葛亮","风势会变，胜负也会变。留一支队伍守住撤退口。"]],battle:"赤壁大火",boss:"曹军中军将领",choice:["集中火攻，快速摧毁敌船","分段点火，优先救出被困水兵"],side:"落水的敌军士兵",sideText:"敌军士兵抓住残木求救。救还是不救，可能影响战后降卒的态度。"},
{title:"南郡争夺",era:"建安十四年·春",region:"江陵",intro:"赤壁之后，曹军退守北方，南郡城内粮仓未开。周瑜主张速攻，刘备更在意沿途郡县是否愿意归附。",dialog:[["周瑜","城门一日不破，便多一日变数。"],["诸葛亮","占城容易，安民难。粮仓、县令和渡口都要同时控制。"],["赵云","我可以先探查城门轮值，找出守军换岗的空隙。"]],battle:"南郡攻防",boss:"曹仁",choice:["猛攻外城，获得战功","先安抚乡县，减少后续事件风险"],side:"城中粮官",sideText:"粮官愿意投诚，但粮仓里有一批被污损的谷物。"},
{title:"入蜀险道",era:"建安十六年·夏",region:"葭萌关",intro:"刘璋邀请刘备入蜀，张松绘制的地图藏着诸多险道。有人劝你趁机夺取益州，有人提醒入蜀之路可能成为绝路。",dialog:[["法正","益州富庶，真正的难处不是进去，而是进去之后如何让人愿意留下。"],["刘备","受人之托，不可先负其信。若不得已，也要尽量少伤无辜。"],["黄忠","山道狭窄，弓手应占高处，粮车不能离开主队太远。"]],battle:"葭萌关道",boss:"张鲁先锋·杨任",choice:["接受沿途县令投诚，获得民心","秘密控制关隘，获得战略主动"],side:"被扣押的向导",sideText:"一名向导知道山洪路线，却被怀疑私通敌军。"},
{title:"雒城攻坚",era:"建安十七年·春",region:"雒城",intro:"雒城久攻不下，张任熟悉地势，常在夜间袭击营地。军中开始有人抱怨粮食短缺，士气正在下降。",dialog:[["庞统","强攻城墙只会让守军更有把握。先让他们以为援军已经断绝。"],["魏延","我愿率精兵夜袭侧门。"],["刘备","不可轻视守城将士。能让他们开城，就不要把百姓拖进火海。"]],battle:"雒城夜袭",boss:"蜀中名将·张任",choice:["断水道逼其谈判，降低民心损失","夜袭东门，获得更好的战利品"],side:"城外的木匠",sideText:"木匠知道城墙修补的薄弱位置，但他的家人仍在城中。"},
{title:"定军山",era:"建安二十四年·春",region:"定军山",intro:"汉中争夺进入关键时刻，夏侯渊沿山布阵，黄忠请命夺取高处。山雾、坡道和运粮栈道都可能改变战局。",dialog:[["法正","敌军守将经验丰富，但过于分散。只要逼他离开营垒，山势便是我们的盟友。"],["黄忠","老夫尚能开弓。今日便让他们看看，何谓老当益壮。"],["赵云","我守住山口，若有追兵便以旗火传讯。"]],battle:"定军山奇袭",boss:"夏侯渊",choice:["黄忠率队夺高地，解锁专属羁绊","赵云护粮道，获得长期补给加成"],side:"山顶的烽火台",sideText:"烽火台守卒愿意投降，但他要求保全家中老母。"},
{title:"汉水惊涛",era:"建安二十四年·夏",region:"汉水",intro:"曹军在汉水沿岸重新集结，赵云奉命接应黄忠。敌军故意留下粮车，引诱我军深入河滩。",dialog:[["赵云","粮车太整齐了，像是专门给我们看的。"],["黄忠","若是诱饵，便让它变成诱敌的筹码。"],["诸葛亮","渡河不争一时快，先占高地，再决定是否追击。"]],battle:"汉水空营",boss:"曹军猛将·徐晃",choice:["占据高地等待敌军，稳健取胜","趁水势夜袭，收益高但风险大"],side:"河岸的渔村",sideText:"渔民熟悉浅滩，却担心战火毁掉船只和渔网。"},
{title:"荆州烽烟",era:"建安二十四年·秋",region:"江陵",intro:"关羽北伐之际，后方荆州传来急报。江东军队沿江逼近，城中守将各有盘算。你必须决定如何协调前线与后方。",dialog:[["关羽","前线若退，北方诸郡便再无牵制。"],["诸葛亮","后方若失，前线再胜也会变成孤军。"],["刘备","消息不能只靠一条驿道，派出两路信使，分别走水路和山路。"]],battle:"荆州保卫",boss:"江东名将·吕蒙",choice:["回援荆州，保留后方据点","继续北线攻势，获得更高威望但风险增加"],side:"城中密使",sideText:"一名密使掌握江东军换防时间，但他可能是双面间谍。"},
{title:"夷陵余烬",era:"章武二年·夏",region:"夷陵",intro:"多年征战之后，旧友或已离散，年轻将士却仍想用一场大胜证明自己。山林里的火光让人想起赤壁，也提醒所有人，骄傲会带来代价。",dialog:[["赵云","胜负不是一时的疆土，活着回去的人才有机会重建。"],["诸葛亮","这一仗要记住所有曾经做过的选择。"],["刘备","山河尚在，人心未散，便还有明日。"]],battle:"夷陵最后一战",boss:"山道伏兵统领",choice:["救援被围友军，保全伙伴羁绊","击破敌军中军，赢得最后战功"],side:"旧营地的木牌",sideText:"木牌上刻着多年以前的名字，可能是你曾救助过的百姓。"},
{title:"西陵烽烟",era:"章武元年·春",region:"西陵",intro:"蜀道军报接连送到，山口守军误报敌情，导致粮队两次走错岔路。你奉命查明军报失真的原因，并在敌军合围前重新打通西陵古道。",dialog:[["诸葛亮","军报不是越多越好。真假混杂，反而会让前线失去判断。"],["赵云","我带轻骑沿旧驿道查探，若遇伏兵便以三声号角示警。"],["刘备","沿途村寨不可惊扰。军令若失了民心，就算打通道路也守不长久。"]],battle:"西陵夺道",boss:"山地伏军统领·邓贤",choice:["逐村查验军报，降低敌军伏击能力","夜间突进驿站，获得额外战利品"],side:"驿站的残卷",sideText:"驿卒藏起一份被烧掉一半的路线图，图上标出山洪季节才会露出的浅滩。"},
{title:"白帝孤城",era:"章武二年·秋",region:"白帝城",intro:"长江水位转低，白帝城外的船队无法按时靠岸。城中老弱需要药材，守军需要新弩，商旅则要求恢复渡口。你必须安排城内有限的工匠和民夫。",dialog:[["赵云","城墙可以暂时不修，但城门和渡口必须有人看守。"],["诸葛亮","让工匠各做其所长。若所有人都去修城，药材和粮食便没人运。"],["刘备","先把百姓安置好，再谈下一场战事。"]],battle:"白帝渡口",boss:"江岸悍将·周鲂",choice:["优先修复渡船，提升后续补给","加固城门，提升本场战斗防御"],side:"渡口的药船",sideText:"一艘药船被乱石卡住，船上有急需的药材，也有敌军伤兵。"},
{title:"南中山道",era:"建兴三年·夏",region:"南中",intro:"南中诸部并非铁板一块。有的部族只想保住田地，有的首领则借战乱扩张势力。你进入山地后发现，地图上标注的道路早已被藤蔓吞没。",dialog:[["诸葛亮","远征南中，攻心为上。山路和水源，比敌人的城寨更值得先控制。"],["马岱","我熟悉山地骑兵的行进方式，可以带队绕过主路。"],["刘备","不要把整片山林都当作敌境。愿意谈的人，给他们谈的机会。"]],battle:"南中山口",boss:"蛮军首领·木鹿部将",choice:["与部族首领会盟，减少后续敌意","夺取山口粮仓，获得更多物资"],side:"迷路的采药人",sideText:"采药人熟悉山中泉眼，但不愿为军队带路，除非先救出被困的同伴。"},
{title:"山河归心",era:"建兴六年·春",region:"祁山",intro:"多年征战之后，军府里保存着三十章军报、百姓请愿和将士家书。最后一封急报来自祁山：敌军正在集结，若此处失守，所有旧路都将被切断。你必须决定这支军队究竟为了什么而战。",dialog:[["诸葛亮","胜负之外，还有一件事值得留下：后人提起这段岁月时，能否记得我们曾尽力让百姓少受一点苦。"],["关羽","刀锋所向，不该只为一纸功名。"],["刘备","山河会改变，故人会远去，但人心所向，才是最后的归处。"]],battle:"祁山终局",boss:"魏军大都督·司马懿",choice:["守护百姓与盟友，走向仁义结局","集中兵力争夺山河，走向霸业结局"],side:"军府最后的家书",sideText:"一封未寄出的家书写着一名老兵的心愿：他只想在战后回到故乡，种一片田。"}

];
const EVENTS=[
{name:"暴雨断桥",text:"暴雨冲毁山桥，商队与军队都被困在河岸。",a:"征集木料修桥（-80木，获得威望）",b:"绕行山路（-1日，避免损失）",doA:()=>{if(s.wood<80)return false;s.wood-=80;s.fame+=18;return true},doB:()=>{s.day++;s.food=Math.max(0,s.food-60);return true}},
{name:"流民求粮",text:"一群流民拖家带口来到城门，守军报告粮仓库存不足。",a:"开仓赈济（-160粮，民心上升）",b:"安排以工代赈（-60金，木材+70）",doA:()=>{if(s.food<160)return false;s.food-=160;s.fame+=25;s.morale+=5;return true},doB:()=>{if(s.gold<60)return false;s.gold-=60;s.wood+=70;s.fame+=10;return true}},
{name:"失火的粮仓",text:"夜半粮仓起火，火势正向民居蔓延。有人怀疑是敌方细作。",a:"先救百姓（-50木，民心+20）",b:"先抢粮食（粮草-80，威望+12）",doA:()=>{if(s.wood<50)return false;s.wood-=50;s.fame+=20;return true},doB:()=>{s.food=Math.max(0,s.food-80);s.fame+=12;return true}},
{name:"流浪铁匠",text:"一名流浪铁匠带着旧图纸求见，希望用铁矿换一处工坊。",a:"资助工坊（-100铁，解锁锻造折扣）",b:"购买图纸（-100金，获得玉石）",doA:()=>{if(s.iron<100)return false;s.iron-=100;s.flags.forgeDiscount=true;s.fame+=8;return true},doB:()=>{if(s.gold<100)return false;s.gold-=100;s.jade+=8;return true}},
{name:"军中疫病",text:"营中出现高热病患，医官请求购置药材。",a:"紧急治病（-90金，伤兵恢复）",b:"隔离营区（损失少量士气）",doA:()=>{if(s.gold<90)return false;s.gold-=90;s.wounded=Math.max(0,s.wounded-30);return true},doB:()=>{s.morale=Math.max(20,s.morale-10);return true}},
{name:"商队遇劫",text:"商队在官道遭到山贼劫掠，幸存者请求派兵。",a:"派兵救援（-25兵，获得装备材料）",b:"购买残余货物（-70金，粮木增加）",doA:()=>{if(s.army.inf<25)return false;s.army.inf-=25;s.iron+=25;s.fame+=16;return true},doB:()=>{if(s.gold<70)return false;s.gold-=70;s.food+=100;s.wood+=40;return true}},
{name:"村学先生",text:"村中先生愿意开设义学，教授识字、算学与简单军阵。",a:"捐助书籍（-60金，研究点+2）",b:"请先生入府（-20粮，军师羁绊）",doA:()=>{if(s.gold<60)return false;s.gold-=60;s.tech+=2;return true},doB:()=>{if(s.food<20)return false;s.food-=20;s.fame+=10;s.bond.liu=(s.bond.liu||0)+3;return true}},
{name:"逃亡的俘虏",text:"几名敌军俘虏趁夜逃到营门，他们声称愿意提供情报。",a:"收容并审讯（获得地图线索）",b:"押回战俘营（军纪与声望提升）",doA:()=>{s.intel+=1;s.fame+=5;return true},doB:()=>{s.fame+=15;s.morale+=4;return true}},
{name:"马市奇遇",text:"西域商人带来一匹瘦弱却血统出众的战马。",a:"购买战马（-180金，获得坐骑）",b:"以粮易马（-250粮，获得坐骑）",doA:()=>{if(s.gold<180)return false;s.gold-=180;s.items.push(makeItem("马","mount",18));return true},doB:()=>{if(s.food<250)return false;s.food-=250;s.items.push(makeItem("马","mount",18));return true}},
{name:"旧友来访",text:"一位曾经受你救助的村民带来消息：附近山寨正在集结。",a:"资助村民（-40金，提前侦察）",b:"请他带路（开启额外遭遇）",doA:()=>{if(s.gold<40)return false;s.gold-=40;s.intel+=1;return true},doB:()=>{s.sideBonus=1;s.fame+=6;return true}},
{name:"军械失窃",text:"武库少了几箱箭矢，值守军士互相推诿。",a:"彻查军械（-30金，军纪提升）",b:"暂用木料补造（-80木，补充弓兵）",doA:()=>{if(s.gold<30)return false;s.gold-=30;s.morale+=5;return true},doB:()=>{if(s.wood<80)return false;s.wood-=80;s.army.arch+=25;return true}},
{name:"酒肆传闻",text:"说书人讲起一位隐居名将，酒客纷纷指向不同方向。",a:"打听消息（-40金，寻访点+1）",b:"请说书人入府（威望+8）",doA:()=>{if(s.gold<40)return false;s.gold-=40;s.recruitTokens++;return true},doB:()=>{s.fame+=8;return true}},
{name:"山洪冲垮栈道",text:"山洪冲垮栈道，辎重车队被迫停下。",a:"修复栈道（-100木，减少后续消耗）",b:"弃置部分辎重（-120粮，获得行军速度）",doA:()=>{if(s.wood<100)return false;s.wood-=100;s.flags.roadSafe=true;return true},doB:()=>{if(s.food<120)return false;s.food-=120;s.morale+=8;return true}},

function cloneHero(id){let h=HEROES.find(x=>x.id===id);return Object.assign({},h,{lv:1,xp:0,hpNow:h.hp,energyNow:h.energy,gear:{weapon:null,armor:null,accessory:null},skillLv:1,wounds:0,loyalty:75})}

let s;try{s=JSON.parse(localStorage.getItem(KEY));if(!s||s.v!==4)throw 0}catch(e){try{let prev=JSON.parse(localStorage.getItem("hxsg_save_v3"));s=fresh();if(prev){s.gold=Math.max(300,prev.gold||800);s.food=Math.max(700,prev.food||1200);s.wood=prev.wood||500;s.iron=prev.iron||180;s.fame=prev.fame||0;s.day=prev.day||1;s.lv=prev.lv||1;s.story=Math.min(5,prev.story||0);if(Array.isArray(prev.heroes)&&prev.heroes.length){s.heroes=prev.heroes.map(x=>Object.assign(cloneHero(x.id)||{},x,{gear:x.gear||{weapon:null,armor:null,accessory:null}}));s.owned=s.heroes.map(x=>x.id);if(!s.heroes.some(x=>x.id==="guan")){s.heroes.push(cloneHero("guan"));s.owned.push("guan")}}if(Array.isArray(prev.items))s.items=prev.items.map(x=>Object.assign(makeItem(x.name,x.type,x.atk||10),x))}}catch(x){s=fresh()}}
let page="home",fight=null,toastTimer=null,storyContext=null,musicEnabled=localStorage.getItem("hxsg_music_enabled")!=="0",musicTrack=-1;
const $=id=>document.getElementById(id);
function fmt(n){return Math.floor(n||0).toLocaleString("zh-CN")}
function topUI(){["gold","food","wood","iron","jade","fame"].forEach(k=>$(k).textContent=fmt(s[k]));let year=184+Math.floor((s.day-1)/90);let season=["春","夏","秋","冬"][Math.floor(((s.day-1)%90)/23)%4];$("date").textContent=year+"年·"+season;$("level").textContent="主公 Lv."+s.lv+" · "+s.exp+"经验";let m=$("musicToggle");if(m)m.textContent=musicEnabled?"♫ 音乐：开":"♫ 音乐：关"}
function save(){localStorage.setItem(KEY,JSON.stringify(s));topUI()}
function startMusic(){if(!musicEnabled)return;let idx=fight?(fight.wave===3?3:(fight.mode==="territory"?[0,2,1,0,2,1][factionIndexForRegion(fight.territoryIndex)]:fight.chapter%4)):({home:0,campaign:1,heroes:2,army:3,world:1,daily:0,bag:2}[page]||0);if(musicTrack===idx){let same=$("bgm"+idx);if(same&&typeof same.play==="function"&&same.paused)same.play().catch(()=>{});return}for(let i=0;i<4;i++){let a=$("bgm"+i);if(a&&typeof a.pause==="function")a.pause()}let a=$("bgm"+idx);if(!a||typeof a.play!=="function")return;musicTrack=idx;a.volume=fight&&fight.wave===3?.34:.26;a.play().catch(()=>{})}
function toggleMusic(){musicEnabled=!musicEnabled;localStorage.setItem("hxsg_music_enabled",musicEnabled?"1":"0");if(musicEnabled){musicTrack=-1;startMusic();toast("背景音乐已开启")}else{for(let i=0;i<4;i++){let a=$("bgm"+i);if(a&&typeof a.pause==="function")a.pause()}toast("背景音乐已关闭")}topUI()}
function playSfx(kind){let id=kind==="swing"?"sfxSwing":kind==="critical"?"sfxCritical":"sfxHit",a=$(id);if(!a||typeof a.play!=="function")return;a.currentTime=0;a.volume=.48;a.play().catch(()=>{})}
function toast(t){let old=$("toast");if(old)old.remove();let n=document.createElement("div");n.id="toast";n.className="toast";n.setAttribute("role","status");n.setAttribute("aria-live","polite");n.textContent=t;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2600)}
function log(t){s.logs.unshift("第"+s.day+"日："+t);s.logs=s.logs.slice(0,30)}
function go(p){page=p;render();startMusic()}
function tile(icon,title,desc,fn,wide){return '<button class="tile '+(wide?'wide':'')+'" onclick="'+fn+'"><b>'+icon+'　'+title+'</b><small>'+desc+'</small></button>'}
function box(t,body){return '<section class="box"><h3>'+t+'</h3>'+body+'</section>'}
function render(){topUI();let heads={home:["新野 · 主城","城池 "+s.city+"级 · 第"+s.day+"日"],campaign:["山河志 · 主线","已完成 "+s.story+" / "+CHAPTERS.length+" 章"],heroes:["麾下 · 武将",""+s.heroes.length+" 位将领"],army:["军团 · 兵营","士气 "+s.morale+" · 伤兵 "+s.wounded],world:["天下 · 郡县","声望 "+s.fame+" · 侦察 "+s.intel],daily:["每日军令 · 常务","每日目标与军府奖励"],bag:["府库 · 行囊","装备、锻造与补给"]};$("heading").textContent=heads[page][0];$("hint").textContent=heads[page][1];document.querySelectorAll(".nav button").forEach(b=>{b.disabled=false;b.classList.toggle("active",b.dataset.p===page)});let html=page==="home"?homePage():page==="campaign"?campaignPage():page==="heroes"?heroesPage():page==="army"?armyPage():page==="world"?worldPage():page==="daily"?dailyPage():bagPage();$("view").innerHTML=html;$("notice").textContent="本地自动存档 · "+(s.logs[0]||"山河待定")}

function ensureDaily(){if(!s.daily||s.daily.day!==s.day)s.daily={day:s.day,progress:{event:0,train:0,upgrade:0,battle:0,recruit:0,side:0},claimed:[]};if(!s.daily.progress)s.daily.progress={event:0,train:0,upgrade:0,battle:0,recruit:0,side:0};if(!Array.isArray(s.daily.claimed))s.daily.claimed=[]}
function tickDaily(type){ensureDaily();s.daily.progress[type]=(s.daily.progress[type]||0)+1;save()}
function dailyPage(){ensureDaily();let defs=[["event","平息民间事件","处理一桩城中奇遇",100,"🎲"],["train","三军操练","完成一次全军训练",100,"🛡️"],["upgrade","修筑城池","升级任意一项建筑",120,"🏗️"],["battle","前线告捷","赢得一场主线战斗",180,"⚔️"],["recruit","招贤纳士","招募一名新武将",160,"🍶"],["side","完成委托","完成本章支线任务",150,"📜"]];let finished=defs.filter(x=>(s.daily.progress[x[0]]||0)>0).length;return '<div class="banner"><h3>每日军令 · 六项常务</h3><p>每日更替一组军府目标。完成军令可领取黄金与粮草，连续经营会让城池与军团成长更快。每日进度按游戏内日期重置。</p><span class="tag">今日完成 '+finished+' / 6</span><span class="tag">第 '+s.day+' 日</span></div><div class="list">'+defs.map(x=>{let done=(s.daily.progress[x[0]]||0)>0,claimed=s.daily.claimed.includes(x[0]);return '<div class="rowcard"><div class="portrait">'+x[4]+'</div><div class="info"><b>'+x[1]+'</b><small>'+x[2]+'</small><small>奖励：'+x[3]+'金 · 60粮</small><div class="bar"><i style="width:'+(done?100:0)+'%"></i></div></div><button class="btn '+(done&&!claimed?'primary':'')+'" '+(!done||claimed?'disabled':'')+' onclick="claimDaily(\''+x[0]+'\','+x[3]+')">'+(claimed?'已领取':done?'领取':'未完成')+'</button></div>'}).join("")+'</div>'+box("军府勤务",'<div class="statsline"><span>今日处理事件</span><b>'+s.daily.progress.event+'/1</b></div><div class="statsline"><span>今日战役胜利</span><b>'+s.daily.progress.battle+'/1</b></div><div class="statsline"><span>今日完成支线</span><b>'+s.daily.progress.side+'/1</b></div>')}
function claimDaily(type,reward){ensureDaily();if(!(s.daily.progress[type]>0))return toast("尚未完成这项军令");if(s.daily.claimed.includes(type))return toast("奖励已经领取");s.daily.claimed.push(type);s.gold+=reward;s.food+=60;s.exp+=30;while(s.exp>=s.lv*120){s.exp-=s.lv*120;s.lv++;s.fame+=10}log("领取每日军令奖励："+reward+"金");save();render();toast("军令奖励已领取")}

function homePage(){return '<div class="banner"><div class="eyebrow">荆州 · 新野县 · 军府</div><h3>山河未定，且看今朝</h3><p>城外田畴渐绿，远处烽烟未散。你既要经营一座能让百姓安居的城，也要带领将士走过三十段乱世风云。每一次选择都会留下记录，影响民心、盟友与后续事件。</p><span class="tag">主线 '+s.story+'/'+CHAPTERS.length+'</span><span class="tag">驻军 '+armyTotal()+'</span><span class="tag">将领 '+s.heroes.length+'</span><span class="tag">民望 '+s.fame+'</span></div><div class="grid">'+tile("📜","继续主线","章节剧情、分支选择、三波战斗与首领战","go('campaign')",true)+tile("🧾","每日军令","完成训练、城建、战役和支线领取每日奖励","go('daily')")+tile("🏗️","城池经营","建设农田、兵营、城墙、商铺、书院和工坊","buildings()")+tile("📜","颁布政令","选择三日城市政策，调整粮草、税收与军心","cityEdicts()")+tile("🏛️","内政任命","委任太守、屯田校尉与中护军，获得每日加成","cityOffices()")+tile("🏮","民心治安","巡城、赈济、减税，管理城市稳定","cityGovernance()")+tile("🛡️","军团整备","征兵、治疗伤兵、训练士气、调整战阵","go('army')")+tile("🍶","招贤馆","寻访新武将，培养羁绊与专属战技","tavern()")+tile("🎲","巡城奇遇","动态随机事件，会留下长期影响","randomEvent()")+tile("🧾","本章支线","探索人物故事，获得额外经验与稀有材料","sideQuest()")+tile("⚒️","铁匠工坊","锻造、强化、拆解装备与制作药剂","forge()")+tile("🧭","斥候出巡","侦察地形，寻找支线与隐藏遭遇","scout()")+tile("🕵️","密探机关","招募细作、潜伏敌城、散布谣言与反间防谍","openSpyOffice()")+tile("📯","政务休整","结束当日，结算生产、军粮与城防","nextDay()")+'</div>'+box("今日军务",'<div class="statsline"><span>粮草日产</span><b>'+s.build.farm*65+'</b></div><div class="statsline"><span>商铺税收</span><b>'+s.build.market*35+'</b></div><div class="statsline"><span>军队消耗</span><b>'+Math.ceil(armyTotal()*.08)+'</b></div><div class="progress"><i style="width:'+Math.min(100,s.morale)+'%"></i></div><div class="muted">军心 '+s.morale+'/100 · 低于30时战斗伤害与命中都会下降。</div><div class="btnrow"><button class="btn primary" onclick="nextDay()">结束当日</button><button class="btn" onclick="randomEvent()">处理城中事件</button></div>')+box("最近军报",s.logs.slice(0,5).map(x=>'<div class="muted">• '+x+'</div>').join(""))}
function armyTotal(){return s.army.inf+s.army.cav+s.army.arch}
function campaignPage(){return '<div class="banner"><h3>三十章山河史诗</h3><p>从涿郡护粮、黄巾烽火，到虎牢关、官渡、赤壁、汉中与荆州风云。每章包含剧情对话、至少一次分支决策、三段连续交锋、章节首领与专属支线。战败不会抹去剧情进度，但要承担伤兵和军粮损失。</p><span class="tag">主线目标约10小时以上</span><span class="tag">30章 · 多分支</span><span class="tag">90段战斗波次</span></div><div class="list">'+CHAPTERS.map((c,i)=>'<div class="rowcard"><div class="portrait">'+(i<s.story?'🏅':i===s.story?'📖':'🔒')+'</div><div class="info"><b>'+String(i+1).padStart(2,"0")+' · '+c.title+'　'+(i<s.story?'已完成':i===s.story?'当前章节':'未解锁')+'</b><small>'+c.era+' · '+c.region+'</small><small>'+c.intro.slice(0,52)+'…</small><small>章节首领：'+c.boss+' · 支线：'+c.side+'</small></div><button class="btn '+(i===s.story?'primary':'')+'" '+(i>s.story?'disabled':'')+' onclick="startChapter('+i+')">'+(i<s.story?'重温':'进入')+'</button></div>').join("")+'</div>'}
function heroesPage(){ensureHeroPolitics();return '<div class="banner"><h3>名将录 · 养成与羁绊</h3><p>武将拥有专属战技、装备、忠诚度与同袍关系。低忠诚会削弱战力，长期失信可能导致离队。</p><span class="tag">上阵 '+s.formation.map(i=>s.heroes[i]?s.heroes[i].name:"空位").join(" / ")+'</span></div><div class="list">'+s.heroes.map((h,i)=>'<div class="rowcard"><div class="portrait">'+h.face+'</div><div class="info"><b>'+h.name+'　<span class="gold">'+("★".repeat(h.rarity))+'</span></b><small>'+h.title+' · '+h.role+' · '+h.troop+' · Lv.'+h.lv+' · 羁绊 '+(s.bond[h.id]||0)+' · 忠诚 '+h.loyalty+'</small><small>攻 '+heroAtk(h)+' · 防 '+heroDef(h)+' · 生命 '+h.hpNow+'/'+heroMax(h)+'</small><div class="bar"><i style="width:'+Math.max(0,h.hpNow/heroMax(h)*100)+'%"></i></div></div><button class="btn" onclick="heroDetail('+i+')">详情</button></div>').join("")+'</div><div class="btnrow"><button class="btn primary" onclick="formation()">调整阵容</button><button class="btn" onclick="tavern()">寻访武将</button></div>'}
function heroMax(h){return h.hp+(h.lv-1)*32}

function prepareSiege(i){ensureFrontier();if(i<0||i>24||i>s.story+2)return toast("该区域尚未开放");if(s.regionControl[i]!=="enemy")return toast("该区域没有敌方城防");if(!(REGION_ROADS[i]||[]).some(n=>s.regionControl[n]==="player"))return toast("必须先控制相邻区域，才能推进攻城器械");if(!(s.explored||[]).includes(i))return toast("先探索并侦察敌军防线");if(s.siegePlans[i])return toast("攻城器械已备妥");let cost=siegeCost(i);if(!costOK(cost))return toast("准备攻城器械需要"+costText(cost));spend(cost);s.siegePlans[i]=true;log("为"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+"打造云梯、冲车与盾车");save();closeModal();assaultRegion(i);toast("攻城器械准备完毕，敌方城防将受到压制")}

function prepareFieldTactic(i,plan){ensureFrontier();s.fieldPlans=s.fieldPlans||{};if(s.fieldPlans[i])return toast("本次攻坚已准备过战前战术");let costs={recon:{gold:35},sabotage:{gold:45,iron:25},ambush:{food:60}};if(!costs[plan])return toast("未知战前战术");if(!costOK(costs[plan]))return toast("资源不足，无法执行该战术");spend(costs[plan]);s.fieldPlans[i]=plan;let names={recon:"战场侦察",sabotage:"破坏敌军补给",ambush:"设伏突袭"};log("战前部署："+names[plan]+"，准备进攻"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region);save();assaultRegion(i);toast(names[plan]+"完成，效果将在本次战役生效")}
function assaultRegion(i){ensureFrontier();window.currentAssaultRegion=i;if(i<0||i>24||i>s.story+2)return toast("该区域尚未开放");if(!(s.explored||[]).includes(i))return toast("先派斥候探索，确认敌军部署");if(s.regionControl[i]!=="enemy")return toast("该区域已不受敌军控制");let neighbors=(REGION_ROADS[i]||[]).filter(n=>s.regionControl[n]==="player");if(!neighbors.length)return toast("必须从相邻的己方控制区推进，不能越过敌军防线");let e=s.enemyGarrisons[i],total=e.inf+e.cav+e.arch,fort=e.fort||1,prepared=!!s.siegePlans[i];modal("区域争夺 · "+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region,'<div class="banner"><h3>'+enemyFaction(i)+'据守 · '+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+'</h3><p>敌军依托道路与城寨布防。步兵克制骑兵、骑兵克制弓兵、弓兵克制步兵。选择主攻兵种，或先准备攻城器械削弱城防。</p><span class="tag">步兵 '+e.inf+'</span><span class="tag">骑兵 '+e.cav+'</span><span class="tag">弓兵 '+e.arch+'</span><span class="tag">城防 '+fort+'</span><span class="tag">敌军总兵力 '+total+'</span>'+(prepared?'<span class="tag">攻城器械已备妥</span>':'')+'</div><div class="box"><h3>战场阵型 · '+(BATTLE_STANCES[s.fieldStance]||BATTLE_STANCES.balanced).name+'</h3><p>'+(BATTLE_STANCES[s.fieldStance]||BATTLE_STANCES.balanced).desc+'</p><div class="list"><button class="choice" onclick="setBattleStance(\'balanced\')">均衡阵 · 稳健攻守</button><button class="choice" onclick="setBattleStance(\'assault\')">锋矢阵 · 强攻突击</button><button class="choice" onclick="setBattleStance(\'defensive\')">方圆阵 · 坚守减伤</button><button class="choice" onclick="setBattleStance(\'mobile\')">雁行阵 · 机动扰敌</button></div></div><p>可用兵力：步兵 '+s.army.inf+' · 骑兵 '+s.army.cav+' · 弓兵 '+s.army.arch+'；相邻进军方向：'+neighbors.map(n=>CHAPTERS[Math.min(n,CHAPTERS.length-1)].region).join("、")+'。</p><div class="box"><h3>战前战术部署</h3><p>每次攻坚可采用一种战术：侦察提升我军攻击效率，破坏补给削弱敌军攻防，设伏降低敌军士气。</p><div class="btnrow"><button class="btn" onclick="prepareFieldTactic('+i+',\'recon\')">侦察 · 35金</button><button class="btn" onclick="prepareFieldTactic('+i+',\'sabotage\')">断补给 · 45金25铁</button><button class="btn" onclick="prepareFieldTactic('+i+',\'ambush\')">设伏 · 60粮</button></div><p class="muted">当前战术：'+({recon:"战场侦察",sabotage:"破坏补给",ambush:"设伏突袭"}[s.fieldPlans&&s.fieldPlans[i]]||"未部署")+'</p></div><div class="list"><button class="choice" onclick="beginTerritoryBattle('+i+',\'inf\')">步兵主攻 · 对骑兵优势</button><button class="choice" onclick="beginTerritoryBattle('+i+',\'cav\')">骑兵主攻 · 对弓兵优势</button><button class="choice" onclick="beginTerritoryBattle('+i+',\'arch\')">弓兵主攻 · 对步兵优势</button>'+(prepared?'':'<button class="choice" onclick="prepareSiege('+i+')">准备攻城器械（70木、55铁、45金、30粮）</button>')+'</div>')}
function resolveTerritoryAssault(i,tactic){ensureFrontier();if(s.regionControl[i]!=="enemy")return toast("敌军已不再控制此地");if(!(s.explored||[]).includes(i))return toast("尚未完成区域侦察");if(!(REGION_ROADS[i]||[]).some(n=>s.regionControl[n]==="player"))return toast("没有相邻己方控制区，无法发起进攻");if(!["inf","cav","arch"].includes(tactic))return toast("无效的进攻部署");let e=s.enemyGarrisons[i],types=["inf","cav","arch"],a=s.army,ownTotal=types.reduce((n,k)=>n+Math.max(0,a[k]||0),0),enemyTotal=types.reduce((n,k)=>n+Math.max(0,e[k]||0),0);if(ownTotal<60)return toast("可用兵力不足，至少需要60名士兵");if(!enemyTotal)return toast("敌军守备数据异常，请重新进入舆图");let ownPower=0;types.forEach(k=>{let weighted=types.reduce((n,ek)=>n+(e[ek]||0)*unitEffectiveness(k,ek),0)/enemyTotal;ownPower+=(a[k]||0)*weighted*(k===tactic?1.16:1)});let enemyPower=0;types.forEach(k=>{let weighted=types.reduce((n,ak)=>n+(a[ak]||0)*unitEffectiveness(k,ak),0)/Math.max(1,ownTotal);enemyPower+=(e[k]||0)*weighted});let siege=!!s.siegePlans[i],attack=ownPower*(1+Math.max(0,s.morale-50)/500+Math.min(20,s.intel)*.012)+s.wall*2+(siege?enemyTotal*.28:0),defense=enemyPower*(1.08+(e.fort||1)*.055+(i%3)*.025)*(siege?.78:1)+25+i*2,won=attack>=defense,rate=won?.075:.22,losses={};types.forEach(k=>{losses[k]=Math.min(a[k]||0,Math.ceil((a[k]||0)*rate*(k===tactic?.88:1)))});types.forEach(k=>{a[k]=Math.max(0,(a[k]||0)-losses[k])});let lossText="步兵-"+losses.inf+"、骑兵-"+losses.cav+"、弓兵-"+losses.arch;s.siegePlans[i]=false;if(won){s.regionControl[i]="player";delete s.enemyGarrisons[i];s.fame=Math.min(100,s.fame+8);s.morale=Math.min(100,s.morale+5);s.gold+=35;s.wood+=25;s.exp+=30;log("攻占"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+"，敌军防线崩溃，己方伤亡："+lossText);save();closeModal();render();modal("战旗易帜 · "+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region,'<div class="banner"><h3>区域争夺获胜</h3><p>'+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+'已转为我方控制。可以继续向相邻敌区推进，或建立据点经营补给。</p><span class="tag">威望+8</span><span class="tag">黄金+35</span><span class="tag">木材+25</span><span class="tag">经验+30</span></div><p>战损：'+lossText+'</p><button class="btn primary" onclick="closeModal();inspectRegion('+i+')">部署当地驻军</button>');return true}else{if(siege)s.siegePlans[i]=false;s.food=Math.max(0,s.food-35);s.morale=Math.max(10,s.morale-8);s.enemyGarrisons[i].inf=Math.max(1,Math.floor(s.enemyGarrisons[i].inf*.92));s.enemyGarrisons[i].cav=Math.max(0,Math.floor(s.enemyGarrisons[i].cav*.92));s.enemyGarrisons[i].arch=Math.max(0,Math.floor(s.enemyGarrisons[i].arch*.92));log("争夺"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+"失利，敌军也受到损伤，己方伤亡："+lossText);save();closeModal();render();modal("进攻受挫 · "+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region,'<div class="banner"><h3>战线暂时受阻</h3><p>敌军仍控制该地，但守军也已受损。补充兵员、恢复士气或准备攻城器械后再战。</p></div><p>己方战损：'+lossText+'；额外损失粮草35、士气-8。</p><button class="btn" onclick="closeModal();inspectRegion('+i+')">返回舆图</button>');return false}}
function worldPage(){ensureFrontier();let provinces=["涿郡","颍川","广宗","洛阳","虎牢关","长安","徐州","小沛","下邳","延津","乌巢","官渡","襄阳","新野","博望","长坂","夏口","赤壁","南郡","葭萌","雒城","定军山","汉水","荆州","夷陵"];s.explored=Array.isArray(s.explored)?s.explored:[];s.territories=s.territories||{};let held=Object.keys(s.territories).filter(k=>s.territories[k]).length,controlled=controlledRegionCount(),enemy=25-controlled;return '<div class="banner"><h3>天下舆图 · 群雄割据</h3><p>六方势力各有主将、军团构成与兵种偏好。沿道路推进争夺城池，遣使可以换取短暂停战；每隔数日敌军会调兵或袭击前线据点。</p><span class="tag">已探索 '+s.explored.length+' / '+Math.min(provinces.length,s.story+3)+' 处</span><span class="tag">我方控制 '+controlled+' 区</span><span class="tag">敌方控制 '+enemy+' 区</span><span class="tag">己方据点 '+held+' 处</span><span class="tag">下次敌军行动：第'+(s.day+(4-s.day%4)%4)+'日</span></div><div class="map-grid">'+provinces.map((x,i)=>{let open=i<=Math.min(provinces.length-1,s.story+2),done=s.explored.includes(i),owned=!!s.territories[i],player=s.regionControl[i]==="player";return '<button class="map-node '+(done?'explored':'')+'" '+(!open?'disabled':'')+' onclick="inspectRegion('+i+')"><b>'+x+'</b><small>'+(owned?'己方据点 · 已驻防':player?'我方控制 · 可部署':done?enemyFaction(i)+' · 已侦察':i===0?'起始据点':enemyFaction(i)+' · 可侦察')+'</small></button>'}).join('')+'</div>'+box("群雄势力 · 六方割据",factionOverview())+spyOfficePanel()+box("前线军情",'<div class="statsline"><span>当前控制区域</span><b>'+controlled+' / 25</b></div><div class="statsline"><span>敌军剩余区域</span><b>'+enemy+' 处</b></div><div class="statsline"><span>百姓民望</span><b>'+s.fame+'</b></div><div class="statsline"><span>盟友情谊</span><b>'+Object.values(s.bond).reduce((a,b)=>a+b,0)+'</b></div><div class="statsline"><span>敌军情报</span><b>'+s.intel+'</b></div><p class="muted">兵种相克：步兵克骑兵 · 骑兵克弓兵 · 弓兵克步兵。敌方会在四日一轮的军令周期内调动援军或袭扰边境。</p>')}

function cityGovernance(){ensureCityGovernance();let risk=s.publicOrder<35||s.peopleMorale<35?"高":s.publicOrder<55||s.peopleMorale<50?"中":"低";modal("民心与治安 · 城务司",'<div class="banner"><h3>新野城务状况</h3><p>治安影响盗匪与治安事件，民心影响城市稳定。缺粮、低治安会持续损害民心；两项过低时可能发生骚乱。</p><span class="tag">骚乱风险：'+risk+'</span></div><div class="box"><div class="statsline"><span>治安</span><b>'+s.publicOrder+'/100</b></div><div class="bar"><i style="width:'+s.publicOrder+'%"></i></div><div class="statsline"><span>民心</span><b>'+s.peopleMorale+'/100</b></div><div class="bar"><i style="width:'+s.peopleMorale+'%"></i></div><div class="statsline"><span>税制</span><b>'+(s.taxReliefUntil>=s.day?"减税令执行中":"常规税制")+'</b></div></div><p>城务行动会消耗真实库存并立即生效。</p><div class="list">'+Object.keys(CITY_GOVERNANCE).map(k=>{let a=CITY_GOVERNANCE[k],cost=Object.entries(a.cost).map(([x,v])=>({gold:"金",food:"粮",wood:"木"}[x]+v)).join(" / ");return '<div class="rowcard"><div class="portrait">🏮</div><div class="info"><b>'+a.name+'</b><small>'+a.desc+' · '+cost+'</small></div><button class="btn primary" onclick="runCityAction(\''+k+'\')">执行</button></div>'}).join("")+'</div><button class="btn ghost" style="width:100%;margin-top:9px" onclick="reduceCityTax()">减税三日 · -15基础税收/日</button>')}
function runCityAction(id){ensureCityGovernance();let a=CITY_GOVERNANCE[id];if(!a)return toast("未知城务行动");if(!costOK(a.cost))return toast("库存不足，无法执行"+a.name);spend(a.cost);s.publicOrder=Math.max(0,Math.min(100,s.publicOrder+a.order));s.peopleMorale=Math.max(0,Math.min(100,s.peopleMorale+a.people));log("城务行动："+a.name+"，治安+"+a.order+"，民心+"+a.people);save();cityGovernance();toast(a.name+"已执行")}
function reduceCityTax(){ensureCityGovernance();if(s.gold<45)return toast("减税安民需要45黄金周转");s.gold-=45;s.taxReliefUntil=Math.max(s.taxReliefUntil||0,s.day+2);s.peopleMorale=Math.min(100,s.peopleMorale+8);s.publicOrder=Math.min(100,s.publicOrder+3);log("颁布三日减税令，民心有所回升");save();cityGovernance();toast("减税令生效三日")}
function settleCityGovernance(){ensureCityGovernance();if(s.food<=0){s.peopleMorale=Math.max(0,s.peopleMorale-8);s.publicOrder=Math.max(0,s.publicOrder-4)}else{s.peopleMorale=Math.min(100,s.peopleMorale+(s.publicOrder>=50?1:0));s.publicOrder=Math.min(100,s.publicOrder+(s.peopleMorale>=50?1:0))}if(s.taxReliefUntil>=s.day)s.gold=Math.max(0,s.gold-15);if((s.publicOrder<30||s.peopleMorale<30)&&s.unrestLastDay!==s.day){s.unrestLastDay=s.day;let loss=Math.min(s.gold,45);s.gold-=loss;s.publicOrder=Math.max(0,s.publicOrder-6);s.peopleMorale=Math.max(0,s.peopleMorale-5);log("城中爆发骚乱，损失"+loss+"金，治安与民心进一步下降");return "城中发生骚乱，损失"+loss+"金"}return ""}
function buildings(){let defs={farm:["农田","提升粮草日产",{wood:100,gold:70}],barracks:["兵营","提升兵力训练上限",{wood:130,gold:100}],wall:["城墙","提升城防与战斗减伤",{wood:150,iron:45}],market:["商铺","提升每日税收",{wood:110,gold:90}],academy:["书院","提升研究速度",{wood:100,gold:130}],forge:["工坊","降低锻造成本",{wood:90,iron:50}]};modal("新野建设 · 城政六务",'<p>每提升一级城池建筑都会提高其专项效果。升级会消耗库存，不会凭空生成资源。</p><div class="list">'+Object.keys(defs).map(k=>'<div class="rowcard"><div class="portrait">🏗️</div><div class="info"><b>'+defs[k][0]+' · Lv.'+s.build[k]+'</b><small>'+defs[k][1]+' · '+costText(defs[k][2])+'</small></div><button class="btn" onclick="upgradeBuilding(\''+k+'\')">升级</button></div>').join("")+'</div>')}

function tavern(){let pool=HEROES.filter(h=>!s.owned.includes(h.id));modal("招贤馆 · 四方访士",'<div class="banner"><h3>良将择主，名士归心</h3><p>花费260黄金寻访一名新将。部分武将需要主线进度或声望达到条件；每位将领有自己的传记、羁绊和专属战技。</p><span class="tag">尚未招募 '+pool.length+' 位</span><span class="tag">寻访令 '+s.recruitTokens+'</span></div><div class="list">'+pool.map(h=>'<div class="rowcard"><div class="portrait">'+h.face+'</div><div class="info"><b>'+h.name+' · '+h.title+'</b><small>'+h.role+' · '+h.troop+' · '+("★".repeat(h.rarity))+'</small><small>'+h.bio+'</small></div></div>').join("")+'</div><button class="btn primary" style="width:100%;margin-top:10px" '+(!pool.length?'disabled':'')+' onclick="recruitHero()">寻访一名武将 · 260金 / 1令</button>')}

function levelHero(i){let h=s.heroes[i];if(h.lv>=60)return toast("当前等级已达上限");if(s.gold<140)return toast("黄金不足");s.gold-=140;h.lv++;h.xp=0;h.hpNow=Math.min(heroMax(h),h.hpNow+35);log(h.name+"提升至"+h.lv+"级");save();heroDetail(i);render()}

function formation(){if(s.heroes.length<3)return toast("至少需要三名将领");let opts=s.heroes.map((h,i)=>'<option value="'+i+'">'+h.name+'</option>').join("");modal("三军布阵 · 前中后阵",'<p>前锋更容易受到近战攻击；中军适合统帅；后军更适合弓手与军师。三名武将不能重复。</p>'+["前锋","中军","后军"].map((x,i)=>'<label style="display:block;color:#e5c994;margin:10px 0">'+x+'<select id="slot'+i+'" style="display:block;width:100%;padding:10px;margin-top:4px;background:#111914;border:1px solid #5c6b52;border-radius:6px;color:#fff">'+opts+'</select></label>').join("")+'<button class="btn primary" onclick="saveFormation()">保存阵容</button>');let f=s.formation||[0,1,2];setTimeout(()=>f.forEach((v,i)=>{if($("slot"+i))$("slot"+i).value=v}),10)}

function recruitTroops(k){let defs={inf:[{gold:70,food:90},60],cav:[{gold:120,food:110,iron:25},25],arch:[{gold:95,food:90,wood:20},40]};let c=defs[k][0];if(!costOK(c))return toast("资源不足，无法募兵");spend(c);s.army[k]+=defs[k][1];log("军营征募"+({inf:"步兵",cav:"骑兵",arch:"弓兵"}[k]));save();render();toast("新兵已入营")}

function healArmy(){if(s.wounded<=0)return toast("没有待救治的伤兵");let n=Math.min(s.wounded,60);if(s.gold<Math.ceil(n*1.2))return toast("黄金不足以支付军医费用");s.gold-=Math.ceil(n*1.2);s.wounded-=n;s.morale=Math.min(100,s.morale+4);save();render();toast("救治伤兵"+n+"人")}

function randomEvent(){if(s.eventDay===s.day)return toast("今日的随机事件已经处理，明日再来看看");let e=EVENTS[Math.floor(Math.random()*EVENTS.length)];modal("城中奇遇 · "+e.name,'<div class="banner"><h3>'+e.name+'</h3><p>'+e.text+'</p><span class="tag">事件会影响资源、士气或后续剧情</span></div><div class="list"><button class="choice" onclick="chooseEvent(0)">'+e.a+'</button><button class="choice" onclick="chooseEvent(1)">'+e.b+'</button></div>');window.currentEvent=e}

function nextDay(){ensureCityGovernance();ensureHeroPolitics();ensureSpyNetwork();Object.keys(s.enemyMoraleByRegion).forEach(k=>{s.enemyMoraleByRegion[k]=Math.min(75,s.enemyMoraleByRegion[k]+3)});s.supplyRoutes=Array.isArray(s.supplyRoutes)?s.supplyRoutes:[];let grain=s.build.farm*65,coin=s.build.market*35,up=Math.ceil(armyTotal()*.08),outposts=Object.keys(s.territories||{}).filter(k=>s.territories[k]).length,activeRoutes=s.supplyRoutes.filter(r=>s.territories&&s.territories[r[0]]&&s.territories[r[1]]),relief=activeRoutes.length*5,maint=Math.max(0,outposts*15-relief);s.day++;ensureDaily();recoverSpyAgents();resolveEnemyEspionage();let legacyHumanity=Math.floor((s.flags.humanity||0)/3),legacyStrategy=Math.floor((s.flags.strategy||0)/3);if(legacyHumanity)s.morale=Math.min(100,s.morale+legacyHumanity);if(legacyStrategy&&s.day%2===0)s.intel=Math.min(20,s.intel+legacyStrategy);let campRecovery=Math.min(s.wounded||0,4+Math.floor((s.morale||0)/25));if(campRecovery){s.wounded-=campRecovery;log("营地医护与休整：伤兵恢复"+campRecovery+"人")}let edict=s.edict&&s.day<=s.edict.untilDay?CITY_EDICTS[s.edict.id]:null,edictFood=edict?edict.food:0,edictGold=edict?edict.gold:0,edictMorale=edict?edict.morale:0,edictHeal=edict?edict.heal:0;let officers=cityOfficerEffects();let granaryFood=0,beaconIntel=0;Object.keys(s.territories||{}).filter(k=>s.territories[k]).forEach(k=>{let f=s.outpostFacilities&&s.outpostFacilities[k]||{};granaryFood+=(f.granary||0)*8;if((f.beacon||0)>0&&s.day%3===0)beaconIntel+=f.beacon});s.food+=grain+activeRoutes.length*8+granaryFood+edictFood+officers.food;s.gold+=coin+edictGold+officers.gold;s.food-=up+maint;if(beaconIntel){s.intel=Math.min(20,s.intel+beaconIntel);log("烽火台传回军情，情报+"+beaconIntel)}if(outposts){s.wood+=outposts*12+activeRoutes.length*5;log("前线据点结算："+outposts+"处据点，木材+"+(outposts*12+activeRoutes.length*5)+"，补给线减免粮草"+relief)}if(s.food<0){s.food=0;s.morale=Math.max(10,s.morale-12);log("军粮不足，士气下降，出现逃兵")}else s.morale=Math.min(100,s.morale+2);if(edictMorale+officers.morale)s.morale=Math.max(0,Math.min(100,s.morale+edictMorale+officers.morale));if(edictHeal+officers.heal)s.wounded=Math.max(0,s.wounded-edictHeal-officers.heal);if(s.day%3===0){let h=s.heroes[Math.floor(Math.random()*s.heroes.length)];if(h&&h.hpNow<heroMax(h))h.hpNow=Math.min(heroMax(h),h.hpNow+30)}let loyaltyReport=driftHeroLoyalty();let unrestReport=settleCityGovernance();let enemyReport=resolveEnemyWorldTurn(false);log("政务结算：粮草+"+grain+"，税收+"+coin+"，军粮-"+up);save();render();toast("新的一天开始"+(loyaltyReport?" · "+loyaltyReport:unrestReport?" · "+unrestReport:enemyReport?" · "+enemyReport:"，城池产出已结算"));if(s.pendingSiege)showPendingSiege();if(Math.random()<.32)setTimeout(()=>randomEvent(),350)}

function startChapter(i){if(i>s.story)return toast("请先完成前面的章节");startMusic();let c=CHAPTERS[i];storyContext={chapter:i,step:0};showStory()}

function finishBattle(){let f=fight;if(!f)return;if(f.mode==="territory"){let i=f.territoryIndex,doctrine=BATTLE_STANCES[f.stance]||BATTLE_STANCES.balanced,loss=Math.max(6,Math.ceil(armyTotal()*(f.win?.04:.095)*doctrine.loss));s.wounded+=loss;s.army.inf=Math.max(0,s.army.inf-Math.ceil(loss*.5));s.army.cav=Math.max(0,s.army.cav-Math.ceil(loss*.25));s.army.arch=Math.max(0,s.army.arch-Math.floor(loss*.25));f.allies.forEach(a=>{let h=s.heroes[a.sourceIndex];if(h){h.hpNow=Math.max(1,Math.min(heroMax(h),a.hp));if(a.hp<a.max*.35)h.wounds=Math.min(5,h.wounds+1);h.xp=(h.xp||0)+(f.win?55:20);if(h.xp>=h.lv*100){h.xp-=h.lv*100;h.lv++;h.hpNow=heroMax(h)}}});s.siegePlans[i]=false;if(f.win){s.regionControl[i]="player";delete s.enemyGarrisons[i];s.fame=Math.min(100,s.fame+8);s.morale=Math.min(100,s.morale+6);s.gold+=35;s.wood+=25;s.exp+=50;tickDaily("battle");log("三阵攻坚成功，攻占"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+"，伤兵"+loss+"人");}else{let e=s.enemyGarrisons[i];if(e){e.inf=Math.max(1,Math.floor(e.inf*.9));e.cav=Math.max(0,Math.floor(e.cav*.9));e.arch=Math.max(0,Math.floor(e.arch*.9))}s.food=Math.max(0,s.food-35);s.morale=Math.max(10,s.morale-8);log("攻打"+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region+"未果，敌军守备受损，伤兵"+loss+"人")};settleHeroPolitics(f.win);fight=null;page="world";save();render();modal(f.win?"区域攻占 · "+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region:"战役撤退 · "+CHAPTERS[Math.min(i,CHAPTERS.length-1)].region,'<div class="banner"><h3>'+(f.win?"敌旗已落，我军控制该地区":"敌军仍守住阵地")+'</h3><p>'+(f.win?"三波战斗结束，战场已清理。你现在可以建立据点、修复补给线并向下一处敌区推进。":"我军已撤出战场。敌军守备遭受损伤，可补充兵员或准备攻城器械后再次进攻。")+'</p></div><p>我军伤兵 '+loss+' 人'+(f.win?" · 奖励：威望+8、黄金+35、木材+25、经验+50":" · 额外损失粮草35、士气下降")+'</p><button class="btn primary" onclick="closeModal();inspectRegion('+i+')">返回区域</button>');return}let c=CHAPTERS[f.chapter];let loss=Math.max(8,Math.ceil(armyTotal()*(f.win?.035:.09)));s.wounded+=loss;s.army.inf=Math.max(0,s.army.inf-Math.ceil(loss*.5));s.army.cav=Math.max(0,s.army.cav-Math.ceil(loss*.25));s.army.arch=Math.max(0,s.army.arch-Math.floor(loss*.25));f.allies.forEach(a=>{let h=s.heroes[a.sourceIndex];if(h){h.hpNow=Math.max(1,Math.min(heroMax(h),a.hp));if(a.hp<a.max*.35)h.wounds=Math.min(5,h.wounds+1);h.xp=(h.xp||0)+(f.win?80:25);if(h.xp>=h.lv*100){h.xp-=h.lv*100;h.lv++;h.hpNow=heroMax(h)}s.bond[h.id]=(s.bond[h.id]||0)+(f.win?2:0)}});settleHeroPolitics(f.win);if(f.win){tickDaily("battle");s.story=Math.max(s.story,f.chapter+1);let reward=Math.round((220+f.chapter*42)*(f.choice===1?1.2:1));s.gold+=reward;s.food+=180+f.chapter*12;s.iron+=22+f.chapter*2;s.jade+=f.chapter%4===3?3:0;s.fame+=25+f.chapter*4;s.exp+=100+f.chapter*14;while(s.exp>=s.lv*120){s.exp-=s.lv*120;s.lv++;s.fame+=15}let drop=makeItem(["黄巾环刀","精钢长枪","玄铁战甲","青铜护心镜","乌骓马鞍"][f.chapter%5],["weapon","weapon","armor","accessory","mount"][f.chapter%5],12+f.chapter*2);s.items.push(drop);s.morale=Math.min(100,s.morale+8);log("平定「"+c.title+"」，获得"+reward+"金、装备「"+drop.name+"」，伤兵"+loss+"人");if(f.chapter%3===2){s.recruitTokens++;log("声名远播，获得一枚寻访令")}}else{s.food=Math.max(0,s.food-100);s.morale=Math.max(15,s.morale-12);log("「"+c.title+"」暂时失利，伤兵"+loss+"人，仍可整备后再次挑战")}fight=null;page="campaign";render();if(storyContext){let c2=CHAPTERS[storyContext.chapter];modal("战后余波 · "+c2.title,'<div class="banner"><h3>'+(s.story>storyContext.chapter?"本章战事告捷":"暂时撤退")+'</h3><p>'+c2.intro+'</p></div><p>城中百姓、盟友和部队都在等待你的下一步行动。你可以先回城整备，也可以继续推进剧情。</p><div class="btnrow"><button class="btn primary" onclick="closeModal();go(\'home\')">返回主城</button><button class="btn" onclick="closeModal();go(\'campaign\')">查看章节</button></div>');storyContext=null}}

function itemDetail(i){let x=s.items[i];let options=s.heroes.map((h,j)=>'<option value="'+j+'">'+h.name+'</option>').join("");modal(x.name,'<div class="statsline"><span>品质</span><b>'+x.quality+'</b></div><div class="statsline"><span>类别</span><b>'+x.type+'</b></div><div class="statsline"><span>强度</span><b>'+x.power+'</b></div><p>'+x.desc+'</p><label class="muted">分配给武将<select id="equipTo" style="width:100%;padding:9px;background:#111914;color:#fff;margin-top:5px">'+options+'</select></label><div class="btnrow"><button class="btn primary" onclick="equipItem('+i+')">装备</button><button class="btn" onclick="salvageItem('+i+')">拆解材料</button></div>')}
function equipItem(i){equipItemTo(i,Number($("equipTo").value))}
function equipItemTo(i,j){let item=s.items[i],h=s.heroes[j];if(!item||!h)return toast("装备或武将不存在");if(!h.gear)h.gear={};let slot=item.type;if(!["weapon","armor","accessory","mount"].includes(slot))return toast("该物品不能直接装备");if(slot==="mount")slot="accessory";if(item.equippedBy&&item.equippedBy!==h.id){let priorHero=s.heroes.find(x=>x.id===item.equippedBy);if(priorHero&&priorHero.gear&&priorHero.gear[slot]===item.name)priorHero.gear[slot]=null}let old=h.gear[slot];if(old){let prior=s.items.find(x=>x.name===old&&x.equippedBy===h.id);if(prior)prior.equippedBy=null}h.gear[slot]=item.name;item.equippedBy=h.id;log(h.name+"装备"+item.name);save();closeModal();go("heroes")}
function salvageItem(i){let x=s.items[i];if(x.equippedBy)return toast("请先卸下装备");s.iron+=Math.max(5,Math.ceil(x.power*.8));s.items.splice(i,1);log("拆解装备，获得铁矿");save();closeModal();render()}
function equipHero(i){let h=s.heroes[i],opts=s.items.map((x,j)=>'<option value="'+j+'">'+x.name+' · '+x.type+' · '+x.power+'</option>').join(""),heroOpts=s.heroes.map((x,j)=>'<option value="'+j+'" '+(j===i?'selected':'')+'>'+x.name+'</option>').join("");modal(h.name+" · 选择装备",'<p>选择一件装备，并确认穿戴的武将。可以把装备转交给其他将领。</p><select id="itemChoice" style="width:100%;padding:10px;background:#111914;color:#fff">'+opts+'</select><select id="equipTo" style="width:100%;padding:10px;margin-top:8px;background:#111914;color:#fff">'+heroOpts+'</select><button class="btn primary" style="width:100%;margin-top:10px" onclick="equipItemTo(Number(document.getElementById(\'itemChoice\').value),Number(document.getElementById(\'equipTo\').value))">确认装备</button>')}
function forge(){modal("百炼工坊 · 锻造",'<div class="banner"><h3>火候、材料与匠心</h3><p>工坊可以打造不同部位装备。高级装备需要玉石与更多铁矿；城池工坊等级可降低成本。</p></div><div class="list"><button class="choice" onclick="craftItem(\'weapon\')">打造武器：攻击+25（120铁、80木、80金）</button><button class="choice" onclick="craftItem(\'armor\')">打造护甲：防御+22（100铁、100木、70金）</button><button class="choice" onclick="craftItem(\'accessory\')">打造饰品：全属性+15（45铁、12玉、100金）</button></div>')}
function craftItem(type){let c={weapon:{iron:120,wood:80,gold:80},armor:{iron:100,wood:100,gold:70},accessory:{iron:45,jade:12,gold:100}}[type];if(!costOK(c))return toast("材料不足，无法开炉");spend(c);let x=makeItem(type==="weapon"?"百炼环首刀":type==="armor"?"玄铁山文甲":"龙纹玉佩",type,type==="weapon"?25:type==="armor"?22:15);x.quality="精良";s.items.push(x);log("工坊打造"+x.name);save();forge();render()}
function craftPotion(){if(!costOK({gold:40,iron:20}))return toast("制作药剂需要40金和20铁");spend({gold:40,iron:20});s.potions+=1;save();render();toast("制作完成，药剂+1")}
function sideQuest(){let c=CHAPTERS[Math.min(s.story,CHAPTERS.length-1)],id=s.story;if(s.sideDone.includes(id))return toast("本章支线已经完成");modal("支线委托 · "+c.side,'<div class="banner"><h3>'+c.side+'</h3><p>'+c.sideText+'</p></div><p>支线任务需要派遣少量兵力和资源。完成后获得额外经验、威望与材料，并记录在本地任务簿。</p><button class="btn primary" onclick="finishSideQuest()">接受并完成支线</button>')}
function finishSideQuest(){let id=s.story;if(s.sideDone.includes(id))return toast("该支线已完成");if(s.food<70||armyTotal()<20)return toast("粮草或兵力不足，无法完成支线");s.food-=70;s.fame+=22;s.iron+=20;s.exp+=45;s.sideDone.push(id);tickDaily("side");log("完成支线「"+CHAPTERS[id].side+"」");save();closeModal();render();toast("支线完成：获得威望、铁矿和经验")}

function waitTravel(){s.day++;s.food=Math.max(0,s.food-30);save()}
function ensureHeroPolitics(){if(!Array.isArray(s.heroes))s.heroes=[];s.heroRelations=s.heroRelations||{};s.heroes.forEach(h=>{if(typeof h.loyalty!=="number")h.loyalty=75;h.loyalty=Math.max(0,Math.min(100,h.loyalty))})}
function heroPairKey(a,b){return [a,b].sort().join("|")}
function heroRelationScore(a,b){ensureHeroPolitics();if(a===b)return 100;return Math.max(0,Math.min(100,s.heroRelations[heroPairKey(a,b)]||0))}
function improveHeroRelation(a,b){ensureHeroPolitics();let x=s.heroes.find(h=>h.id===a),y=s.heroes.find(h=>h.id===b);if(!x||!y||a===b)return toast("请选择两名不同的在册武将");if(s.gold<60)return toast("结交同袍需要60黄金");s.gold-=60;let k=heroPairKey(a,b);s.heroRelations[k]=Math.min(100,(s.heroRelations[k]||0)+12);s.bond[a]=(s.bond[a]||0)+2;s.bond[b]=(s.bond[b]||0)+2;log(x.name+"与"+y.name+"结为战友，关系提升");save();heroDetail(s.heroes.indexOf(x));toast("两位武将关系提升至"+s.heroRelations[k])}
function heroRelationshipMenu(i){let h=s.heroes[i];if(!h)return;modal("结交同袍 · "+h.name,'<p>花费60黄金组织军中宴饮，两名武将关系提高12点，并各获得2点羁绊。关系达到50后，两人同时上阵可获得攻防协同。</p><div class="list">'+s.heroes.filter(x=>x.id!==h.id).map(x=>'<div class="rowcard"><div class="portrait">'+x.face+'</div><div class="info"><b>'+x.name+'</b><small>当前关系 '+heroRelationScore(h.id,x.id)+'/100</small></div><button class="btn primary" onclick="improveHeroRelation(\''+h.id+'\',\''+x.id+'\')">宴饮结交 · 60金</button></div>').join("")+'</div>')}
function rewardHeroLoyalty(i){ensureHeroPolitics();let h=s.heroes[i];if(!h)return toast("武将不存在");if(s.gold<40)return toast("赏赐军资需要40黄金");s.gold-=40;h.loyalty=Math.min(100,h.loyalty+10);log("赏赐"+h.name+"军资，忠诚度提升");save();heroDetail(i);toast(h.name+"忠诚度提升至"+h.loyalty)}
function driftHeroLoyalty(){ensureHeroPolitics();s.heroes.forEach(h=>{h.loyalty=Math.max(0,Math.min(100,h.loyalty+(s.morale>=70?1:s.morale<35?-2:0)))});let deserter=s.heroes.find(h=>h.loyalty<20&&Math.random()<.15);if(deserter&&s.heroes.length>3){log(deserter.name+"因长期低忠诚而离开军府");s.heroes=s.heroes.filter(h=>h.id!==deserter.id);s.owned=s.heroes.map(h=>h.id);s.formation=(s.formation||[]).map(i=>Math.min(i,s.heroes.length-1));Object.keys(s.cityPosts||{}).forEach(k=>{if(s.cityPosts[k]===deserter.id)s.cityPosts[k]=null});return deserter.name+"因忠诚不足离队"}return ""}
function settleHeroPolitics(won){ensureHeroPolitics();s.heroes.forEach(h=>{h.loyalty=Math.max(0,Math.min(100,h.loyalty+(won?3:-5)))});return ""}
function applyHeroSynergy(){if(!fight||!fight.allies)return;let c={inf:fight.allies.filter(x=>/枪|步|盾/.test(x.troop||"")).length,cav:fight.allies.filter(x=>(x.troop||"").includes("骑")).length,arch:fight.allies.filter(x=>/弓|弩/.test(x.troop||"")).length};if(c.inf>=2){fight.allies.filter(x=>/枪|步|盾/.test(x.troop||"")).forEach(x=>x.def=Math.round(x.def*1.08));fight.logs.push("步阵协同：前排防御+8%。")}if(c.cav>=2){fight.allies.filter(x=>(x.troop||"").includes("骑")).forEach(x=>x.atk=Math.round(x.atk*1.1));fight.logs.push("骑兵协同：双翼包抄，攻击+10%。")}if(c.arch>=2){fight.allies.filter(x=>/弓|弩/.test(x.troop||"")).forEach(x=>x.atk=Math.round(x.atk*1.08));fight.logs.push("远程协同：交叉火力，攻击+8%。")}for(let i=0;i<fight.allies.length;i++)for(let j=i+1;j<fight.allies.length;j++){let a=fight.allies[i],b=fight.allies[j];if(heroRelationScore(a.id,b.id)>=50){a.atk=Math.round(a.atk*1.05);b.atk=Math.round(b.atk*1.05);a.def=Math.round(a.def*1.04);b.def=Math.round(b.def*1.04);fight.logs.push(a.name+"与"+b.name+"触发同袍协同：攻+5%、防+4%。")}}}
function checkInvariants(){ensureFrontier();ensureDaily();ensureHeroPolitics();if(!Array.isArray(s.heroes))s.heroes=[];if(!Array.isArray(s.items))s.items=[];if(!s.build)s.build={farm:1,barracks:1,wall:1,market:1,academy:1,forge:1};if(!s.flags)s.flags={};if(!s.bond)s.bond={};if(!s.army)s.army={inf:100,cav:40,arch:40};if(!Array.isArray(s.formation)||s.formation.length!==3)s.formation=[0,1,2];s.heroes.forEach(h=>{if(!h.gear)h.gear={weapon:null,armor:null,accessory:null};if(typeof h.hpNow!=="number")h.hpNow=heroMax(h);if(typeof h.energy!=="number")h.energy=3});}
