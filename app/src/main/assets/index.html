<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17130f"><title>幻想三国</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17130f;color:#eee1c3;font-family:"Noto Serif SC","Songti SC",serif}.hero{padding:20px 16px 16px;background:linear-gradient(180deg,#171a17,#28271f 55%,#17130f);border-bottom:1px solid #82653b;position:relative;overflow:hidden}.hero:after{content:"漢";position:absolute;right:20px;top:-26px;font-size:155px;color:#d3ad6c;opacity:.08}.kicker{font-size:10px;letter-spacing:4px;color:#c7a66a}.brand{text-align:center;padding:14px 0 18px}.brand h1{font-size:34px;letter-spacing:8px;margin:5px;color:#f0d7a1;text-shadow:0 3px 10px #000}.brand p{font-size:11px;letter-spacing:3px;color:#a99a7b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#171713;border:1px solid #685438;border-radius:5px;text-align:center;padding:8px 3px}.stat b{display:block;color:#e5c27d;font-size:16px}.stat small{font-size:10px;color:#a99c81}.wrap{padding:14px;padding-bottom:88px}.heading{font-size:16px;color:#dfc18a;margin:8px 0 12px;display:flex;align-items:center;gap:10px}.heading:after{content:"";height:1px;background:#695434;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{min-height:100px;text-align:left;padding:13px;background:linear-gradient(145deg,#3a2d20,#211a14);border:1px solid #82633b;border-radius:6px;color:#f1e4c8;font-family:inherit}.card:active{background:#59452b;transform:scale(.98)}.card b{display:block;font-size:15px;color:#e5c27d;margin-bottom:7px}.card small{font-size:11px;line-height:1.5;color:#b8a98b}.wide{grid-column:1/-1;min-height:80px}.panel{margin-top:14px;background:#e7d8b7;color:#302418;border-radius:5px;padding:14px;min-height:150px;box-shadow:0 4px 14px #0007}.panel h3{color:#75472a;margin:0 0 9px;font-size:17px}.panel p{font-size:13px;line-height:1.8;margin:6px 0}.choice{display:block;width:100%;padding:11px;margin-top:9px;border:1px solid #9a7542;border-radius:4px;background:#493321;color:#f5dfad;font-family:inherit;font-size:13px;text-align:left}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#100e0b;border-top:1px solid #705632;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#cbb98f;font-family:inherit;font-size:11px}.nav b{display:block;font-size:19px;margin-bottom:3px}.log{font-size:11px;color:#c3b18b;line-height:1.8;margin-top:12px}.tag{display:inline-block;border:1px solid #987647;border-radius:20px;padding:3px 8px;font-size:10px;color:#806034;margin-right:4px}
</style></head><body>
<header class="hero"><div class="kicker">东汉末年 · 建安元年</div><div class="brand"><h1>幻想三国</h1><p>群雄并起 · 天下待定</p></div><div class="stats"><div class="stat"><b id="gold">500</b><small>黄金</small></div><div class="stat"><b id="food">800</b><small>粮草</small></div><div class="stat"><b id="army">100</b><small>兵力</small></div><div class="stat"><b id="fame">0</b><small>威望</small></div></div></header>
<main class="wrap"><div class="heading" id="heading">主城 · 新野</div><div id="cards" class="grid"></div><section class="panel" id="panel"><h3>主公，请听军报</h3><p>黄巾之乱虽平，天下却已暗流涌动。招兵买马、广积粮草，方能在这乱世之中立足。</p><p>点击上方文字卡片，开始你的霸业。</p></section><div class="log" id="log">军报：新的纪元开始了。</div></main>
<nav class="nav"><button onclick="page('home')"><b>🏯</b>主城</button><button onclick="page('generals')"><b>⚔️</b>武将</button><button onclick="page('world')"><b>🗺️</b>征战</button><button onclick="page('quests')"><b>📜</b>任务</button><button onclick="page('bag')"><b>🎒</b>行囊</button></nav>
<script>
const fresh={gold:500,food:800,army:100,fame:0,day:1,level:1,exp:0,wood:300,city:1,gens:[{name:"刘备",title:"仁德之主",atk:18,rarity:"稀有",icon:"🗡️"},{name:"张飞",title:"万夫不当",atk:24,rarity:"精良",icon:"🐯"}],done:[],log:"你在乱世中醒来，成为一方新主。"};
let s;try{s=JSON.parse(localStorage.getItem("hxsg"))||fresh}catch(e){s=fresh}
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem("hxsg",JSON.stringify(s));stats()},stats=()=>{["gold","food","army","fame"].forEach(k=>$(k).textContent=s[k]);};
function note(t){s.log="第"+s.day+"日 · "+t;save();$("log").textContent="军报："+s.log}
function panel(title,body){$("panel").innerHTML="<h3>"+title+"</h3>"+body}
function cards(items){$("cards").innerHTML=items.map(x=>'<button class="card '+(x.wide?"wide":"")+'" onclick="'+x.fn+'"><b>'+x.icon+" "+x.name+'</b><small>'+x.desc+"</small></button>").join("")}
function page(p){if(p==="home"){ $("heading").textContent="主城 · 新野";cards([{icon:"🏗️",name:"城池建设",desc:"发展农田、兵营与城防",fn:"build()"},{icon:"🍶",name:"英雄酒馆",desc:"寻访天下豪杰名将",fn:"tavern()"},{icon:"🎯",name:"演武校场",desc:"训练士卒，提升军力",fn:"train()"},{icon:"🏮",name:"集市贸易",desc:"以黄金换取发展物资",fn:"market()"},{icon:"🔥",name:"乱世奇闻",desc:"面对抉择，改变自己的命运",fn:"event()",wide:true}]);panel("主公，请听军报","<p>你驻守新野，四方豪杰尚未归心。先发展城池、招募将领，再率军出征。</p><p><span class=tag>城池等级 "+s.city+"</span><span class=tag>主公等级 "+s.level+"</span></p>")}if(p==="generals"){ $("heading").textContent="武将 · 麾下英豪";cards(s.gens.map((g,i)=>({icon:g.icon,name:g.name+" · "+g.title,desc:g.rarity+"武将 · 攻击 "+g.atk+" · 点击培养",fn:"grow("+i+")"})));panel("武将名册","<p>麾下共 "+s.gens.length+" 位武将。培养可提升攻击力，出征时全军武将都会助阵。</p>")}if(p==="world"){ $("heading").textContent="征战天下 · 群雄割据";cards([{icon:"⚔️",name:"村外山道 · 黄巾余党",desc:"敌军战力约 70，胜利获得黄金与粮草",fn:"battle(70,180,150)"},{icon:"🛡️",name:"汝南营寨 · 流寇",desc:"敌军战力约 180，建议兵力充足后挑战",fn:"battle(180,350,250)"},{icon:"🏯",name:"虎牢关 · 董卓军",desc:"诸侯会盟，挑战吕布（尚未开放）",fn:"locked()"}]);panel("出征须知","<p>军队战力由士兵与麾下武将共同决定。战斗会损失士兵，请确保粮草充足。</p>")}if(p==="quests"){ $("heading").textContent="军令 · 主线任务";cards([{icon:"⚔️",name:"平定黄巾",desc:"击败村外山道的黄巾余党",fn:"claim('bandit',180)"},{icon:"📯",name:"招贤纳士",desc:"招募一位新的武将",fn:"claim('recruit',120)"},{icon:"🏗️",name:"固本培元",desc:"升级城池建筑",fn:"claim('build',100)"}]);panel("任务进度",s.done.length+" / 3 项已完成。完成任务后点击卡片领取奖励。")}if(p==="bag"){ $("heading").textContent="行囊 · 资源总览";cards([{icon:"💰",name:"黄金 "+s.gold,desc:"用于招募、建设与训练",fn:"page('home')"},{icon:"🌾",name:"粮草 "+s.food,desc:"行军与军队补给",fn:"page('home')"},{icon:"🪵",name:"木材 "+s.wood,desc:"城池建设材料",fn:"page('home')"},{icon:"🏅",name:"威望 "+s.fame,desc:"主公声望",fn:"page('home')"}]);panel("随身物资","<p>主公的物资皆已登记在册。善用资源，方能成就霸业。</p><button class=choice onclick=reset()>重置本地存档</button>")}}
function build(){panel("城池建设","<p>新野城当前等级："+s.city+"。升级需要 150 黄金与 80 木材。</p><button class=choice onclick=upgrade()>升级城池 · 150金 / 80木</button>")}
function upgrade(){if(s.gold<150||s.wood<80){alert("资源不足");return}s.gold-=150;s.wood-=80;s.city++;note("新野城升级至 "+s.city+" 级");s.done.push("build");build()}
function tavern(){panel("英雄酒馆","<p>酒香引英雄。花费 200 黄金，随机寻访一位名将。</p><button class=choice onclick=recruit()>寻访天下豪杰 · 200金</button><p>可能遇见：赵云、关羽、诸葛亮、黄忠。</p>")}
function recruit(){if(s.gold<200){alert("黄金不足");return}s.gold-=200;let pool=[["赵云","常胜将军",30,"史诗","🐉"],["关羽","武圣",38,"传说","🐲"],["诸葛亮","卧龙先生",20,"传说","🪶"],["黄忠","老当益壮",27,"精良","🏹"]],g=pool[Math.floor(Math.random()*pool.length)];if(s.gens.some(x=>x.name===g[0])){s.gold+=100;note("再次遇见"+g[0]+"，折算为100黄金")}else{s.gens.push({name:g[0],title:g[1],atk:g[2],rarity:g[3],icon:g[4]});s.done.push("recruit");note(g[0]+"加入麾下！")}page("generals")}
function train(){panel("演武校场","<p>操练士卒，每次可增加 50 名士兵。</p><button class=choice onclick=drill()>募兵训练 · 100粮 / 80金</button>")}
function drill(){if(s.food<100||s.gold<80){alert("粮草或黄金不足");return}s.food-=100;s.gold-=80;s.army+=50;note("训练完成，新增50名士卒");train()}
function market(){panel("集市贸易","<p>用黄金购买粮草补给。</p><button class=choice onclick=buy()>购入 300 粮草 · 100金</button>")}
function buy(){if(s.gold<100){alert("黄金不足");return}s.gold-=100;s.food+=300;note("商队送来300粮草");market()}
function grow(i){let g=s.gens[i],cost=100;if(s.gold<cost){alert("黄金不足");return}s.gold-=cost;g.atk+=5;note(g.name+"攻击提升至 "+g.atk);page("generals")}
function battle(enemy,reward,food){let power=s.army+s.gens.reduce((a,g)=>a+g.atk*2,0),win=power>=enemy,loss=Math.min(s.army,Math.ceil(enemy*(win?.15:.35)));s.army-=loss;s.day++;if(win){s.gold+=reward;s.food+=food;s.fame+=15;s.exp+=40;if(!s.done.includes("bandit"))s.done.push("bandit");note("大获全胜！缴获"+reward+"黄金，损失"+loss+"士兵")}else{note("战况不利，撤退损失"+loss+"士兵")}stats();panel(win?"凯旋战报":"撤军战报","<p>我军战力："+power+"，敌军战力："+enemy+"</p><p>"+(win?"敌军溃败，百姓夹道相迎。":"敌军顽强抵抗，暂且撤退整军再战。")+"</p><p>士兵损失："+loss+"，剩余兵力："+s.army+"</p><button class=choice onclick=page('world')>返回战场</button>")}
function event(){panel("乱世奇闻 · 难民来投","<p>城外有一群逃难百姓，希望进入新野避祸。粮仓本就不丰，是否开仓赈济？</p><button class=choice onclick=choice(true)>开仓赈济 · 消耗100粮草，增加30威望</button><button class=choice onclick=choice(false)>暂不收留 · 保留粮草</button>")}
function choice(yes){if(yes){if(s.food<100){alert("粮草不足");return}s.food-=100;s.fame+=30;note("开仓赈济，百姓称颂主公仁德")}else note("暂缓收留难民，军需优先");panel("事件结束","<p>你的选择已载入新野城的记忆。</p><button class=choice onclick=page('home')>返回主城</button>")}
function claim(id,reward){if(s.done.includes(id)){alert("该任务已完成");return}s.done.push(id);s.gold+=reward;note("完成军令，获得"+reward+"黄金");page("quests")}
function locked(){alert("该章节正在筹备开放")}
function reset(){if(confirm("确定清空本机游戏进度？")){localStorage.removeItem("hxsg");location.reload()}}
stats();page("home");$("log").textContent="军报："+s.log;
</script></body></html>
