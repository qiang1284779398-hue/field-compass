<style>

13;font-size:11px;color:#e5ca94}.field{position:relative;padding:12px 8px;min-height:225px;background:linear-gradient(#40543e 0 47%,#82764d 48%,#4c5b3b 52%,#28392b);overflow:hidden}.field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(165deg,transparent 0 33px,#fff1 34px 35px)}.lineup{position:relative;z-index:1;display:flex;justify-content:space-between;gap:5px;margin:4px 0 14px}.unit{width:31%;max-width:115px;min-height:80px;padding:5px 2px;text-align:center;background:#142219e8;border:1px solid #91a27b;border-radius:7px;box-shadow:0 3px 8px #0008}.unit.enemy{background:#2b1c19e8;border-color:#c17b65}.unit.dead{opacity:.28;filter:grayscale(1)}.unit .face{font-size:27px}.unit b{display:block;font-size:10px;color:#f0d8a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unit small{font-size:9px;color:#d2d7c8}.hp{height:5px;background:#101510;border-radius:5px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#81ae70}.enemy .hp i{background:#d46c5d}.vs{text-align:center;position:relative;z-index:1;font-size:10px;letter-spacing:4px;color:#f1d6a0;margin:0 0 10px}.combatlog{padding:9px;background:#111914;font-size:10px;line-height:1.7;color:#c5cebd;max-height:110px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button{min-height:42px}.modalback{display:none;position:fixed;inset:0;z-index:10;background:#000b;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:700px;max-height:82vh;overflow:auto;padding:16px;background:#202b23;border:1px solid #94794c;border-radius:15px 15px 0 0}.modal h3{margin:0;color:#efd29b}.notice{font-size:10px;color:#aab6a6;line-height:1.7;margin:10px 2px}
</style></head><body>
<header class="top"><div class="eyebrow">建安元年 · 天下十三州 · 群雄逐鹿</div><div class="brand"><div><h1>幻想三国</h1><small>群雄志 · 单机策略角色扮演</small></div><div style="text-align:right"><div id="date" style="color:#e8c98e">建安元年·春</div><small id="level">主公 Lv.1</small></div></div><div class="resources"><div class="res"><b id="gold">800</b><span>黄金</span></div><div class="res"><b id="food">1200</b><span>粮草</span></div><div class="res"><b id="wood">500</b><span>木材</span></div><div class="res"><b id="iron">180</b><span>铁矿</span></div><div class="res"><b id="fame">0</b><span>威望</span></div></div></header>
<main class="main"><div class="head"><h2 id="heading">新野 · 主城</h2><span class="sub" id="hint">山河未定，静待明主</span></div><div id="view"></div><div class="notice" id="notice">进度自动保存在本机 · 离线可玩</div></main>
<nav class="nav"><button data-p="home" onclick="go('home')"><span>🏯</span>主城</button><button data-p="heroes" onclick="go('heroes')"><span>🧑‍✈️</span>武将</button><button data-p="world" onclick="go('world')"><span>🗺️</span>天下</button><button data-p="quests" onclick="go('quests')"><span>📜</span>任务</button><button data-p="bag" onclick="go('bag')"><span>🎒</span>行囊</button></nav>
<div class="modalback" id="back" onclick="if(event.target===this)closeM()"><div class="modal" id="modal"></div></div>
<script>
const KEY="hxsg_save_v3";
const roster=[
{id:"liu",name:"刘备",title:"仁德昭烈",rarity:4,role:"统帅",troop:"枪兵",atk:42,def:52,hp:520,skill:"仁德之心",desc:"全军恢复生命并振奋士气",emoji:"👑"},
{id:"zhang",name:"张飞",title:"万夫不当",rarity:3,role:"猛将",troop:"枪兵",atk:62,def:38,hp:470,skill:"燕人怒吼",desc:"重击敌方前排，削弱士气",emoji:"🐯"},
{id:"guan",name:"关羽",title:"武圣",rarity:5,role:"猛将",troop:"骑兵",atk:78,def:48,hp:560,skill:"青龙斩",desc:"对敌方单体造成巨额伤害",emoji:"🐉"},
{id:"zhao",name:"赵云",title:"常胜将军",rarity:5,role:"先锋",troop:"骑兵",atk:72,def:55,hp:540,skill:"龙胆突击",desc:"突袭敌方后排并强化自身",emoji:"🛡️"},
{id:"zhuge",name:"诸葛亮",title:"卧龙",rarity:5,role:"军师",troop:"弓兵",atk:54,def:42,hp:420,skill:"八阵奇门",desc:"谋略攻击敌军全体并削弱士气",emoji:"🪶"},
{id:"huang",name:"黄忠",title:"老当益壮",rarity:4,role:"神射",troop:"弓兵",atk:68,def:35,hp:390,skill:"百步穿杨",desc:"优先狙击敌方后排",emoji:"🏹"},
{id:"diao",name:"貂蝉",title:"闭月",rarity:4,role:"谋士",troop:"弓兵",atk:48,def:45,hp:430,skill:"倾城",desc:"魅惑敌方，使其失去行动",emoji:"🌙"},
{id:"cao",name:"曹操",title:"乱世奸雄",rarity:5,role:"统帅",troop:"骑兵",atk:65,def:65,hp:600,skill:"魏武挥鞭",desc:"全军防御提升并振奋士气",emoji:"🦅"},
{id:"zhou",name:"周瑜",title:"美周郎",rarity:5,role:"军师",troop:"弓兵",atk:70,def:38,hp:440,skill:"赤焰",desc:"火攻敌军全体",emoji:"🔥"}
];
const foes=[["黄巾刀盾兵","步兵","🛡️",250,32,22],["黄巾长枪兵","枪兵","🔱",220,38,18],["黄巾弓手","弓兵","🏹",180,42,12],["山贼头目","骑兵","🐎",330,48,25],["西凉铁骑","骑兵","🐴",380,58,32],["董卓精兵","步兵","⚔️",420,54,38],["虎豹骑","骑兵","🐎",460,68,30],["袁绍先登","枪兵","🗡️",480,62,40]];
function fresh(){return {v:3,day:1,lv:1,exp:0,gold:800,food:1200,wood:500,iron:180,fame:0,city:1,b:{farm:1,barracks:1,wall:1,academy:1,market:1},army:{inf:120,cav:40,arch:60},heroes:[Object.assign({},roster[0],{lv:1}),Object.assign({},roster[1],{lv:1})],owned:["liu","zhang"],items:[{id:"spear",name:"精制长枪",type:"weapon",atk:8,desc:"铁木长枪"}],story:0,claimed:[],logs:["你受命镇守新野，乱世霸业由此开始。"],formation:[0,1,0]}}
let s;try{s=JSON.parse(localStorage.getItem(KEY));if(!s||s.v!==3)s=fresh()}catch(e){s=fresh()}
let pg="home",fight=null;
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem(KEY,JSON.stringify(s));topUI()},fmt=n=>Math.floor(n).toLocaleString("zh-CN"),say=t=>{s.logs.unshift("第"+s.day+"日："+t);s.logs=s.logs.slice(0,12);save()},toast=t=>{$("notice").textContent=t},topUI=()=>{["gold","food","wood","iron","fame"].forEach(k=>$(k).textContent=fmt(s[k]));$("date").textContent="建安元年·"+["春","夏","秋","冬"][Math.floor((s.day-1)/30)%4];$("level").textContent="主公 Lv."+s.lv+" · "+s.exp+"经验"};
function go(p){pg=p;draw()}function tile(icon,title,desc,fn,wide){return '<button class="tile '+(wide?'wide':'')+'" onclick="'+fn+'"><b>'+icon+'　'+title+'</b><small>'+desc+'</small></button>'}function box(t,b){return '<section class="box"><h3>'+t+'</h3>'+b+'</section>'}
function draw(){topUI();let titles={home:["新野 · 主城","城池 "+s.city+"级"],heroes:["麾下 · 武将",s.heroes.length+" 位将领"],world:["天下 · 征战","逐州平乱"],quests:["军令 · 任务","主线功业"],bag:["行囊 · 府库","装备与物资"]};$("heading").textContent=titles[pg][0];$("hint").textContent=titles[pg][1];document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===pg));let html="";if(pg==="home")html=home();if(pg==="heroes")html=heroes();if(pg==="world")html=world();if(pg==="quests")html=quests();if(pg==="bag")html=bag();$("view").innerHTML=html;$("notice").textContent="自动存档 · 离线可玩 · 军报："+s.logs[0]}
function home(){return '<div class="banner"><div class="eyebrow">荆州 · 新野县</div><h3>新野城 · '+s.city+'级城池</h3><p>城墙尚新，百姓渐安。黄巾余党仍在乡野劫掠，四方诸侯暗中扩张。以民生为本，练兵为先。</p><span class="pill">驻军 '+(s.army.inf+s.army.cav+s.army.arch)+'</span><span class="pill">麾下 '+s.heroes.length+' 将</span><span class="pill">威望 '+s.fame+'</span></div><div class="grid">'+tile("🏗️","城池建设","农田、兵营、城墙、书院与商铺","buildings()")+tile("🛡️","军营整备","征兵、训练、兵种结构","armyPage()")+tile("🍶","招贤馆","寻访天下名将","tavern()")+tile("🏪","集市贸易","买卖粮草、木材与铁矿","market()")+tile("📚","太学研习","提升全军攻防","academy()")+tile("📯","政务休整","结束当日并结算产出","nextDay()")+tile("🔥","乱世抉择","事件会影响资源与威望","eventPage()",true)+'</div>'+box("城池概况",'<div class="statsline"><span>农田日产</span><b>'+s.b.farm*35+' 粮草</b></div><div class="statsline"><span>商铺税收</span><b>'+s.b.market*18+' 黄金</b></div><div class="statsline"><span>兵营容量</span><b>'+s.b.barracks*300+' 人</b></div><button class="btn primary" onclick="nextDay()">结束当日 · 结算城池产出</button>')}
function heroes(){return '<div class="banner"><h3>良将择主 · 名士归心</h3><p>武将各有定位、兵种与专属战技。出征时三人列阵，前锋承伤，中军策应，后军输出。</p><button class="btn" onclick="formation()">调整出战阵容</button></div><div class="list">'+s.heroes.map((h,i)=>'<div class="rowcard"><div class="portrait">'+h.emoji+'</div><div class="info"><b>'+h.name+'　<span style="color:#e6c27d">'+("★".repeat(h.rarity))+'</span></b><small>'+h.title+' · '+h.role+' · '+h.troop+' · Lv.'+h.lv+'</small><small>攻击 '+atk(h)+' · 防御 '+defn(h)+' · 生命 '+h.hp+'</small></div><button class="btn" onclick="heroDetail('+i+')">详情</button></div>').join("")+'</div><div class="btnrow"><button class="btn primary" onclick="tavern()">招贤纳士</button><button class="btn" onclick="formation()">布阵</button></div>'}
function atk(h){return h.atk+(h.lv-1)*4+(h.item?8:0)+(s.techA||0)}function defn(h){return h.def+(h.lv-1)*3+(s.techD||0)}
function world(){let names=["乡野平乱","博望坡","宛城外围","汝南古道","虎牢关前","濮阳之战"],enemies=["黄巾散兵","黄巾渠帅","张绣部曲","袁术游军","董卓西凉军","吕布先锋"];return '<div class="banner"><h3>荆州战线 · 平定黄巾</h3><p>战斗采用回合制。敌我双方将在战场上列阵，兵种克制、武将技能、士气与伤亡都会影响战局。</p><span class="pill">已平定 '+s.story+' / 6</span></div><div class="list">'+names.map((n,i)=>'<div class="rowcard"><div class="portrait">'+["🏞️","🌲","🏯","⛰️","🏰","⚔️"][i]+'</div><div class="info"><b>'+(i+1)+'. '+n+(i<s.story?' · 已平定':i===s.story?' · 当前战役':' · 未解锁')+'</b><small>敌方：'+enemies[i]+' · 推荐战力 '+[180,330,520,700,980,1300][i]+'</small><small>战利品：黄金、粮草、铁矿与装备</small></div><button class="btn '+(i===s.story?'primary':'')+'" '+(i>s.story?'disabled':'')+' onclick="prepare('+i+')">'+(i<s.story?'重挑战':'出征')+'</button></div>').join("")+'</div>'}
function quests(){let q=[["first","平定乡野","完成第一场战役",s.story>0,120],["recruit","招贤纳士","招募第三位武将",s.heroes.length>=3,150],["build","固本培元","升级任意建筑",s.city>1||Object.values(s.b).some(x=>x>1),100],["level","名震荆襄","主公达到3级",s.lv>=3,200]];return '<div class="banner"><h3>功业簿 · 主线军令</h3><p>完成军令领取黄金与经验。主线进度会逐步开放新的战场。</p></div><div class="list">'+q.map(x=>'<div class="rowcard"><div class="portrait">'+(x[3]?'🏅':'📜')+'</div><div class="info"><b>'+x[2]+'</b><small>奖励 '+x[4]+' 黄金 · 经验</small></div><button class="btn" '+(!x[3]||s.claimed.includes(x[0])?'disabled':'')+' onclick="claim(\''+x[0]+'\','+x[4]+')">'+(s.claimed.includes(x[0])?'已领取':x[3]?'领取':'未完成')+'</button></div>').join("")+'</div>'}
function bag(){return '<div class="banner"><h3>府库 · 物资清点</h3><p>装备可分配给武将。战役胜利获得资源与装备，城池发展需要消耗真实库存。</p></div>'+box("资源储备",["gold","food","wood","iron","fame"].map(k=>'<div class="statsline"><span>'+({gold:"黄金",food:"粮草",wood:"木材",iron:"铁矿",fame:"威望"}[k])+'</span><b>'+fmt(s[k])+'</b></div>').join(""))+box("装备库",s.items.map(x=>'<div class="rowcard"><div class="portrait">⚔️</div><div class="info"><b>'+x.name+'</b><small>'+x.desc+' · 攻击 +'+x.atk+'</small></div></div>').join("")||"暂无装备")}
function modal(t,b){$("modal").innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>'+t+'</h3><button class="btn ghost" onclick="closeM()">关闭</button></div>'+b;$("back").style.display="flex"}function closeM(){$("back").style.display="none"}
function buildings(){let data={farm:["农田","增加每日粮草产出",{wood:90,gold:70}],barracks:["兵营","提升征兵容量",{wood:120,gold:100}],wall:["城墙","增强守城防御",{wood:150,iron:40}],academy:["书院","提升科技研究",{wood:100,gold:120}],market:["商铺","增加每日税收",{wood:100,gold:90}]};modal("城池建设",'<div class="list">'+Object.keys(data).map(k=>'<div class="rowcard"><div class="portrait">🏗️</div><div class="info"><b>'+data[k][0]+' · '+s.b[k]+'级</b><small>'+data[k][1]+' · 消耗 '+costText(data[k][2])+'</small></div><button class="btn" onclick="upgrade(\''+k+'\')">升级</button></div>').join("")+'</div>')}
function costText(c){return Object.entries(c).map(x=>({gold:"金",food:"粮",wood:"木",iron:"铁"}[x[0]]+x[1]).join(" / ")}
function enough(c){return Object.keys(c).every(k=>s[k]>=c[k])}function spend(c){Object.keys(c).forEach(k=>s[k]-=c[k])}
function upgrade(k){let c={farm:{wood:90,gold:70},barracks:{wood:120,gold:100},wall:{wood:150,iron:40},academy:{wood:100,gold:120},market:{wood:100,gold:90}}[k];if(!enough(c))return toast("资源不足，先发展城池或征战");spend(c);s.b[k]++;s.city++;say("扩建"+k+"，城池发展提升");save();buildings();draw()}
function armyPage(){modal("军营整备",'<div class="statsline"><span>步兵</span><b>'+s.army.inf+'人</b></div><div class="statsline"><span>骑兵</span><b>'+s.army.cav+'人</b></div><div class="statsline"><span>弓兵</span><b>'+s.army.arch+'人</b></div><p class="notice">步兵防御均衡；骑兵克制弓兵；弓兵克制枪兵；枪兵克制骑兵。</p><div class="list"><button class="btn" onclick="recruitTroops(\'inf\')">征募步兵50 · 80金/100粮</button><button class="btn" onclick="recruitTroops(\'cav\')">征募骑兵20 · 120金/100粮/20铁</button><button class="btn" onclick="recruitTroops(\'arch\')">征募弓兵30 · 100金/100粮</button><button class="btn primary" onclick="train()">全军操练 · 100粮/50金</button></div>')}
function recruitTroops(k){let c={inf:{gold:80,food:100},cav:{gold:120,food:100,iron:20},arch:{gold:100,food:100}}[k];if(!enough(c))return toast("资源不足");spend(c);s.army[k]+={inf:50,cav:20,arch:30}[k];say("军营新募兵员");save();armyPage();draw()}
function train(){if(!enough({food:100,gold:50}))return toast("粮草或黄金不足");spend({food:100,gold:50});s.army.inf+=10;s.army.cav+=5;s.army.arch+=10;s.techA=(s.techA||0)+1;say("全军操练，战术熟练度提升");save();armyPage();draw()}
function academy(){modal("太学研习",'<p>研究永久提升全军属性。</p><p>当前攻击科技 +'+(s.techA||0)+' · 防御科技 +'+(s.techD||0)+'</p><div class="list"><button class="btn primary" onclick="research(1)">研习兵法 · 攻击+3（150金/50铁）</button><button class="btn" onclick="research(2)">研习守备 · 防御+3（120金/100木）</button></div>')}
function research(n){let c=n===1?{gold:150,iron:50}:{gold:120,wood:100};if(!enough(c))return toast("资源不足");spend(c);if(n===1)s.techA=(s.techA||0)+3;else s.techD=(s.techD||0)+3;say("太学研究取得进展");save();academy();draw()}
function tavern(){let pool=roster.filter(h=>!s.owned.includes(h.id));modal("招贤馆 · 寻访名士",'<div class="banner"><h3>一盏浊酒，广纳英才</h3><p>寻访花费260黄金，必得一名尚未招募的武将。每位武将拥有独特定位与专属战技。</p><span class="pill">尚未招募 '+pool.length+' 位</span></div><button class="btn primary" style="width:100%;margin-top:10px" '+(!pool.length?'disabled':'')+' onclick="recruitHero()">寻访天下豪杰 · 260金</button>')}
function recruitHero(){if(!enough({gold:260}))return toast("黄金不足");let pool=roster.filter(h=>!s.owned.includes(h.id));if(!pool.length)return toast("已寻访所有可用武将");let h=pool[Math.floor(Math.random()*pool.length)];spend({gold:260});s.owned.push(h.id);s.heroes.push(Object.assign({},h,{lv:1}));say(h.name+"加入麾下");save();closeM();go("heroes")}
function heroDetail(i){let h=s.heroes[i];modal(h.name+" · 武将详情",'<div class="rowcard"><div class="portrait">'+h.emoji+'</div><div class="info"><b>'+h.title+' · '+("★".repeat(h.rarity))+'</b><small>'+h.role+' · '+h.troop+' · Lv.'+h.lv+'</small><small>攻击 '+atk(h)+' · 防御 '+defn(h)+' · 生命 '+h.hp+'</small></div></div><div class="box"><h3>专属战技：'+h.skill+'</h3><p>'+h.desc+'</p></div><div class="btnrow"><button class="btn primary" onclick="levelHero('+i+')">培养升级 · 120金</button><button class="btn" onclick="equip('+i+')">装备武器</button></div>')}
function levelHero(i){if(!enough({gold:120}))return toast("黄金不足");spend({gold:120});let h=s.heroes[i];h.lv++;h.hp+=25;h.atk+=4;h.def+=3;say(h.name+"提升至"+h.lv+"级");save();heroDetail(i);draw()}
function equip(i){let h=s.heroes[i];if(!s.items.length)return toast("没有可用装备");h.item=true;say(h.name+"装备精制长枪");save();heroDetail(i);draw()}
function formation(){let opts=s.heroes.map((h,i)=>'<option value="'+i+'">'+h.name+'</option>').join("");modal("出战阵容",'<p>选择前锋、中军、后军三名不同武将。</p>'+[0,1,2].map((n)=>'<label style="display:block;margin:10px 0;color:#e2c58e">'+["前锋","中军","后军"][n]+'<select id="slot'+n+'" style="display:block;width:100%;padding:10px;background:#111914;color:white;margin-top:5px">'+opts+'</select></label>').join("")+'<button class="btn primary" onclick="saveFormation()">保存阵容</button>');let f=s.formation||[0,1,0];setTimeout(()=>f.forEach((x,i)=>{if($("slot"+i))$("slot"+i).value=x}),0)}
function saveFormation(){let f=[0,1,2].map(i=>+$("slot"+i).value);if(new Set(f).size!==3)return toast("阵容不能重复");s.formation=f;say("重新编组出战阵容");save();closeM()}
function prepare(stage){let f=s.formation||[0,1,0];let picks=f.map(i=>s.heroes[i]).filter(Boolean);if(new Set(picks).size!==3)return toast("请先招募至少三名武将并完成布阵");let mult=[1,1.25,1.5,1.75,2.1,2.5][stage];fight={stage,round:1,phase:"player",morale:70,enemyMorale:65,logs:["两军列阵，战鼓响起。请观察敌方阵容，选择战术。"],allies:picks.map(h=>({name:h.name,emoji:h.emoji,troop:h.troop,role:h.role,skill:h.skill,desc:h.desc,hp:h.hp+(h.lv-1)*25,max:h.hp+(h.lv-1)*25,atk:atk(h),def:defn(h),alive:true})),enemies:[]};for(let i=0;i<(stage<2?3:4);i++){let x=foes[(stage*2+i)%foes.length];fight.enemies.push({name:x[0],troop:x[1],emoji:x[2],hp:Math.round(x[3]*mult),max:Math.round(x[3]*mult),atk:Math.round(x[4]*mult),def:Math.round(x[5]*mult),alive:true})}pg="battle";drawBattle()}
function msg(t){fight.logs.push(t);fight.logs=fight.logs.slice(-24)}function live(a){return a.filter(x=>x.alive)}function tgt(){return fight.enemies.findIndex(x=>x.alive)}function mult(a,d){if(a==="骑兵"&&d==="弓兵"||a==="弓兵"&&d==="枪兵"||a==="枪兵"&&d==="骑兵")return 1.35;if(a==="弓兵"&&d==="骑兵"||a==="枪兵"&&d==="弓兵"||a==="骑兵"&&d==="枪兵")return .8;return 1}function hurt(a,d,scale){let n=Math.max(8,Math.round((a.atk+Math.random()*10-d.def*.45)*(scale||1)*mult(a.troop,d.troop)));d.hp=Math.max(0,d.hp-n);if(!d.hp){d.alive=false;msg(d.name+"阵亡，退出战斗")}return n}
function drawBattle(){topUI();$("heading").textContent="战场 · 两军对垒";$("hint").textContent="第"+fight.round+"回合 · "+(fight.phase==="end"?"战斗结束":fight.phase==="enemy"?"敌军行动":"我军行动");document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));let units=(arr,e)=>arr.map(u=>'<div class="unit '+(e?'enemy ':'')+(!u.alive?'dead':'')+'"><div class="face">'+u.emoji+'</div><b>'+u.name+'</b><small>'+u.troop+' · '+Math.max(0,u.hp)+'/'+u.max+'</small><div class="hp"><i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i></div></div>').join("");let ended=fight.phase==="end";$("view").innerHTML='<div class="battle"><div class="battlehead"><span>我军 · 新野军</span><span>敌军 · '+["黄巾余党","黄巾渠帅","张绣部曲","袁术游军","董卓西凉军","吕布先锋"][fight.stage]+'</span></div><div class="field"><div class="lineup">'+units(fight.allies,false)+'</div><div class="vs">⚔　VS　⚔</div><div class="lineup">'+units(fight.enemies,true)+'</div></div><div class="battlehead"><span>我军士气 '+fight.morale+'</span><span>敌军士气 '+fight.enemyMorale+'</span></div><div class="combatlog">'+fight.logs.slice(-6).map(x=>'<div>'+x+'</div>').join("")+'</div></div><div class="statsline"><span>我军存活 '+live(fight.allies).length+'/'+fight.allies.length+'</span><span>敌军存活 '+live(fight.enemies).length+'/'+fight.enemies.length+'</span></div>'+(ended?'<div class="box"><h3>'+(fight.win?'🏆 大获全胜':'⚑ 暂时撤退')+'</h3><p>'+fight.result+'</p><button class="btn primary" onclick="finishFight()">返回战场</button></div>':'<div class="box"><h3>主公军令 · 选择行动</h3><p>骑兵克弓兵、弓兵克枪兵、枪兵克骑兵。前排更容易受到近战攻击，谋略技能可以改变战局。</p><div class="actions"><button class="btn primary" onclick="attack()">⚔ 普通攻击</button><button class="btn" onclick="skill()">✨ 武将战技</button><button class="btn" onclick="defend()">🛡 全军防御</button><button class="btn" onclick="rally()">📯 擂鼓振奋</button></div><div class="btnrow"><button class="btn ghost" onclick="retreat()">撤退</button><button class="btn ghost" onclick="attack()">快速行动</button></div></div>')}
function attack(){if(fight.phase!=="player")return;let a=live(fight.allies)[0],i=tgt();if(!a||i<0)return;let d=hurt(a,fight.enemies[i],1);msg(a.name+"发动攻击，对"+fight.enemies[i].name+"造成"+d+"点伤害。");afterPlayer()}
function skill(){if(fight.phase!=="player")return;let a=live(fight.allies).find(x=>x.role==="军师")||live(fight.allies)[0];if(!a)return;let e=live(fight.enemies);if(a.skill==="仁德之心"){fight.allies.forEach(x=>{if(x.alive)x.hp=Math.min(x.max,x.hp+100)});fight.morale=Math.min(100,fight.morale+18);msg(a.name+"施展仁德之心，全军恢复生命，士气提升！")}else if(a.skill==="八阵奇门"||a.skill==="赤焰"){let sum=0;e.forEach(x=>sum+=hurt(a,x,1.4));fight.enemyMorale=Math.max(0,fight.enemyMorale-15);msg(a.name+"发动"+a.skill+"，敌军全体受到"+sum+"点谋略伤害！")}else if(a.skill==="魏武挥鞭"){fight.allies.forEach(x=>x.def+=10);fight.morale=Math.min(100,fight.morale+20);msg(a.name+"发动魏武挥鞭，全军防御提升！")}else if(a.skill==="倾城"){e[0].stun=true;msg(a.name+"施展倾城，"+e[0].name+"陷入混乱！")}else{let t=e[0],d=hurt(a,t,2);msg(a.name+"施展"+a.skill+"，重创"+t.name+"，造成"+d+"点伤害！");fight.enemyMorale=Math.max(0,fight.enemyMorale-8)}afterPlayer()}
function defend(){fight.allies.forEach(x=>{if(x.alive)x.def+=14});fight.morale=Math.min(100,fight.morale+6);msg("我军结成防御阵势，防御提升，士气稳定。");afterPlayer()}function rally(){if(fight.morale>88)return toast("士气已高");fight.morale=Math.min(100,fight.morale+20);msg("主公亲自擂鼓，全军士气高涨！");afterPlayer()}
function afterPlayer(){if(checkEnd())return;fight.phase="enemy";drawBattle();setTimeout(enemyTurn,450)}
function enemyTurn(){if(!fight||fight.phase==="end")return;live(fight.enemies).forEach(e=>{let a=live(fight.allies);if(!a.length)return;if(e.stun){e.stun=false;msg(e.name+"阵脚大乱，错失攻击");return}let t=a[Math.random()<.65?0:Math.floor(Math.random()*a.length)],d=hurt(e,t,fight.morale<30?1.2:1);msg(e.name+"攻击"+t.name+"，造成"+d+"点伤害。")});fight.allies.forEach(x=>{let h=s.heroes.find(z=>z.name===x.name);if(h)x.def=defn(h)});fight.round++;fight.phase="player";if(checkEnd())return;drawBattle()}
function checkEnd(){if(!live(fight.enemies).length){fight.phase="end";fight.win=true;fight.result="敌军阵线崩溃，我军控制战场。将士士气大振，百姓得以安宁。";msg("敌军全线溃败，我军获胜！");drawBattle();return true}if(!live(fight.allies).length||fight.round>12){fight.phase="end";fight.win=false;fight.result="我军伤亡较重，军令撤退。整补兵马后仍可再次挑战。";msg("军势不继，鸣金收兵！");drawBattle();return true}return false}
function retreat(){fight.phase="end";fight.win=false;fight.result="主公下令撤退，保存有生力量。";drawBattle()}
function finishFight(){let st=fight.stage;if(fight.win){s.story=Math.max(s.story,st+1);let reward=180+st*90;s.gold+=reward;s.food+=220+st*50;s.iron+=25+st*8;s.fame+=35+st*15;s.exp+=70+st*35;while(s.exp>=s.lv*100){s.exp-=s.lv*100;s.lv++;s.fame+=20}s.heroes.forEach(h=>{h.exp=(h.exp||0)+35});let loss=Math.ceil((s.army.inf+s.army.cav+s.army.arch)*(.04+st*.01));["inf","cav","arch"].forEach(k=>s.army[k]=Math.max(0,s.army[k]-Math.ceil(loss/3)));if(st===0&&!s.items.some(x=>x.id==="blade"))s.items.push({id:"blade",name:"黄巾缴获铁剑",type:"weapon",atk:15,desc:"战场缴获的精铁剑"});say("战役获胜，缴获"+reward+"黄金，部队伤亡约"+loss+"人")}else{let loss=Math.ceil((s.army.inf+s.army.cav+s.army.arch)*.06);["inf","cav","arch"].forEach(k=>s.army[k]=Math.max(0,s.army[k]-Math.ceil(loss/3)));s.food=Math.max(0,s.food-80);say("战役撤退，伤亡约"+loss+"人，消耗军粮")}fight=null;go("world")}
function market(){modal("新野集市",'<p>商队交易按固定价格结算。</p><div class="list"><button class="btn" onclick="trade(\'food\',100,\'粮草\',300)">购入粮草300 · 100金</button><button class="btn" onclick="trade(\'wood\',100,\'木材\',150)">购入木材150 · 100金</button><button class="btn" onclick="trade(\'iron\',120,\'铁矿\',60)">购入铁矿60 · 120金</button><button class="btn" onclick="sellFood()">出售粮草300 · 得70金</button></div>')}
function trade(k,c,n,v){if(s.gold<c)return toast("黄金不足");s.gold-=c;s[k]+=v;say("集市购入"+n);save();market();draw()}function sellFood(){if(s.food<300)return toast("粮草不足");s.food-=300;s.gold+=70;say("出售粮草换得70黄金");save();market();draw()}
function eventPage(){let es=[["流民求援","城外百姓饥寒交迫，愿以劳力换取一口粮食。","开仓赈济 · 100粮，威望+25","暂缓赈济",()=>{if(s.food<100)return toast("粮草不足");s.food-=100;s.fame+=25;say("赈济流民，民心渐稳")},()=>say("军需紧张，暂缓赈济")],["铁匠献策","铁匠愿为军中打造兵器，需要提供铁矿。","资助打造 · 40铁，全军攻击+3","婉拒",()=>{if(s.iron<40)return toast("铁矿不足");s.iron-=40;s.techA=(s.techA||0)+3;say("打造精良兵刃，全军攻击提升")},()=>say("暂不打造兵器")],["商旅入城","商队愿以优惠价格出售粮食。","交易 · 60金，获得250粮","不交易",()=>{if(s.gold<60)return toast("黄金不足");s.gold-=60;s.food+=250;say("商旅交易成功")},()=>say("商队离开新野")]];let e=es[Math.floor(Math.random()*es.length)];modal("城中事件 · "+e[0],'<p>'+e[1]+'</p><div class="list"><button class="btn primary" onclick="eventChoice(0)">'+e[2]+'</button><button class="btn" onclick="eventChoice(1)">'+e[3]+'</button></div>');window.ev=e}
function eventChoice(n){let e=window.ev;if(e)e[4+n]();save();closeM();draw()}
function nextDay(){s.day++;let grain=s.b.farm*35,coin=s.b.market*18,up=Math.ceil((s.army.inf+s.army.cav+s.army.arch)*.12);s.food+=grain;s.gold+=coin;s.food=Math.max(0,s.food-up);say("政务结算：农田产粮"+grain+"，商铺税收"+coin+"，军队消耗粮草"+up);save();draw();toast("新的一天开始，城池产出已结算")}
function claim(id,r){if(s.claimed.includes(id))return;s.claimed.push(id);s.gold+=r;s.exp+=60;while(s.exp>=s.lv*100){s.exp-=s.lv*100;s.lv++;s.fame+=20}say("完成军令，获得"+r+"黄金");save();draw()}
function resetSave(){if(confirm("确定清空本机存档？")){localStorage.removeItem(KEY);s=fresh();save();closeM();go("home")}}
draw();
</script></body></html>
