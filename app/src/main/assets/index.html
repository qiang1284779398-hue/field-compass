{title:"桃园余烬",era:"中平元年·春",region:"涿郡",intro:"涿郡连日风沙，官道上逃难的百姓挤成一线。你奉县令之命护送粮车，却在芦苇荡外听见了第一声战鼓。",dialog:[["刘备","百姓不是乱世的筹码。粮车若失，沿途数百户人家便要断炊。"],["关羽","前方烟尘不散，似有黄巾斥候。先护住车队，再寻其主力。"],["张飞","何必多言？俺带一队人马冲开道路！"]],battle:"涿郡护粮",boss:"黄巾头目·程远志",choice:["分粮给逃民，获得民心与少量粮草","集中护送粮车，获得额外黄金和军械"],side:"芦苇荡中的求救声",sideText:"一名受伤的乡勇藏在河堤下。他知道黄巾军下一处集结点，但救治他会耽误行军。"},
{title:"颍川烽火",era:"中平元年·夏",region:"颍川",intro:"颍川数县同时告急，黄巾军以流民为掩护，白日分散、夜间聚集。斥候带回一张染血的粮道图。",dialog:[["简雍","敌军并非乌合之众。他们切断驿道，又故意留下空营，引我们深入。"],["刘备","百姓被裹挟其中，不能只看旗号。攻营之前先查明粮仓里有多少人质。"],["张飞","若真有百姓，俺便收住矛头；若是诱饵，俺也不会让他们得逞。"]],battle:"长社外围",boss:"黄巾渠帅·波才",choice:["夜袭粮营，战斗难度降低并获得粮草","先救援村庄，提升民心并获得声望"],side:"失散的信使",sideText:"一名驿卒握着半封密信，信中提到黄巾军内部有人愿意倒戈。"},
{title:"广宗围城",era:"中平元年·秋",region:"广宗",intro:"广宗城外，官军与黄巾军对峙多日。城中粮食见底，城外却有人不断把箭书射进营地，要求谈判。",dialog:[["卢植","围城最怕急功。壕沟、粮道、民心，哪一样都不能落下。"],["关羽","城门并非唯一入口。夜里水渠涨潮，或许能送入一支小队。"],["刘备","先把城中百姓安置妥当，再决定如何破城。"]],battle:"广宗破围",boss:"黄巾大将·张角亲卫",choice:["筑垒围困，稳扎稳打","潜入水渠，冒险奇袭"],side:"城下的药童",sideText:"药童请求你救出被困在城中的师父，师父手里有一份城防图。"},
{title:"洛阳风雪",era:"中平六年·冬",region:"洛阳",intro:"京师的雪落得很厚，宫门内外却比战场更冷。何进召集诸将，密议诛除宦官。你奉命送信入城，发现各方势力都在暗中调兵。",dialog:[["曹操","兵刃一旦入宫，便不会只听一个人的号令。"],["袁绍","大事在即，优柔寡断只会让祸根继续蔓延。"],["刘备","若只想着胜负，最后受苦的仍是城中百姓。"]],battle:"宫门乱军",boss:"禁军都尉·蹇硕旧部",choice:["保护宫门百姓，获得民望","协助控制军械库，获得武器材料"],side:"宫墙下的密诏",sideText:"一个小黄门递来密诏，声称能证明某位大臣通敌。"},
{title:"虎牢关前",era:"初平元年·春",region:"虎牢关",intro:"十八路诸侯会盟，旌旗连绵数十里。联军看似声势浩大，各营却各怀心思。关前吕布单骑挑战，军中一时无人应答。",dialog:[["袁绍","诸侯齐聚，粮草军械皆已备足。"],["关羽","关前那人气势惊人，但阵前斗将不该决定全军生死。"],["张飞","三姓家奴！待俺去会会他！"],["刘备","切记，今日要争的不只是名声，还有盟军的信任。"]],battle:"虎牢关突围",boss:"并州飞将·吕布",choice:["与诸侯联军协同攻关，提升盟友信任","独立突袭侧翼，获得稀有战利品"],side:"诸侯营中的争吵",sideText:"两支盟军因军粮分配即将火并，调停可能改变之后的盟友态度。"},
{title:"长安夜变",era:"初平三年·夏",region:"长安",intro:"董卓死后，长安并未迎来安宁。李傕、郭汜反目，街市被火光照亮。你必须在混乱中找到天子车驾的去向。",dialog:[["贾诩","乱局里最危险的不是敌人，而是看不清谁在利用谁。"],["刘备","先护送难民离开，再设法查明车驾路线。"],["关羽","巷战不宜铺开，盾兵走前，弓手压住屋顶。"]],battle:"长安护驾",boss:"西凉叛将·郭汜",choice:["护送难民出城，民心大涨","追击叛军主将，获得军械和威望"],side:"被焚毁的医馆",sideText:"医馆里还有伤兵和一位不愿离开的老郎中。"},
{title:"徐州春雨",era:"兴平元年·春",region:"徐州",intro:"徐州遭逢兵灾，田地荒芜。陶谦求援的书信送到时，城外已能看见流民队伍。你要在有限粮草里决定先救谁。",dialog:[["糜竺","城中仓廪不多，若全数赈济，军队恐怕撑不过三日。"],["刘备","若百姓都离开了，守住一座空城又有何用？"],["张飞","俺去守粮仓，谁也别想趁乱抢粮。"]],battle:"徐州救民",boss:"曹军先锋·夏侯惇",choice:["分仓赈济，民心与伙伴羁绊提升","集中粮草守城，军队补给增加"],side:"泥泞中的孤儿",sideText:"一群孩子躲在倒塌的祠堂里，领头的女孩认识一条通往敌军后方的小路。"},
{title:"小沛风云",era:"兴平二年·秋",region:"小沛",intro:"徐州易手，吕布驻军小沛。城中商旅不断传出异动，陈宫的书信被截获一半。你要弄清这座城究竟忠于谁。",dialog:[["陈宫","只凭一纸盟约，救不了一座城。"],["关羽","城门守备松紧有序，不像临时驻军。有人提前布置过。"],["刘备","先查百姓口中的消息，不要轻信营中传闻。"]],battle:"小沛夺门",boss:"陷阵营统领·高顺",choice:["策反守门军士，减少敌方数量","正面攻城，获得更多战功"],side:"酒肆里的旧部",sideText:"一名旧部愿意献出城门钥匙，但要求你赦免其家人。"},
{title:"下邳寒潮",era:"建安三年·冬",region:"下邳",intro:"下邳城外水势渐涨，吕布军粮渐少。城中有人主张死战，也有人想开城投降。你必须在决战前争取城内人心。",dialog:[["陈登","水围之计可行，但若决堤，城中百姓也会遭殃。"],["刘备","不能为了胜利把整座城变成坟场。"],["张飞","若能逼吕布出城，俺愿率前锋去拦他。"]],battle:"下邳决战",boss:"飞将·吕布",choice:["断其粮道，战斗更稳妥","水攻城外营寨，获得快速胜利但民心受损"],side:"城头白旗",sideText:"城中守将暗中挂起白旗，究竟是真降还是诱敌，需要你判断。"},
{title:"官渡前夜",era:"建安四年·秋",region:"延津",intro:"袁绍大军南下，曹操据官渡迎战。粮道、渡口与斥候成为胜负关键。你受命协助曹军守住延津，却发现军报中有数处矛盾。",dialog:[["曹操","兵多不等于胜。能让敌人犯错，比让自己拼命更重要。"],["荀彧","粮秣若失，前线再勇也只能撤退。"],["关羽","若敌将轻进，可趁其阵形未成时截断侧翼。"]],battle:"延津截粮",boss:"袁军先锋·颜良",choice:["潜袭粮车，削弱后续敌军","稳守渡口，获得盟军支援"],side:"无主的军令牌",sideText:"一块军令牌遗落在河岸，牌上刻着不属于袁军的印记。"},
{title:"乌巢夜火",era:"建安五年·冬",region:"乌巢",intro:"乌巢粮仓守备森严，夜色里只有巡逻火把移动。许攸带来的情报或真或假，行动只有一次机会。",dialog:[["许攸","仓中粮秣堆积如山，守将淳于琼却疏于防备。"],["曹操","情报越是顺耳，越要留一条退路。"],["赵云","我愿先行探路，若有伏兵便放烟示警。"]],battle:"乌巢夜袭",boss:"淳于琼",choice:["轻骑潜入，速度快但补给少","伪装押粮队，风险较低但消耗黄金"],side:"粮仓里的俘虏",sideText:"你发现被强征的民夫被锁在粮仓边屋，放走他们会延误撤离。"},
{title:"官渡决战",era:"建安五年·冬",region:"官渡",intro:"袁绍大营开始动摇，但主力仍有十余万。曹军营中粮少士疲，最后一场会战不能只靠勇猛。你要在敌军中军与两翼之间找到破绽。",dialog:[["曹操","我军虽少，士气尚在。今日只争一线生机。"],["荀攸","敌军号令不一，击其鼓角，便能使各部互疑。"],["刘备","战后仍要收容伤兵，不可让胜利变成新的灾难。"]],battle:"官渡大会战",boss:"袁绍中军·审配",choice:["先破鼓角，扰乱敌军指挥","强攻中军，追求速战"],side:"袁军降卒",sideText:"一队降卒愿献出营门路线，但其中有人曾参与屠掠村庄。"},
{title:"荆州暗流",era:"建安六年·春",region:"襄阳",intro:"荆州牧刘表病重，蔡氏与蒯氏各有谋划。你奉刘备之命前往襄阳，却发现城内的每一份礼单都藏着利益交换。",dialog:[["诸葛亮","局势未明时，最有用的不是站队，而是知道谁害怕什么。"],["伊籍","州府档案记录着粮税、兵籍和各家田产，可以查出谁在暗中扩军。"],["刘备","荆州不能再起战火。能谈成的事，就不要先拔刀。"]],battle:"襄阳暗巷",boss:"蔡氏亲卫·蔡中",choice:["公开账册，获得百姓支持","秘密结盟，获得战略情报"],side:"蒯府密账",sideText:"一名书吏愿意交出账簿，但要求保护其家人离开襄阳。"},
{title:"新野屯田",era:"建安七年·夏",region:"新野",intro:"新野成为暂时的栖身之所。城墙不高，兵马不多，最要紧的是让百姓安心耕种。你要把一座小城经营成能支撑长期战事的根基。",dialog:[["诸葛亮","城池的命脉有三：粮仓、道路和人心。只修城墙是不够的。"],["糜竺","商路若通，城中便有余粮，也能吸引工匠和流民。"],["刘备","让百姓先种下这一季的庄稼。我们要有能守住的家。"]],battle:"新野护田",boss:"曹军游骑·于禁",choice:["优先修水渠，提升长期粮产","优先修兵营，提升军队上限"],side:"荒田里的铜匣",sideText:"农夫在荒田挖出一只铜匣，里面是前朝留下的兵书残页。"},
{title:"博望设伏",era:"建安八年·秋",region:"博望坡",intro:"曹军南下探路，夏侯惇自恃兵强，沿山谷推进。诸葛亮首次独立调度军阵，火攻、伏兵和撤退路线都要提前准备。",dialog:[["诸葛亮","火不是目的，逼敌人离开最有利的阵地才是目的。"],["赵云","我带骑兵守住谷口，待敌军追击时再切断退路。"],["张飞","俺埋伏在林后，等他们的旗子进来就冲！"]],battle:"博望坡火阵",boss:"夏侯惇",choice:["按计划诱敌入谷，降低敌军攻势","提前破坏粮车，敌军数量减少"],side:"误入山谷的百姓",sideText:"山谷里有百姓躲避兵灾，火攻计划若不调整，便会危及他们。"},
{title:"长坂惊尘",era:"建安十三年·秋",region:"当阳",intro:"曹操大军疾驰南下，刘备携百姓撤退。道路被辎重堵塞，孩童哭声混在马蹄声里。赵云请命深入敌阵寻找失散的家眷。",dialog:[["刘备","百姓愿随我走，是信任。不能把他们留在这里。"],["赵云","主公放心，我去去便回。"],["张飞","桥头有我！敌军若敢追来，先问俺的丈八蛇矛！"]],battle:"长坂突围",boss:"曹军虎豹骑统领",choice:["护送百姓缓行，伤亡较低","分兵救援失散者，可能获得赵云羁绊"],side:"断桥上的马车",sideText:"一辆马车横在桥上，车中有人呼救，后方追兵已近。"},
{title:"江夏借兵",era:"建安十三年·冬",region:"夏口",intro:"刘备退至夏口，江东孙权正在衡量战与和。鲁肃前来会面，带来的并不是盟约，而是一连串关于曹军水师的难题。",dialog:[["鲁肃","孙刘结盟并非没有代价。江东需要看见你们守住承诺的能力。"],["诸葛亮","江面风向、船只吃水、火油储量，都是谈判桌上的筹码。"],["周瑜","若无水军训练，纵有十万兵也只是岸上的看客。"]],battle:"夏口水寨",boss:"曹军水将·蔡瑁",choice:["协助训练水军，提升江东关系","夺取敌船图册，获得稀有图纸"],side:"江东老船工",sideText:"一名老船工知道暗流所在，但他不肯为陌生人冒险。"},
{title:"赤壁连环",era:"建安十三年·冬",region:"赤壁",intro:"曹军连环战船停泊江面，铁索相连，营中疫病和北方士卒不习水性的问题逐渐暴露。周瑜与诸葛亮对火攻时机意见不一。",dialog:[["周瑜","风向不稳，贸然纵火会把火带回自己船队。"],["诸葛亮","敌军虽连舟，却并非没有防备。先让他们相信我们已无战意。"],["黄盖","苦肉之计可以一试，但必须把撤离路线算到每一条船。"]],battle:"赤壁前哨",boss:"曹军水寨统领",choice:["配合黄盖诈降，风险高但削弱敌军","夜间破坏铁索，稳妥但消耗材料"],side:"病船上的伤兵",sideText:"一艘船上爆发疫病，若封船可能救不了伤兵，若放任又会传染全营。"},
{title:"东风火起",era:"建安十三年·冬",region:"乌林",intro:"东南风终于转起，火船在江雾中缓缓靠近。敌营鼓声突然改变节奏，说明有人识破了计策。真正的决战提前开始。",dialog:[["周瑜","火船入阵之后，诸军必须按旗号行动，不许争功。"],["黄盖","若我未能回来，记住先救水里的人。"],["诸葛亮","风势会变，胜负也会变。留一支队伍守住撤退口。"]],battle:"赤壁大火",boss:"曹军中军将领",choice:["集中火攻，快速摧毁敌船","分段点火，优先救出被困水兵"],side:"落水的敌军士兵",sideText:"敌军士兵抓住残木求救。救还是不救，可能影响战后降卒的态度。"},
{title:"南郡争夺",era:"建安十四年·春",region:"江陵",intro:"赤壁之后，曹军退守北方，南郡城内粮仓未开。周瑜主张速攻，刘备更在意沿途郡县是否愿意归附。",dialog:[["周瑜","城门一日不破，便多一日变数。"],["诸葛亮","占城容易，安民难。粮仓、县令和渡口都要同时控制。"],["赵云","我可以先探查城门轮值，找出守军换岗的空隙。"]],battle:"南郡攻防",boss:"曹仁",choice:["猛攻外城，获得战功","先安抚乡县，减少后续事件风险"],side:"城中粮官",sideText:"粮官愿意投诚，但粮仓里有一批被污损的谷物。"},
{title:"入蜀险道",era:"建安十六年·夏",region:"葭萌关",intro:"刘璋邀请刘备入蜀，张松绘制的地图藏着诸多险道。有人劝你趁机夺取益州，有人提醒入蜀之路可能成为绝路。",dialog:[["法正","益州富庶，真正的难处不是进去，而是进去之后如何让人愿意留下。"],["刘备","受人之托，不可先负其信。若不得已，也要尽量少伤无辜。"],["黄忠","山道狭窄，弓手应占高处，粮车不能离开主队太远。"]],battle:"葭萌关道",boss:"张鲁先锋·杨任",choice:["接受沿途县令投诚，获得民心","秘密控制关隘，获得战略主动"],side:"被扣押的向导",sideText:"一名向导知道山洪路线，却被怀疑私通敌军。"},
{title:"雒城攻坚",era:"建安十七年·春",region:"雒城",intro:"雒城久攻不下，张任熟悉地势，常在夜间袭击营地。军中开始有人抱怨粮食短缺，士气正在下降。",dialog:[["庞统","强攻城墙只会让守军更有把握。先让他们以为援军已经断绝。"],["魏延","我愿率精兵夜袭侧门。"],["刘备","不可轻视守城将士。能让他们开城，就不要把百姓拖进火海。"]],battle:"雒城夜袭",boss:"蜀中名将·张任",choice:["断水道逼其谈判，降低民心损失","夜袭东门，获得更好的战利品"],side:"城外的木匠",sideText:"木匠知道城墙修补的薄弱位置，但他的家人仍在城中。"},
{title:"定军山",era:"建安二十四年·春",region:"定军山",intro:"汉中争夺进入关键时刻，夏侯渊沿山布阵，黄忠请命夺取高处。山雾、坡道和运粮栈道都可能改变战局。",dialog:[["法正","敌军守将经验丰富，但过于分散。只要逼他离开营垒，山势便是我们的盟友。"],["黄忠","老夫尚能开弓。今日便让他们看看，何谓老当益壮。"],["赵云","我守住山口，若有追兵便以旗火传讯。"]],battle:"定军山奇袭",boss:"夏侯渊",choice:["黄忠率队夺高地，解锁专属羁绊","赵云护粮道，获得长期补给加成"],side:"山顶的烽火台",sideText:"烽火台守卒愿意投降，但他要求保全家中老母。"},
{title:"汉水惊涛",era:"建安二十四年·夏",region:"汉水",intro:"曹军在汉水沿岸重新集结，赵云奉命接应黄忠。敌军故意留下粮车，引诱我军深入河滩。",dialog:[["赵云","粮车太整齐了，像是专门给我们看的。"],["黄忠","若是诱饵，便让它变成诱敌的筹码。"],["诸葛亮","渡河不争一时快，先占高地，再决定是否追击。"]],battle:"汉水空营",boss:"曹军猛将·徐晃",choice:["占据高地等待敌军，稳健取胜","趁水势夜袭，收益高但风险大"],side:"河岸的渔村",sideText:"渔民熟悉浅滩，却担心战火毁掉船只和渔网。"},
{title:"荆州烽烟",era:"建安二十四年·秋",region:"江陵",intro:"关羽北伐之际，后方荆州传来急报。江东军队沿江逼近，城中守将各有盘算。你必须决定如何协调前线与后方。",dialog:[["关羽","前线若退，北方诸郡便再无牵制。"],["诸葛亮","后方若失，前线再胜也会变成孤军。"],["刘备","消息不能只靠一条驿道，派出两路信使，分别走水路和山路。"]],battle:"荆州保卫",boss:"江东名将·吕蒙",choice:["回援荆州，保留后方据点","继续北线攻势，获得更高威望但风险增加"],side:"城中密使",sideText:"一名密使掌握江东军换防时间，但他可能是双面间谍。"},
{title:"夷陵余烬",era:"章武二年·夏",region:"夷陵",intro:"多年征战之后，旧友或已离散，年轻将士却仍想用一场大胜证明自己。山林里的火光让人想起赤壁，也提醒所有人，骄傲会带来代价。",dialog:[["赵云","胜负不是一时的疆土，活着回去的人才有机会重建。"],["诸葛亮","这一仗要记住所有曾经做过的选择。"],["刘备","山河尚在，人心未散，便还有明日。"]],battle:"夷陵最后一战",boss:"山道伏兵统领",choice:["救援被围友军，保全伙伴羁绊","击破敌军中军，赢得最后战功"],side:"旧营地的木牌",sideText:"木牌上刻着多年以前的名字，可能是你曾救助过的百姓。"},
{title:"西陵烽烟",era:"章武元年·春",region:"西陵",intro:"蜀道军报接连送到，山口守军误报敌情，导致粮队两次走错岔路。你奉命查明军报失真的原因，并在敌军合围前重新打通西陵古道。",dialog:[["诸葛亮","军报不是越多越好。真假混杂，反而会让前线失去判断。"],["赵云","我带轻骑沿旧驿道查探，若遇伏兵便以三声号角示警。"],["刘备","沿途村寨不可惊扰。军令若失了民心，就算打通道路也守不长久。"]],battle:"西陵夺道",boss:"山地伏军统领·邓贤",choice:["逐村查验军报，降低敌军伏击能力","夜间突进驿站，获得额外战利品"],side:"驿站的残卷",sideText:"驿卒藏起一份被烧掉一半的路线图，图上标出山洪季节才会露出的浅滩。"},
{title:"白帝孤城",era:"章武二年·秋",region:"白帝城",intro:"长江水位转低，白帝城外的船队无法按时靠岸。城中老弱需要药材，守军需要新弩，商旅则要求恢复渡口。你必须安排城内有限的工匠和民夫。",dialog:[["赵云","城墙可以暂时不修，但城门和渡口必须有人看守。"],["诸葛亮","让工匠各做其所长。若所有人都去修城，药材和粮食便没人运。"],["刘备","先把百姓安置好，再谈下一场战事。"]],battle:"白帝渡口",boss:"江岸悍将·周鲂",choice:["优先修复渡船，提升后续补给","加固城门，提升本场战斗防御"],side:"渡口的药船",sideText:"一艘药船被乱石卡住，船上有急需的药材，也有敌军伤兵。"},
{title:"南中山道",era:"建兴三年·夏",region:"南中",intro:"南中诸部并非铁板一块。有的部族只想保住田地，有的首领则借战乱扩张势力。你进入山地后发现，地图上标注的道路早已被藤蔓吞没。",dialog:[["诸葛亮","远征南中，攻心为上。山路和水源，比敌人的城寨更值得先控制。"],["马岱","我熟悉山地骑兵的行进方式，可以带队绕过主路。"],["刘备","不要把整片山林都当作敌境。愿意谈的人，给他们谈的机会。"]],battle:"南中山口",boss:"蛮军首领·木鹿部将",choice:["与部族首领会盟，减少后续敌意","夺取山口粮仓，获得更多物资"],side:"迷路的采药人",sideText:"采药人熟悉山中泉眼，但不愿为军队带路，除非先救出被困的同伴。"},
{title:"山河归心",era:"建兴六年·春",region:"祁山",intro:"多年征战之后，军府里保存着三十章军报、百姓请愿和将士家书。最后一封急报来自祁山：敌军正在集结，若此处失守，所有旧路都将被切断。你必须决定这支军队究竟为了什么而战。",dialog:[["诸葛亮","胜负之外，还有一件事值得留下：后人提起这段岁月时，能否记得我们曾尽力让百姓少受一点苦。"],["关羽","刀锋所向，不该只为一纸功名。"],["刘备","山河会改变，故人会远去，但人心所向，才是最后的归处。"]],battle:"祁山终局",boss:"魏军大都督·司马懿",choice:["守护百姓与盟友，走向仁义结局","集中兵力争夺山河，走向霸业结局"],side:"军府最后的家书",sideText:"一封未寄出的家书写着一名老兵的心愿：他只想在战后回到故乡，种一片田。"}

{name:"暴雨断桥",text:"暴雨冲毁山桥，商队与军队都被困在河岸。",a:"征集木料修桥（-80木，获得威望）",b:"绕行山路（-1日，避免损失）",doA:()=>{if(s.wood<80)return false;s.wood-=80;s.fame+=18;return true},doB:()=>{s.day++;s.food=Math.max(0,s.food-60);return true}},

{name:"流浪铁匠",text:"一名流浪铁匠带着旧图纸求见，希望用铁矿换一处工坊。",a:"资助工坊（-100铁，解锁锻造折扣）",b:"购买图纸（-100金，获得玉石）",doA:()=>{if(s.iron<100)return false;s.iron-=100;s.flags.forgeDiscount=true;s.fame+=8;return true},doB:()=>{if(s.gold<100)return false;s.gold-=100;s.jade+=8;return true}},
{name:"军中疫病",text:"营中出现高热病患，医官请求购置药材。",a:"紧急治病（-90金，伤兵恢复）",b:"隔离营区（损失少量士气）",doA:()=>{if(s.gold<90)return false;s.gold-=90;s.wounded=Math.max(0,s.wounded-30);return true},doB:()=>{s.morale=Math.max(20,s.morale-10);return true}},

{name:"村学先生",text:"村中先生愿意开设义学，教授识字、算学与简单军阵。",a:"捐助书籍（-60金，研究点+2）",b:"请先生入府（-20粮，军师羁绊）",doA:()=>{if(s.gold<60)return false;s.gold-=60;s.tech+=2;return true},doB:()=>{if(s.food<20)return false;s.food-=20;s.fame+=10;s.bond.liu=(s.bond.liu||0)+3;return true}},

{name:"马市奇遇",text:"西域商人带来一匹瘦弱却血统出众的战马。",a:"购买战马（-180金，获得坐骑）",b:"以粮易马（-250粮，获得坐骑）",doA:()=>{if(s.gold<180)return false;s.gold-=180;s.items.push(makeItem("马","mount",18));return true},doB:()=>{if(s.food<250)return false;s.food-=250;s.items.push(makeItem("马","mount",18));return true}},
{name:"旧友来访",text:"一位曾经受你救助的村民带来消息：附近山寨正在集结。",a:"资助村民（-40金，提前侦察）",b:"请他带路（开启额外遭遇）",doA:()=>{if(s.gold<40)return false;s.gold-=40;s.intel+=1;return true},doB:()=>{s.sideBonus=1;s.fame+=6;return true}},
{name:"军械失窃",text:"武库少了几箱箭矢，值守军士互相推诿。",a:"彻查军械（-30金，军纪提升）",b:"暂用木料补造（-80木，补充弓兵）",doA:()=>{if(s.gold<30)return false;s.gold-=30;s.morale+=5;return true},doB:()=>{if(s.wood<80)return false;s.wood-=80;s.army.arch+=25;return true}},
{name:"酒肆传闻",text:"说书人讲起一位隐居名将，酒客纷纷指向不同方向。",a:"打听消息（-40金，寻访点+1）",b:"请说书人入府（威望+8）",doA:()=>{if(s.gold<40)return false;s.gold-=40;s.recruitTokens++;return true},doB:()=>{s.fame+=8;return true}},
{name:"山洪冲垮栈道",text:"山洪冲垮栈道，辎重车队被迫停下。",a:"修复栈道（-100木，减少后续消耗）",b:"弃置部分辎重（-120粮，获得行军速度）",doA:()=>{if(s.wood<100)return false;s.wood-=100;s.flags.roadSafe=true;return true},doB:()=>{if(s.food<120)return false;s.food-=120;s.morale+=8;return true}},
{name:"敌将求见",text:"敌方一名低阶将领请求单独见你，称自己掌握主将的私账。",a:"接见并承诺赦免（情报+2）",b:"拒绝私会（威望+10）",doA:()=>{s.intel+=2;s.flags.pardon=true;return true},doB:()=>{s.fame+=10;return true}},
{name:"古墓石刻",text:"山路旁发现一处古墓石刻，随行军师认为其中可能藏有阵法图。",a:"安排考据（-40金，研究点+3）",b:"暂不打扰（获得玉石）",doA:()=>{if(s.gold<40)return false;s.gold-=40;s.tech+=3;return true},doB:()=>{s.jade+=4;return true}},

{name:"饥饿的战马",text:"马厩里几匹战马病弱，兽医说需要更好的草料。",a:"购买草料（-100粮，骑兵恢复）",b:"出售病马（+50金，骑兵减少）",doA:()=>{if(s.food<100)return false;s.food-=100;s.army.cav+=8;return true},doB:()=>{s.gold+=50;s.army.cav=Math.max(0,s.army.cav-10);return true}},

function makeItem(name,type,power){return {id:"it"+Math.random().toString(36).slice(2,9),name:name,type:type,power:power,quality:power>=35?"史诗":power>=20?"精良":"普通",desc:"战场与工坊所得的装备。",equippedBy:null}}
let s;try{s=JSON.parse(localStorage.getItem(KEY));if(!s||s.v!==4)throw 0}catch(e){try{let prev=JSON.parse(localStorage.getItem("hxsg_save_v3"));s=fresh();if(prev){s.gold=Math.max(300,prev.gold||800);s.food=Math.max(700,prev.food||1200);s.wood=prev.wood||500;s.iron=prev.iron||180;s.fame=prev.fame||0;s.day=prev.day||1;s.lv=prev.lv||1;s.story=Math.min(5,prev.story||0);if(Array.isArray(prev.heroes)&&prev.heroes.length){s.heroes=prev.heroes.map(x=>Object.assign(cloneHero(x.id)||{},x,{gear:x.gear||{weapon:null,armor:null,accessory:null}}));s.owned=s.heroes.map(x=>x.id);if(!s.heroes.some(x=>x.id==="guan")){s.heroes.push(cloneHero("guan"));s.owned.push("guan")}}if(Array.isArray(prev.items))s.items=prev.items.map(x=>Object.assign(makeItem(x.name,x.type,x.atk||10),x))}}catch(x){s=fresh()}}
let page="home",fight=null,toastTimer=null,storyContext=null;
const $=id=>document.getElementById(id);
function fmt(n){return Math.floor(n||0).toLocaleString("zh-CN")}
function topUI(){["gold","food","wood","iron","jade","fame"].forEach(k=>$(k).textContent=fmt(s[k]));let year=184+Math.floor((s.day-1)/90);let season=["春","夏","秋","冬"][Math.floor(((s.day-1)%90)/23)%4];$("date").textContent=year+"年·"+season;$("level").textContent="主公 Lv."+s.lv+" · "+s.exp+"经验"}
function save(){localStorage.setItem(KEY,JSON.stringify(s));topUI()}
function toast(t){let old=$("toast");if(old)old.remove();let n=document.createElement("div");n.id="toast";n.className="toast";n.setAttribute("role","status");n.setAttribute("aria-live","polite");n.textContent=t;document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2600)}
function log(t){s.logs.unshift("第"+s.day+"日："+t);s.logs=s.logs.slice(0,30)}
function go(p){page=p;render()}
function tile(icon,title,desc,fn,wide){return '<button class="tile '+(wide?'wide':'')+'" onclick="'+fn+'"><b>'+icon+'　'+title+'</b><small>'+desc+'</small></button>'}
function box(t,body){return '<section class="box"><h3>'+t+'</h3>'+body+'</section>'}
function render(){topUI();let heads={home:["新野 · 主城","城池 "+s.city+"级 · 第"+s.day+"日"],campaign:["山河志 · 主线","已完成 "+s.story+" / "+CHAPTERS.length+" 章"],heroes:["麾下 · 武将",""+s.heroes.length+" 位将领"],army:["军团 · 兵营","士气 "+s.morale+" · 伤兵 "+s.wounded],world:["天下 · 郡县","声望 "+s.fame+" · 侦察 "+s.intel],bag:["府库 · 行囊","装备、锻造与补给"]};$("heading").textContent=heads[page][0];$("hint").textContent=heads[page][1];document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===page));let html=page==="home"?homePage():page==="campaign"?campaignPage():page==="heroes"?heroesPage():page==="army"?armyPage():page==="world"?worldPage():bagPage();$("view").innerHTML=html;$("notice").textContent="本地自动存档 · "+(s.logs[0]||"山河待定")}
function homePage(){return '<div class="banner"><div class="eyebrow">荆州 · 新野县 · 军府</div><h3>山河未定，且看今朝</h3><p>城外田畴渐绿，远处烽烟未散。你既要经营一座能让百姓安居的城，也要带领将士走过三十段乱世风云。每一次选择都会留下记录，影响民心、盟友与后续事件。</p><span class="tag">主线 '+s.story+'/'+CHAPTERS.length+'</span><span class="tag">驻军 '+armyTotal()+'</span><span class="tag">将领 '+s.heroes.length+'</span><span class="tag">民望 '+s.fame+'</span></div><div class="grid">'+tile("📜","继续主线","章节剧情、分支选择、三波战斗与首领战","go('campaign')",true)+tile("🏗️","城池经营","建设农田、兵营、城墙、商铺、书院和工坊","buildings()")+tile("🛡️","军团整备","征兵、治疗伤兵、训练士气、调整战阵","go('army')")+tile("🍶","招贤馆","寻访新武将，培养羁绊与专属战技","tavern()")+tile("🎲","巡城奇遇","动态随机事件，会留下长期影响","randomEvent()")+tile("🧾","本章支线","探索人物故事，获得额外经验与稀有材料","sideQuest()")+tile("⚒️","铁匠工坊","锻造、强化、拆解装备与制作药剂","forge()")+tile("🧭","斥候出巡","侦察地形，寻找支线与隐藏遭遇","scout()")+tile("📯","政务休整","结束当日，结算生产、军粮与城防","nextDay()")+'</div>'+box("今日军务",'<div class="statsline"><span>粮草日产</span><b>'+s.build.farm*65+'</b></div><div class="statsline"><span>商铺税收</span><b>'+s.build.market*35+'</b></div><div class="statsline"><span>军队消耗</span><b>'+Math.ceil(armyTotal()*.08)+'</b></div><div class="progress"><i style="width:'+Math.min(100,s.morale)+'%"></i></div><div class="muted">军心 '+s.morale+'/100 · 低于30时战斗伤害与命中都会下降。</div><div class="btnrow"><button class="btn primary" onclick="nextDay()">结束当日</button><button class="btn" onclick="randomEvent()">处理城中事件</button></div>')+box("最近军报",s.logs.slice(0,5).map(x=>'<div class="muted">• '+x+'</div>').join(""))}
function armyTotal(){return s.army.inf+s.army.cav+s.army.arch}
function campaignPage(){return '<div class="banner"><h3>三十章山河史诗</h3><p>从涿郡护粮、黄巾烽火，到虎牢关、官渡、赤壁、汉中与荆州风云。每章包含剧情对话、至少一次分支决策、三段连续交锋、章节首领与专属支线。战败不会抹去剧情进度，但要承担伤兵和军粮损失。</p><span class="tag">主线目标约10小时以上</span><span class="tag">30章 · 多分支</span><span class="tag">90段战斗波次</span></div><div class="list">'+CHAPTERS.map((c,i)=>'<div class="rowcard"><div class="portrait">'+(i<s.story?'🏅':i===s.story?'📖':'🔒')+'</div><div class="info"><b>'+String(i+1).padStart(2,"0")+' · '+c.title+'　'+(i<s.story?'已完成':i===s.story?'当前章节':'未解锁')+'</b><small>'+c.era+' · '+c.region+'</small><small>'+c.intro.slice(0,52)+'…</small><small>章节首领：'+c.boss+' · 支线：'+c.side+'</small></div><button class="btn '+(i===s.story?'primary':'')+'" '+(i>s.story?'disabled':'')+' onclick="startChapter('+i+')">'+(i<s.story?'重温':'进入')+'</button></div>').join("")+'</div>'}
function heroesPage(){return '<div class="banner"><h3>名将录 · 养成与羁绊</h3><p>武将拥有基础属性、专属战技、技能等级、装备槽与羁绊。战斗中每名武将独立行动，技能消耗军令点；受伤会带来持续伤势，回城后可治疗。</p><span class="tag">上阵 '+s.formation.map(i=>s.heroes[i]?s.heroes[i].name:"空位").join(" / ")+'</span></div><div class="list">'+s.heroes.map((h,i)=>'<div class="rowcard"><div class="portrait">'+h.face+'</div><div class="info"><b>'+h.name+'　<span class="gold">'+("★".repeat(h.rarity))+'</span></b><small>'+h.title+' · '+h.role+' · '+h.troop+' · Lv.'+h.lv+' · 羁绊 '+(s.bond[h.id]||0)+'</small><small>攻 '+heroAtk(h)+' · 防 '+heroDef(h)+' · 生命 '+h.hpNow+'/'+heroMax(h)+'</small><div class="bar"><i style="width:'+Math.max(0,h.hpNow/heroMax(h)*100)+'%"></i></div></div><button class="btn" onclick="heroDetail('+i+')">详情</button></div>').join("")+'</div><div class="btnrow"><button class="btn primary" onclick="formation()">调整阵容</button><button class="btn" onclick="tavern()">寻访武将</button></div>'}
function heroMax(h){return h.hp+(h.lv-1)*32}
function heroAtk(h){let g=h.gear||{},w=s.items.find(x=>x.name===g.weapon);return h.atk+(h.lv-1)*4+(w?w.power:0)+(s.tech||0)}
function heroDef(h){let g=h.gear||{},a=s.items.find(x=>x.name===g.armor),v=s.items.find(x=>x.name===g.accessory);return h.def+(h.lv-1)*3+(a?a.power:0)+(v?Math.floor(v.power/2):0)}
function armyPage(){return '<div class="banner"><h3>军团编制 · 兵种协同</h3><p>步兵负责承伤，骑兵高速突击，弓兵远程压制。兵种相克会影响伤害，军队规模影响战场支援次数。伤兵需要医治，士气影响全军发挥。</p><span class="tag">总兵力 '+armyTotal()+'</span><span class="tag">伤兵 '+s.wounded+'</span><span class="tag">军心 '+s.morale+'</span></div>'+box("兵种编制",'<div class="statsline"><span>步兵 · 守阵</span><b>'+s.army.inf+' 人</b></div><div class="statsline"><span>骑兵 · 突击</span><b>'+s.army.cav+' 人</b></div><div class="statsline"><span>弓兵 · 远射</span><b>'+s.army.arch+' 人</b></div><div class="btnrow"><button class="btn" onclick="recruitTroops(\'inf\')">募步兵 60</button><button class="btn" onclick="recruitTroops(\'cav\')">募骑兵 25</button><button class="btn" onclick="recruitTroops(\'arch\')">募弓兵 40</button></div>')+box("军令与整备",'<div class="btnrow"><button class="btn primary" onclick="trainArmy()">全军操练</button><button class="btn" onclick="healArmy()">救治伤兵</button></div><div class="btnrow"><button class="btn" onclick="formation()">武将布阵</button><button class="btn" onclick="rations()">调整军粮</button></div>')+box("科技与战术",'<div class="statsline"><span>军学等级</span><b>'+s.tech+'</b></div><div class="statsline"><span>城防等级</span><b>'+s.wall+'</b></div><button class="btn primary" onclick="research()">研究兵法（120金、35铁）</button>')}
function worldPage(){let provinces=["涿郡","颍川","广宗","洛阳","虎牢关","长安","徐州","小沛","下邳","延津","乌巢","官渡","襄阳","新野","博望","长坂","夏口","赤壁","南郡","葭萌","雒城","定军山","汉水","荆州","夷陵"];return '<div class="banner"><h3>天下舆图 · 郡县局势</h3><p>每完成一章，会改变相邻区域势力态势。斥候可探索已开放区域，发现支线、资源点与隐藏事件。未解锁地点不会提前开放。</p></div><div class="map-grid">'+provinces.map((x,i)=>'<button class="map-node" '+(i>Math.min(provinces.length-1,s.story+2)?'disabled':'')+' onclick="inspectRegion('+i+')"><b>'+x+'</b><small>'+(i<s.story?'已控制':i===s.story?'战事正酣':i<=s.story+2?'可侦察':'未开放')+'</small></button>').join("")+'</div>'+box("势力声望",'<div class="statsline"><span>百姓民望</span><b>'+s.fame+'</b></div><div class="statsline"><span>盟友情谊</span><b>'+Object.values(s.bond).reduce((a,b)=>a+b,0)+'</b></div><div class="statsline"><span>敌军情报</span><b>'+s.intel+'</b></div><button class="btn" onclick="scout()">派遣斥候探索</button>')}
function bagPage(){return '<div class="banner"><h3>军府库藏 · 装备与消耗品</h3><p>装备分为武器、防具、饰品和坐骑。装备可以换给不同武将；锻造需要矿石、木材与玉石。不要把唯一的强力装备重复装备给多人。</p></div>'+box("物资储备",["gold","food","wood","iron","jade"].map(k=>'<div class="statsline"><span>'+({gold:"黄金",food:"粮草",wood:"木材",iron:"铁矿",jade:"玉石"}[k])+'</span><b>'+fmt(s[k])+'</b></div>').join(""))+box("装备清单",s.items.length?s.items.map((x,i)=>'<div class="rowcard"><div class="portrait">'+({weapon:"⚔️",armor:"🛡️",accessory:"💍",mount:"🐎"}[x.type]||"🎒")+'</div><div class="info"><b>'+x.name+'　<span class="gold">'+x.quality+'</span></b><small>'+x.type+' · 强度 '+x.power+' · '+(x.equippedBy?"已装备："+x.equippedBy:"未装备")+'</small></div><button class="btn" onclick="itemDetail('+i+')">管理</button></div>').join(""):'暂无装备')+box("消耗物资",'<div class="statsline"><span>药剂</span><b>'+s.potions+' 瓶</b></div><button class="btn" onclick="craftPotion()">制作药剂（40金、20药材）</button>')}
function modal(title,body){$("modal").innerHTML='<div class="modalhead"><h3>'+title+'</h3><button class="btn ghost" onclick="closeModal()">关闭</button></div>'+body;$("backdrop").style.display="flex"}
function closeModal(){$("backdrop").style.display="none"}
function costOK(c){return Object.keys(c).every(k=>s[k]>=c[k])}
function spend(c){Object.keys(c).forEach(k=>s[k]-=c[k])}
function buildings(){let defs={farm:["农田","提升粮草日产",{wood:100,gold:70}],barracks:["兵营","提升兵力训练上限",{wood:130,gold:100}],wall:["城墙","提升城防与战斗减伤",{wood:150,iron:45}],market:["商铺","提升每日税收",{wood:110,gold:90}],academy:["书院","提升研究速度",{wood:100,gold:130}],forge:["工坊","降低锻造成本",{wood:90,iron:50}]};modal("新野建设 · 城政六务",'<p>每提升一级城池建筑都会提高其专项效果。升级会消耗库存，不会凭空生成资源。</p><div class="list">'+Object.keys(defs).map(k=>'<div class="rowcard"><div class="portrait">🏗️</div><div class="info"><b>'+defs[k][0]+' · Lv.'+s.build[k]+'</b><small>'+defs[k][1]+' · '+costText(defs[k][2])+'</small></div><button class="btn" onclick="upgradeBuilding(\''+k+'\')">升级</button></div>').join("")+'</div>')}
function costText(c){return Object.entries(c).map(([k,v])=>({gold:"金",food:"粮",wood:"木",iron:"铁",jade:"玉"}[k]+v)).join(" / ")}
function upgradeBuilding(k){let c={farm:{wood:100,gold:70},barracks:{wood:130,gold:100},wall:{wood:150,iron:45},market:{wood:110,gold:90},academy:{wood:100,gold:130},forge:{wood:90,iron:50}}[k];if(!costOK(c))return toast("库存不足，缺少升级所需资源");spend(c);s.build[k]++;if(k==="wall")s.wall++;s.city++;log(({farm:"扩建农田",barracks:"扩建兵营",wall:"加固城墙",market:"扩建商铺",academy:"扩建书院",forge:"扩建工坊"})[k]);save();buildings();render()}
function tavern(){let pool=HEROES.filter(h=>!s.owned.includes(h.id));modal("招贤馆 · 四方访士",'<div class="banner"><h3>良将择主，名士归心</h3><p>花费260黄金寻访一名新将。部分武将需要主线进度或声望达到条件；每位将领有自己的传记、羁绊和专属战技。</p><span class="tag">尚未招募 '+pool.length+' 位</span><span class="tag">寻访令 '+s.recruitTokens+'</span></div><div class="list">'+pool.map(h=>'<div class="rowcard"><div class="portrait">'+h.face+'</div><div class="info"><b>'+h.name+' · '+h.title+'</b><small>'+h.role+' · '+h.troop+' · '+("★".repeat(h.rarity))+'</small><small>'+h.bio+'</small></div></div>').join("")+'</div><button class="btn primary" style="width:100%;margin-top:10px" '+(!pool.length?'disabled':'')+' onclick="recruitHero()">寻访一名武将 · 260金 / 1令</button>')}
function recruitHero(){let pool=HEROES.filter(h=>!s.owned.includes(h.id));if(!pool.length)return toast("已招募当前所有可寻访武将");let h=pool[Math.floor(Math.random()*pool.length)];if(s.recruitTokens>0)s.recruitTokens--;else if(s.gold>=260)s.gold-=260;else return toast("黄金不足，寻访需要260黄金");s.heroes.push(cloneHero(h.id));s.owned.push(h.id);s.bond[h.id]=3;log(h.name+"应召加入麾下");save();closeModal();go("heroes");toast(h.name+"加入了你的队伍！")}
function heroDetail(i){let h=s.heroes[i];let equips=["weapon","armor","accessory"].map(type=>{let item=h.gear&&h.gear[type];return '<div class="statsline"><span>'+({weapon:"武器",armor:"防具",accessory:"饰品"}[type])+'</span><b>'+(item?item:"空")+'</b></div>'}).join("");modal(h.name+" · "+h.title,'<div class="rowcard"><div class="portrait">'+h.face+'</div><div class="info"><b>'+("★".repeat(h.rarity))+' · '+h.role+'</b><small>'+h.bio+'</small><small>等级 '+h.lv+' · 经验 '+h.xp+' · 技能等级 '+h.skillLv+'</small></div></div><div class="box"><h3>属性</h3><div class="statsline"><span>攻击</span><b>'+heroAtk(h)+'</b></div><div class="statsline"><span>防御</span><b>'+heroDef(h)+'</b></div><div class="statsline"><span>生命</span><b>'+h.hpNow+'/'+heroMax(h)+'</b></div><div class="statsline"><span>伤势</span><b>'+h.wounds+'</b></div></div><div class="box"><h3>专属战技：'+h.skill+'</h3><p>'+h.desc+'</p><div class="statsline"><span>技能等级</span><b>Lv.'+h.skillLv+'</b></div><button class="btn" onclick="upgradeSkill('+i+')">研习战技（2研究点）</button></div><div class="box"><h3>装备栏</h3>'+equips+'<button class="btn" onclick="equipHero('+i+')">更换装备</button></div><div class="btnrow"><button class="btn primary" onclick="levelHero('+i+')">培养升级 · 140金</button><button class="btn" onclick="bondHero('+i+')">宴饮增进羁绊 · 30金</button></div>')}
function levelHero(i){let h=s.heroes[i];if(h.lv>=60)return toast("当前等级已达上限");if(s.gold<140)return toast("黄金不足");s.gold-=140;h.lv++;h.xp=0;h.hpNow=Math.min(heroMax(h),h.hpNow+35);log(h.name+"提升至"+h.lv+"级");save();heroDetail(i);render()}
function upgradeSkill(i){let h=s.heroes[i];if(s.tech<2)return toast("研究点不足，完成支线或研究兵法获得");s.tech-=2;h.skillLv++;log(h.name+"的专属战技提升至Lv."+h.skillLv);save();heroDetail(i)}
function bondHero(i){let h=s.heroes[i];if(s.gold<30)return toast("黄金不足");s.gold-=30;s.bond[h.id]=(s.bond[h.id]||0)+5;log("与"+h.name+"宴饮，羁绊提升");save();heroDetail(i)}

function nextDay(){let grain=s.build.farm*65,coin=s.build.market*35,up=Math.ceil(armyTotal()*.08);s.day++;s.food+=grain;s.gold+=coin;s.food-=up;if(s.food<0){s.food=0;s.morale=Math.max(10,s.morale-12);log("军粮不足，士气下降，出现逃兵")}else s.morale=Math.min(100,s.morale+2);if(s.day%3===0){let h=s.heroes[Math.floor(Math.random()*s.heroes.length)];if(h&&h.hpNow<heroMax(h))h.hpNow=Math.min(heroMax(h),h.hpNow+30)}log("政务结算：粮草+"+grain+"，税收+"+coin+"，军粮-"+up);save();render();toast("新的一天开始，城池产出已结算");if(Math.random()<.32)setTimeout(()=>randomEvent(),350)}

function startBattle(i){if(armyTotal()<35)return toast("兵力不足，至少需要35名士兵");if(s.food<80)return toast("粮草不足，至少准备80粮草");s.food-=80;let f=(s.formation||[0,1,2]).map(x=>s.heroes[x]).filter(Boolean);if(f.length<3)return toast("出战需要三名武将，请先招募和布阵");let c=CHAPTERS[i];let difficulty=1+i*.085+Math.floor(i/5)*.12;fight={chapter:i,choice:s.choices&&typeof s.choices[i]!=="undefined"?s.choices[i]:0,round:1,wave:1,waves:3,phase:"player",actor:0,acted:[],morale:s.morale,enemyMorale:75,logs:["战鼓擂响！"+c.region+"战场，两军列阵。"],itemsUsed:0,allies:f.map(h=>({id:h.id,name:h.name,face:h.face,troop:h.troop,role:h.role,skill:h.skill,desc:h.desc,skillLv:h.skillLv,hp:Math.max(1,h.hpNow-h.wounds*12),max:heroMax(h),atk:heroAtk(h),def:heroDef(h),energy:3,shield:0,burn:0,alive:true,sourceIndex:s.heroes.indexOf(h)})),enemies:[],result:""};makeWave();page="battle";drawBattle()}
function makeWave(){let i=fight.chapter,w=fight.wave,c=CHAPTERS[i],base=1+i*.085+Math.floor(i/5)*.12+(w-1)*.22+(fight.choice===1?.10:-.04);let count=w===3?4:3+(i%3===0?1:0);fight.enemies=[];for(let n=0;n<count;n++){let proto=ENEMIES[(i*2+w*3+n)%ENEMIES.length],boss=w===3&&n===count-1;fight.enemies.push({name:boss?c.boss:proto.name,troop:proto.troop,face:boss?"👹":proto.face,hp:Math.round(proto.hp*base*(boss?2.2:1)),max:Math.round(proto.hp*base*(boss?2.2:1)),atk:Math.round(proto.atk*base*(boss?1.25:1)),def:Math.round(proto.def*base*(boss?1.3:1)),xp:proto.xp,boss:boss,alive:true,shield:0,burn:0,stun:0})}fight.acted=[];fight.phase="player";fight.round=1;fight.enemyMorale=fight.choice===0?64:78;fight.logs.push("第"+w+"阵："+(w===1?"前锋遭遇战":w===2?"中军鏖战":"章节首领现身")+"。敌方"+count+"支部队进入战场。")}
function living(a){return a.filter(x=>x.alive&&x.hp>0)}
function typeMultiplier(a,d){if((a==="骑兵"&&d==="弓兵")||(a==="弓兵"&&d==="枪兵")||(a==="枪兵"&&d==="骑兵"))return 1.32;if((a==="弓兵"&&d==="骑兵")||(a==="枪兵"&&d==="弓兵")||(a==="骑兵"&&d==="枪兵"))return .82;return 1}
function damage(att,def,scale){let n=Math.max(6,Math.round((att.atk+Math.random()*att.atk*.18-def.def*.42)*(scale||1)*typeMultiplier(att.troop,def.troop)));if(fight.morale<30)n=Math.round(n*.82);if(att.burn>0)n=Math.round(n*.9);if(def.shield>0){let absorbed=Math.min(def.shield,n);def.shield-=absorbed;n-=absorbed}def.hp=Math.max(0,def.hp-n);if(def.hp===0){def.alive=false;fight.logs.push(def.name+"被击溃！")}return n}
function showDamage(target,n,critical){let el=document.querySelector('.warrior[data-side="'+target.side+'"][data-index="'+target.index+'"]');if(!el)return;let d=document.createElement("span");d.className="damage"+(critical?" critical":"");d.textContent=(critical?"暴击 -":"-")+n;el.appendChild(d);setTimeout(()=>d.remove(),1000)}
function animateHit(ai,di,n,critical,cast){return new Promise(resolve=>{let a=document.querySelector('.warrior[data-side="ally"][data-index="'+ai+'"]'),d=document.querySelector('.warrior[data-side="enemy"][data-index="'+di+'"]');if(cast&&a)a.classList.add("cast");else if(a)a.classList.add("attack-right");setTimeout(()=>{if(d){d.classList.add("hurt");showDamage({side:"enemy",index:di},n,critical);let slash=document.createElement("i");slash.className="slash-fx";$("battleScene").appendChild(slash);setTimeout(()=>slash.remove(),480);let fl=document.createElement("i");fl.className="fx-flash";$("battleScene").appendChild(fl);setTimeout(()=>fl.remove(),380)}},190);setTimeout(()=>{if(a)a.classList.remove("cast","attack-right");if(d)d.classList.remove("hurt");resolve()},590)})}
function animateEnemyHit(ei,ai,n){return new Promise(resolve=>{let a=document.querySelector('.warrior[data-side="enemy"][data-index="'+ei+'"]'),d=document.querySelector('.warrior[data-side="ally"][data-index="'+ai+'"]');if(a)a.classList.add("attack-left");setTimeout(()=>{if(d){d.classList.add("hurt");showDamage({side:"ally",index:ai},n,false);let slash=document.createElement("i");slash.className="slash-fx";$("battleScene").appendChild(slash);setTimeout(()=>slash.remove(),480)}},190);setTimeout(()=>{if(a)a.classList.remove("attack-left");if(d)d.classList.remove("hurt");resolve()},590)})}
function renderWarrior(u,i,side){let hp=Math.max(0,u.hp/u.max*100);return '<div data-side="'+side+'" data-index="'+i+'" class="warrior '+(side==="enemy"?"enemy ":"")+(!u.alive?"dead":"")+'"><svg class="body-art" viewBox="0 0 90 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="45" cy="104" rx="23" ry="4" fill="#10140f" opacity=".55"/><path d="M30 51 L21 85 L34 88 L44 68 L55 88 L68 85 L58 50Z" fill="'+(side==="enemy"?"#733f39":"#3f6144")+'" stroke="#d0b47b" stroke-width="1.4"/><path d="M28 53 L45 38 L62 53 L58 72 L32 72Z" fill="'+(side==="enemy"?"#a65d4f":"#6c8d60")+'" stroke="#e0c78f" stroke-width="1.5"/><path d="M32 43 Q45 23 58 43 L61 51 L29 51Z" fill="'+(side==="enemy"?"#56312e":"#344d39")+'" stroke="#e5cb91" stroke-width="2"/><circle cx="45" cy="28" r="13" fill="#d6a77f" stroke="#513a2d" stroke-width="1.4"/><path d="M32 27 Q34 9 48 13 Q59 12 59 30 L54 22 L36 22Z" fill="'+(side==="enemy"?"#5b3431":"#344939")+'"/><path d="M39 30 L43 31 M49 31 L52 30" stroke="#30231e" stroke-width="2" stroke-linecap="round"/><path d="M22 54 L9 80 M67 54 L79 80" stroke="#d4b980" stroke-width="5" stroke-linecap="round"/><path d="M9 79 L4 94 M79 79 L85 94" stroke="#4c3429" stroke-width="5" stroke-linecap="round"/><path d="M44 70 L39 99 M52 70 L56 99" stroke="#4b3529" stroke-width="6" stroke-linecap="round"/><path d="M75 18 L82 98" stroke="#d8c28d" stroke-width="3"/><path d="M70 18 L80 2 L88 18Z" fill="'+(side==="enemy"?"#b95749":"#e2c27e")+'"/></svg><div class="label">'+u.name+'</div><div class="unit-hp"><i style="width:'+hp+'%"></i></div></div>'}
function drawBattle(){if(!fight)return;topUI();$("heading").textContent="战场 · "+CHAPTERS[fight.chapter].region;$("hint").textContent="第"+fight.wave+"/"+fight.waves+"阵 · 第"+fight.round+"回合";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));let allies=fight.allies,enemies=fight.enemies,ended=fight.phase==="end";$("view").innerHTML='<div class="battle-shell"><div class="battle-top"><span>🟢 '+CHAPTERS[fight.chapter].battle+' · '+(fight.wave===3?"首领战":"遭遇战")+'</span><span>⚔ 第'+fight.round+'回合</span></div><div id="battleScene" class="battle-scene"><div class="horizon"></div><div class="flag" style="left:22px"></div><div class="flag right"></div><div class="formation-row hostile">'+enemies.map((u,i)=>renderWarrior(u,i,"enemy")).join("")+'</div><div class="battle-vs">⚔　两军交锋　⚔</div><div class="formation-row friendly">'+allies.map((u,i)=>renderWarrior(u,i,"ally")).join("")+'</div></div><div class="battle-status"><span>我军士气 '+fight.morale+' · 敌军士气 '+fight.enemyMorale+'</span><span>我军 '+living(allies).length+'/'+allies.length+' · 敌军 '+living(enemies).length+'/'+enemies.length+'</span></div><div class="combat-log">'+fight.logs.slice(-5).map(x=>'<div>· '+x+'</div>').join("")+'</div></div>'+(ended?'<div class="box"><h3>'+(fight.win?"🏆 本阵告捷":"⚑ 暂时撤退")+'</h3><p>'+fight.result+'</p><button class="btn primary" style="width:100%" onclick="finishBattle()">继续</button></div>':'<div class="battle-controls"><div class="statsline"><b>选择行动武将</b><span>行动点 '+(living(allies).filter((u,i)=>!fight.acted.includes(i)).length)+'</span></div><div class="actor-select">'+allies.map((u,i)=>'<button class="actor-pick '+(fight.actor===i?'active':'')+'" '+(!u.alive||fight.acted.includes(i)?'disabled':'')+' onclick="selectActor('+i+')">'+u.face+' '+u.name+'<br>HP '+Math.max(0,u.hp)+' · 能量 '+u.energy+'</button>').join("")+'</div><div class="action-grid"><button class="btn primary" onclick="basicAttack()">⚔ 普通攻击</button><button class="btn" onclick="useHeroSkill()">✨ 专属战技</button function selectActor(i){if(!fight||fight.phase!=="player")return;if(fight.acted.includes(i)||!fight.allies[i].alive)return toast("该武将本回合已行动或无法行动");fight.actor=i;drawBattle()}
function currentHero(){return fight&&fight.allies[fight.actor]}
function chooseTarget(){let a=living(fight.enemies);if(!a.length)return -1;return fight.enemies.indexOf(a[0])}
async function basicAttack(){if(!fight||fight.phase!=="player")return;let i=fight.actor,a=currentHero(),j=chooseTarget();if(!a||!a.alive||fight.acted.includes(i))return toast("请选择一名可行动武将");if(j<0)return;let e=fight.enemies[j],critical=Math.random()<.12+(s.bond[a.id]||0)*.002,d=damage(a,e,critical?1.7:1);if(critical)fight.logs.push("会心一击！");fight.logs.push(a.name+"挥击"+e.name+"，造成"+d+"点伤害。");fight.acted.push(i);drawBattle();await animateHit(i,j,d,critical,false);if(checkBattleEnd())return;continueTurn()}
async function useHeroSkill(){if(!fight||fight.phase!=="player")return;let i=fight.actor,a=currentHero();if(!a||!a.alive||fight.acted.includes(i))return toast("请选择一名可行动武将");if(a.energy<3)return toast("能量不足：技能需要3点");a.energy-=3;fight.acted.push(i);let targets=living(fight.enemies),name=a.skill,logs=[];if(name==="仁德济世"){fight.allies.forEach(x=>{if(x.alive)x.hp=Math.min(x.max,x.hp+120*a.skillLv)});fight.morale=Math.min(100,fight.morale+16);logs.push(a.name+"施展仁德济世，全队恢复生命并鼓舞士气。");drawBattle();await wait(650)}else if(name==="八阵图"||name==="赤壁烈焰"){let total=0;for(let j=0;j<fight.enemies.length;j++){let e=fight.enemies[j];if(e.alive){let d=damage(a,e,1.12*a.skillLv);total+=d;if(name==="赤壁烈焰")e.burn=2}}logs.push(a.name+"发动"+name+"，敌军全体受到"+total+"点伤害。");drawBattle();await wait(700)}else if(name==="魏武雄略"){fight.allies.forEach(x=>{x.shield+=95*a.skillLv;x.atk+=8});fight.morale=Math.min(100,fight.morale+12);logs.push(a.name+"号令全军，获得护盾与攻击强化。");drawBattle();await wait(650)}else if(name==="闭月迷魂"){let e=targets[0];if(e){e.stun=1;logs.push(a.name+"迷惑"+e.name+"，令其错失下一次行动。")}drawBattle();await wait(600)}else if(name==="燕人咆哮"){let total=0;targets.forEach(e=>total+=damage(a,e,1.05*a.skillLv));fight.enemyMorale=Math.max(0,fight.enemyMorale-20);logs.push(a.name+"震慑敌阵，造成"+total+"点群体伤害，敌军士气大跌。");drawBattle();await wait(650)}else if(name==="七进七出"||name==="方天乱舞"){let hits=0;for(let n=0;n<3;n++){let e=living(fight.enemies)[n%Math.max(1,living(fight.enemies).length)];if(!e)break;let j=fight.enemies.indexOf(e),d=damage(a,e,1.05*a.skillLv);hits+=d;await animateHit(i,j,d,false,true)}logs.push(a.name+"施展"+name+"，连击造成"+hits+"点总伤害。")}else if(name==="百步穿杨"){let e=targets.sort((x,y)=>x.hp-y.hp)[0];if(e){let j=fight.enemies.indexOf(e),d=damage(a,e,2*a.skillLv);logs.push(a.name+"百步穿杨，精准命中"+e.name+"，造成"+d+"点伤害。");drawBattle();await animateHit(i,j,d,true,true)}}else if(name==="恶来护主"){fight.allies.forEach(x=>x.shield+=125*a.skillLv);let e=targets[0];if(e){let j=fight.enemies.indexOf(e),d=damage(a,e,1.25*a.sk function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function checkBattleEnd(){if(!fight)return true;if(!living(fight.enemies).length){if(fight.wave<fight.waves){fight.wave++;makeWave();drawBattle();return true}fight.phase="end";fight.win=true;fight.result="敌军主将败退，战场已由我军控制。将士正在清点战利品。";drawBattle();return true}if(!living(fight.allies).length||fight.round>18){fight.phase="end";fight.win=false;fight.result="军势不继，只能鸣金收兵。伤兵与军粮损失已经记录。";drawBattle();return true}return false}
function continueTurn(){if(living(fight.allies).every((u,i)=>fight.acted.includes(i))){enemyPhase()}else{let next=living(fight.allies).findIndex((u,i)=>!fight.acted.includes(i));if(next>=0)fight.actor=next;drawBattle()}}
async function enemyPhase(){if(!fight||fight.phase==="end")return;fight.phase="enemy";$("hint").textContent="敌军行动中";drawBattle();await wait(300);for(let ei=0;ei<fight.enemies.length;ei++){let e=fight.enemies[ei];if(!e.alive)continue;if(e.stun>0){e.stun--;fight.logs.push(e.name+"陷入混乱，错失行动。");continue}let allies=living(fight.allies);if(!allies.length)break;let target=allies[Math.random()<.62?0:Math.floor(Math.random()*allies.length)],ai=fight.allies.indexOf(target),n=damage(e,target,(fight.morale<30?1.15:1)*(fight.enemyMorale<30?.86:1));fight.logs.push(e.name+"攻击"+target.name+"，造成"+n+"点伤害。");drawBattle();await animateEnemyHit(ei,ai,n);if(checkBattleEnd())return;await wait(120)}fight.allies.forEach(h=>{if(h.burn>0){let d=Math.min(h.hp,25);h.hp-=d;h.burn--;fight.logs.push(h.name+"受到灼烧伤害"+d);if(h.hp<=0)h.alive=false}if(h.energy<5)h.energy++});fight.enemies.forEach(e=>{if(e.burn>0){e.hp=Math.max(0,e.hp-35);e.burn--;if(!e.hp)e.alive=false}});fight.round++;fight.acted=[];fight.phase="player";fight.morale=Math.max(0,fight.morale-1);fight.actor=living(fight.allies).length?fight.allies.indexOf(living(fight.allies)[0]):0;if(checkBattleEnd())return;drawBattle()}
function defendAction(){let a=currentHero();if(!fight||!a||fight.acted.includes(fight.actor))return toast("请选择可行动武将");a.shield+=Math.round(a.def*2.1);a.energy=Math.min(5,a.energy+1);fight.acted.push(fight.actor);fight.logs.push(a.name+"稳住阵脚，获得护盾并回复能量。");continueTurn()}
function usePotion(){let a=currentHero();if(!fight||!a||fight.acted.includes(fight.actor))return toast("请选择可行动武将");if(s.potions<=0)return toast("没有药剂了");if(a.hp>=a.max)return toast("该武将生命值已满");s.potions--;let healed=Math.min(220,a.max-a.hp);a.hp+=healed;fight.acted.push(fight.actor);fight.logs.push(a.name+"使用军中药剂，恢复"+healed+"点生命。");save();continueTurn()}
function tacticAction(){if(!fight||fight.phase!=="player")return;modal("战场军令",'<p>军令点代表统帅对战局的即时调度。每场战斗可使用一次全军号令。</p><div class="list"><button class="choice" onclick="useTactic(0)">擂鼓助阵：全军攻击提升，本回合士气+15</button><button class="choice" onclick="useTactic(1)">坚壁列阵：全军获得护盾并降低敌方伤害</button><button class="choice" onclick="useTactic(2)">弓弩齐射：全体敌人受到额外伤害</button></div>')}
function useTactic(n){if(fight.tacticUsed)return toast("本场战斗已经下达过一次全军军令");fight.tacticUsed=true;if(n===0){fight.morale=Math.min(100,fight.morale+15);fight.allies.forEach(x=>x.atk+=12);fight.logs.push("擂鼓助阵！全军攻击提升。")}if(n===1){fight.allies.forEach(x=>x.shield+=100);fight.logs.push("坚壁列阵！所有武将获得护盾。")}if(n===2){let total=0;fight.enemies.forEach(e=>{if(e.alive)total+=damage({atk:65,def:30,troop:"弓兵"},e,1)});fight.logs.push("弓弩齐射，敌军受到"+total+"点伤害。")}closeModal();drawBattle();if(checkBattleEnd())return}
function retreatBattle(){if(!fight)return;fight.phase="end";fight.win=false;fight.result="你下令撤退，保存了剩余兵力。";drawBattle()}
function finishBattle(){let f=fight,c=CHAPTERS[f.chapter];let loss=Math.max(8,Math.ceil(armyTotal()*(f.win?.035:.09)));s.wounded+=loss;s.army.inf=Math.max(0,s.army.inf-Math.ceil(loss*.5));s.army.cav=Math.max(0,s.army.cav-Math.ceil(loss*.25));s.army.arch=Math.max(0,s.army.arch-Math.floor(loss*.25));f.allies.forEach(a=>{let h=s.heroes[a.sourceIndex];if(h){h.hpNow=Math.max(1,Math.min(heroMax(h),a.hp));if(a.hp<a.max*.35)h.wounds=Math.min(5,h.wounds+1);h.xp=(h.xp||0)+(f.win?80:25);if(h.xp>=h.lv*100){h.xp-=h.lv*100;h.lv++;h.hpNow=heroMax(h)}s.bond[h.id]=(s.bond[h.id]||0)+(f.win?2:0)}});if(f.win){s.story=Math.max(s.story,f.chapter+1);let reward=Math.round((220+f.chapter*42)*(f.choice===1?1.2:1));s.gold+=reward;s.food+=180+f.chapter*12;s.iron+=22+f.chapter*2;s.jade+=f.chapter%4===3?3:0;s.fame+=25+f.chapter*4;s.exp+=100+f.chapter*14;while(s.exp>=s.lv*120){s.exp-=s.lv*120;s.lv++;s.fame+=15}let drop=makeItem(["黄巾环刀","精钢长枪","玄铁战甲","青铜护心镜","乌骓马鞍"][f.chapter%5],["weapon","weapon","armor","accessory","mount"][f.chapter%5],12+f.chapter*2);s.items.push(drop);s.morale=Math.min(100,s.morale+8);log("平定「"+c.title+"」，获得"+reward+"金、装备「"+drop.name+"」，伤兵"+loss+"人");if(f.chapter%3===2){s.recruitTokens++;log("声名远播，获得一枚寻访令")}}else{s.food=Math.max(0,s.food-100);s.morale=Math.max(15,s.morale-12);log("「"+c.title+"」暂时失利，伤兵"+loss+"人，仍可整备后再次挑战")}fight=null;page="campaign";render();if(storyContext){let c2=CHAPTERS[storyContext.chapter];modal("战后余波 · "+c2.title,'<div class="banner"><h3>'+(s.story>storyContext.chapter?"本章战事告捷":"暂时撤退")+'</h3><p>'+c2.intro+'</p></div><p>城中百姓、盟友和部队都在等待你的下一步行动。你可以先回城整备，也可以继续推进剧情。</p><div class="btnrow"><button class="btn primary" onclick="closeModal();go(\'home\')">返回主城</button><button class="btn" onclick="closeModal();go(\'campaign\')">查看章节</button></div>');storyContext=null}}
function retreat(){retreatBattle()}
function itemDetail(i){let x=s.items[i];let options=s.heroes.map((h,j)=>'<option value="'+j+'">'+h.name+'</option>').join("");modal(x.name,'<div class="statsline"><span>品质</span><b>'+x.quality+'</b></div><div class="statsline"><span>类别</span><b>'+x.type+'</b></div><div class="statsline"><span>强度</span><b>'+x.power+'</b></div><p>'+x.desc+'</p><label class="muted">分配给武将<select id="equipTo" style="width:100%;padding:9px;background:#111914;color:#fff;margin-top:5px">'+options+'</select></label><div class="btnrow"><button class="btn primary" onclick="equipItem('+i+')">装备</button><button class="btn" onclick="salvageItem('+i+')">拆解材料</button></div>')}
function equipItem(i){let item=s.items[i],j=+$("equipTo").value,h=s.heroes[j];if(!h.gear)h.gear={};let slot=item.type;if(!["weapon","armor","accessory","mount"].includes(slot))return toast("该物品不能直接装备");if(slot==="mount")slot="accessory";if(item.equippedBy&&item.equippedBy!==h.id){let priorHero=s.heroes.find(x=>x.id===item.equippedBy);if(priorHero&&priorHero.gear&&priorHero.gear[slot]===item.name)priorHero.gear[slot]=null}let old=h.gear[slot];if(old){let prior=s.items.find(x=>x.name===old&&x.equippedBy===h.id);if(prior)prior.equippedBy=null}h.gear[slot]=item.name;item.equippedBy=h.id;item.type==="weapon"?h.atk+=0:null;log(h.name+"装备"+item.name);save();closeModal();go("heroes")}
function salvageItem(i){let x=s.items[i];if(x.equippedBy)return toast("请先卸下装备");s.iron+=Math.max(5,Math.ceil(x.power*.8));s.items.splice(i,1);log("拆解装备，获得铁矿");save();closeModal();render()}
function equipHero(i){let h=s.heroes[i],opts=s.items.map((x,j)=>'<option value="'+j+'">'+x.name+' · '+x.type+' · '+x.power+'</option>').join("");modal(h.name+" · 选择装备",'<p>选中一件未装备物品后即可穿戴。</p><select id="itemChoice" style="width:100%;padding:10px;background:#111914;color:#fff">'+opts+'</select><button class="btn primary" style="width:100%;margin-top:10px" onclick="equipItem(+$('+"'itemChoice'"+').value)">确认装备</button>')}
function forge(){modal("百炼工坊 · 锻造",'<div class="banner"><h3>火候、材料与匠心</h3><p>工坊可以打造不同部位装备。高级装备需要玉石与更多铁矿；城池工坊等级可降低成本。</p></div><div class="list"><button class="choice" onclick="craftItem(\'weapon\')">打造武器：攻击+25（120铁、80木、80金）</button><button class="choice" onclick="craftItem(\'armor\')">打造护甲：防御+22（100铁、100木、70金）</button><button class="choice" onclick="craftItem(\'accessory\')">打造饰品：全属性+15（45铁、12玉、100金）</button></div>')}
function craftItem(type){let c={weapon:{iron:120,wood:80,gold:80},armor:{iron:100,wood:100,gold:70},accessory:{iron:45,jade:12,gold:100}}[type];if(!costOK(c))return toast("材料不足，无法开炉");spend(c);let x=makeItem(type==="weapon"?"百炼环首刀":type==="armor"?"玄铁山文甲":"龙纹玉佩",type,type==="weapon"?25:type==="armor"?22:15);x.quality="精良";s.items.push(x);log("工坊打造"+x.name);save();forge();render()}
function craftPotion(){if(!costOK({gold:40,iron:20}))return toast("制作药剂需要40金和20铁");spend({gold:40,iron:20});s.potions+=1;save();render();toast("制作完成，药剂+1")}
function sideQuest(){let c=CHAPTERS[Math.min(s.story,CHAPTERS.length-1)],id=s.story;if(s.sideDone.includes(id))return toast("本章支线已经完成");modal("支线委托 · "+c.side,'<div class="banner"><h3>'+c.side+'</h3><p>'+c.sideText+'</p></div><p>支线任务需要派遣少量兵力和资源。完成后获得额外经验、威望与材料，并记录在本地任务簿。</p><button class="btn primary" onclick="finishSideQuest()">接受并完成支线</button>')}
function finishSideQuest(){let id=s.story;if(s.sideDone.includes(id))return toast("该支线已完成");if(s.food<70||armyTotal()<20)return toast("粮草或兵力不足，无法完成支线");s.food-=70;s.fame+=22;s.iron+=20;s.exp+=45;s.sideDone.push(id);log("完成支线「"+CHAPTERS[id].side+"」");save();closeModal();render();toast("支线完成：获得威望、铁矿和经验")}
function scoutRoute(){scout()}
function nextMission(){go("campaign")}
function showJournal(){modal("山河纪事 · 军府档案",'<div class="list">'+s.logs.map(x=>'<div class="rowcard"><div class="info"><small>'+x+'</small></div></div>').join("")+'</div>')}
function saveMenu(){modal("存档与设置",'<p>游戏会自动保存到当前设备浏览器。清除应用数据或卸载游戏会删除本地存档。</p><div class="statsline"><span>存档版本</span><b>v4 · 山河志</b></div><div class="statsline"><span>剧情进度</span><b>'+s.story+'/'+CHAPTERS.length+'</b></div><button class="btn" onclick="showJournal()">查看完整军报</button><button class="btn red" style="margin-left:6px" onclick="resetGame()">重置存档</button>')}
function resetGame(){if(!confirm("确定删除本机存档并重新开始吗？此操作不能撤销。"))return;localStorage.removeItem(KEY);s=fresh();save();closeModal();go("home")}
function randomEncounter(){randomEvent()}
function sideMenu(){modal("军府日常",'<div class="list"><button class="choice" onclick="closeModal();sideQuest()">本章支线委托</button><button class="choice" onclick="closeModal();randomEvent()">触发城中奇遇</button><button class="choice" onclick="closeModal();showJournal()">查看军报</button></div>')}
function waitTravel(){s.day++;s.food=Math.max(0,s.food-30);save()}
function checkInvariants(){if(!Array.isArray(s.heroes))s.heroes=[];if(!Array.isArray(s.items))s.items=[];if(!s.build)s.build={farm:1,barracks:1,wall:1,market:1,academy:1,forge:1};if(!s.flags)s.flags={};if(!s.bond)s.bond={};if(!s.army)s.army={inf:100,cav:40,arch:40};if(!Array.isArray(s.formation)||s.formation.length!==3)s.formation=[0,1,2];s.heroes.forEach(h=>{if(!h.gear)h.gear={weapon:null,armor:null,accessory:null};if(typeof h.hpNow!=="number")h.hpNow=heroMax(h);if(typeof h.energy!=="number")h.energy=3});}
function costTextShort(k,n){return k+n}
function openSideQuest(){sideQuest()}
function scout(){if(s.gold<45)return toast("斥候出巡需要45黄金");s.gold-=45;s.intel++;if(Math.random()<.32)s.sideBonus++;let where=CHAPTERS[Math.min(s.story,CHAPTERS.length-1)].region;log("斥候在"+where+"完成侦察");save();toast("斥候带回情报，下一场战斗可能发现伏兵")}
function eventPage(){randomEvent()}
function upgrade(k){upgradeBuilding(k)}
function prepare(i){startChapter(i)}
function nextDayAction(){nextDay()}
function cityMenu(){buildings()}
function troopMenu(){go("army")}
function shopMenu(){forge()}
function questMenu(){sideQuest()}
function finishFight(){finishBattle()}
function say(t){log(t);save()}
function topInit(){checkInvariants();save();render()}
topInit();
</script>
</body></html>
