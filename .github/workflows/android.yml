name: Build Android APK and parallel QA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-build-${{ github.ref }}-roster-50
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 50 original generals and 100 weapon-specific action sheets
        run: |
          set -euo pipefail
          python3 scripts/generate-roster-art.py
          test -s app/src/main/assets/characters/2d/roster-extra.js
          test -s app/src/main/assets/characters/2d/roster-manifest.json
          test "$(find app/src/main/assets/characters/2d/animations -name "*-attack.svg" | wc -l)" -eq 50
          test "$(find app/src/main/assets/characters/2d/animations -name "*-skill.svg" | wc -l)" -eq 50
      - name: Commit generated SVG artwork back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-assets/sprites app/src/main/assets/characters/2d
          if ! git diff --cached --quiet; then
            git commit -m "Add hand-drawn 2D artwork for all playable generals [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload source SVG artwork for all fifty generals
        uses: actions/upload-artifact@v4
        with:
          name: three-kingdoms-all-general-artwork
          path: game-assets/sprites/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify game logic and content
        run: node scripts/verify-game.cjs
      - name: Verify original 2D Three Kingdoms hero artwork
        run: |
          set -euo pipefail
          for id in liu-bei guan-yu zhang-fei; do
            test -s "app/src/main/assets/characters/2d/$id.svg"
            test -s "app/src/main/assets/characters/2d/portraits/$id.svg"
          done
          ! grep -q 'vendor/three.min.js' app/src/main/assets/index.html
          ! grep -q 'initHero3D(' app/src/main/assets/index.html
      - name: Download CC0 soundtrack for offline play
        run: |
          mkdir -p app/src/main/assets/audio
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_plain.ogg -o app/src/main/assets/audio/theme_plain.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_lost_village.ogg -o app/src/main/assets/audio/theme_lost_village.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_dream.ogg -o app/src/main/assets/audio/theme_dream.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_swamp.ogg -o app/src/main/assets/audio/theme_swamp.ogg
          test $(find app/src/main/assets/audio -maxdepth 1 -name '*.ogg' | wc -l) -eq 4
          mkdir -p app/src/main/assets/audio/sfx
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/rpg-audio/Audio/drawKnife1.ogg -o app/src/main/assets/audio/sfx/swing.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/rpg-audio/Audio/chop.ogg -o app/src/main/assets/audio/sfx/hit.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/impact-sounds/Audio/impactMetal_heavy_000.ogg -o app/src/main/assets/audio/sfx/critical.ogg
          test $(find app/src/main/assets/audio/sfx -name '*.ogg' | wc -l) -eq 3
      - name: Upload prepared game assets
        uses: actions/upload-artifact@v4
        with:
          name: prepared-game-assets
          path: app/src/main/assets/**
          if-no-files-found: error

  browser-test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore prepared game assets
        uses: actions/download-artifact@v4
        with:
          name: prepared-game-assets
          path: app/src/main/assets
      - name: Install Chromium for browser playability test
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run browser playability test (required)
        run: node scripts/browser-smoke.cjs
      - name: Upload browser battle screenshot and 2D general artwork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-battle-visual-evidence
          path: artifacts/
          if-no-files-found: warn

  build-apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore prepared game assets
        uses: actions/download-artifact@v4
        with:
          name: prepared-game-assets
          path: app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: huanxiang-sanguo-apk
          path: app/build/outputs/apk/debug/app-debug.apk


  remote-phone-connection-test:
    if: false # Real-phone testing is paused at the user's request.
    name: Verify remote Android phone MCP connection
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check phone tunnel and authenticate to MCP
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_MCP_URL:-}" ] || [ -z "${ANDROID_MCP_TOKEN:-}" ]; then
            echo "::error::Missing ANDROID_MCP_URL or ANDROID_MCP_TOKEN repository secret."
            exit 1
          fi
          case "$ANDROID_MCP_URL" in
            https://*) ;;
            *) echo "::error::ANDROID_MCP_URL must be a public HTTPS tunnel URL, not localhost."; exit 1 ;;
          esac
          MCP_URL="$ANDROID_MCP_URL"
          MCP_URL="${MCP_URL%/}"
          case "$MCP_URL" in */mcp) ;; *) MCP_URL="$MCP_URL/mcp" ;; esac

          echo "Checking MCP tools endpoint (secret values are never printed)..."
          TOOLS_RESPONSE="$(curl --http1.1 --fail --silent --show-error --max-time 25 \
            -X POST "$MCP_URL" \
            -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          printf '%s' "$TOOLS_RESPONSE" | grep -q 'android_get_screen_state' || {
            echo "::error::MCP responded, but android_get_screen_state was not listed. Check app server and tool permissions."
            exit 1
          }

          echo "Calling phone screen-state tool..."
          SCREEN_RESPONSE="$(curl --http1.1 --fail --silent --show-error --max-time 25 \
            -X POST "$MCP_URL" \
            -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{}}}')"
          printf '%s' "$SCREEN_RESPONSE" | grep -q '"result"' || {
            echo "::error::Phone MCP call did not return a result."
            exit 1
          }
          echo "REMOTE_ANDROID_MCP_CONNECTION_PASSED"

  android-device-test:
    if: false # User requested browser-only verification; skip Android emulator.
    # Apple Silicon + ARM64 Android image avoids the slow/stalled Intel x86_64 path.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright CDP client
        run: npm install --no-save --package-lock=false playwright
      - name: Boot Android emulator, wait for APK build and test real WebView battle
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -memory 3072 -cores 3
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p artifacts apk
            echo "Android emulator is booted. Waiting for the parallel APK build to publish its artifact..."
            APK_ARTIFACT_ID=""
            for i in $(seq 1 180); do
              APK_ARTIFACT_ID="$(curl -fsS \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=huanxiang-sanguo-apk&per_page=10" \
                | jq -r --arg runid "$GITHUB_RUN_ID" '.artifacts[]? | select(.name=="huanxiang-sanguo-apk" and .expired==false and .workflow_run.id == ($runid|tonumber)) | .id' \
                | head -n 1)"
              if [ -n "$APK_ARTIFACT_ID" ]; then
                echo "APK artifact is ready: $APK_ARTIFACT_ID"
                break
              fi
              sleep 10
            done
            test -n "$APK_ARTIFACT_ID"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$APK_ARTIFACT_ID/zip" \
              -o apk/apk-artifact.zip
            unzip -o apk/apk-artifact.zip -d apk
            APK="$(find apk -name '*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.hxsg.game || true
            adb shell monkey -p com.hxsg.game 1
            sleep 12
            adb shell dumpsys activity activities | grep -q 'com.hxsg.game'
            PID="$(adb shell pidof -s com.hxsg.game | tr -d '\r')"
            test -n "$PID"
            adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:9222/json/version
            node scripts/android-webview-smoke.cjs
            adb logcat -d -s AndroidRuntime:E HuanxiangWebView:D > artifacts/android-logcat.txt
            adb exec-out screencap -p > artifacts/android-final-screen.png
      - name: Upload Android emulator battle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: artifacts/
          if-no-files-found: warn
