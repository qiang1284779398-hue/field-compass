name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify game logic and content
        run: node scripts/verify-game.cjs
      - name: Install Chromium for browser playability test
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run browser playability test
        run: node scripts/browser-smoke.cjs
      - name: Download CC0 soundtrack for offline play
        run: |
          mkdir -p app/src/main/assets/audio
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_plain.ogg -o app/src/main/assets/audio/theme_plain.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_lost_village.ogg -o app/src/main/assets/audio/theme_lost_village.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_dream.ogg -o app/src/main/assets/audio/theme_dream.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/pixel-boy/NinjaAdventure/main/audio/music/theme_swamp.ogg -o app/src/main/assets/audio/theme_swamp.ogg
          test $(find app/src/main/assets/audio -name '*.ogg' | wc -l) -eq 4
          mkdir -p app/src/main/assets/audio/sfx
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/rpg-audio/Audio/drawKnife1.ogg -o app/src/main/assets/audio/sfx/swing.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/rpg-audio/Audio/chop.ogg -o app/src/main/assets/audio/sfx/hit.ogg
          curl -L --fail --silent --show-error https://raw.githubusercontent.com/GeorgeQLe/assets-sfx-combat/main/assets/kenney/impact-sounds/Audio/impactMetal_heavy_000.ogg -o app/src/main/assets/audio/sfx/critical.ogg
          test $(find app/src/main/assets/audio/sfx -name '*.ogg' | wc -l) -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: huanxiang-sanguo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
