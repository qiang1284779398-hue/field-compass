name: CPU Text-to-3D Training

on:
  push:
    paths:
      - ".github/workflows/train-text3d-cpu.yml"
      - "mobile-gpu-lab/cpu-training/train_text3d.py"
  workflow_dispatch:
    inputs:
      max_models:
        description: Maximum CC0 GLB assets
        required: false
        default: "64"
      epochs:
        description: CPU training epochs
        required: false
        default: "200"
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: write

concurrency:
  group: text3d-cpu-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAX_MODELS: ${{ github.event.inputs.max_models || '64' }}
      EPOCHS: ${{ github.event.inputs.epochs || '200' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy requests torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download CC0 GLB and train
        run: python mobile-gpu-lab/cpu-training/train_text3d.py
      - name: Commit trained model and dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-gpu-lab/trained/
          if ! git diff --cached --quiet; then
            git commit -m "Train CPU text-to-3D point-cloud baseline"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: text3d-cpu-training-${{ github.run_number }}
          path: mobile-gpu-lab/trained/
          retention-days: 30
