name: Model Studio checks

on:
  push:
    paths:
      - "model-studio/**"
      - ".github/workflows/model-studio-ci.yml"
  pull_request:
    paths:
      - "model-studio/**"
      - ".github/workflows/model-studio-ci.yml"
  workflow_dispatch:

jobs:
  browser-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check module JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("model-studio/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(blocks) != 1:
              raise SystemExit(f"Expected one module script, found {len(blocks)}")
          Path("/tmp/model-studio.mjs").write_text(blocks[0], encoding="utf-8")
          PY
          node --check /tmp/model-studio.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test AI studio interface
        run: |
          python3 -m http.server 4173 --directory model-studio >/tmp/model-studio-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#stage canvas', { timeout: 30000 });
            await page.waitForTimeout(1200);
            for (const selector of ['#prompt', '#key', '#model', '#faces', '#texture', '#generate', '#download']) {
              if (!(await page.locator(selector).count())) throw new Error('Missing UI control: ' + selector);
            }
            const models = await page.locator('#model option').allTextContents();
            if (!models.some(x => x.includes('P2')) || !models.some(x => x.includes('H3.1'))) {
              throw new Error('Expected P2 and H3.1 model options');
            }
            await page.locator('[data-p="guan"]').click();
            if (!(await page.locator('#prompt').inputValue()).includes('关羽')) {
              throw new Error('Character prompt preset did not populate');
            }
            if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
            console.log('PASS: AI 3D studio loads, preview canvas initializes, presets and generation controls are present.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS
