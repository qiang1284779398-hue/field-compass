name: Open downloaded APK installer on real phone
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/open-delta.yml
permissions:
  contents: read
jobs:
  open-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Tap downloaded APK and inspect Android package installer
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          MCP_URL="${ANDROID_MCP_URL%/}"
          case "$MCP_URL" in */mcp) ;; *) MCP_URL="$MCP_URL/mcp" ;; esac
          call_mcp() {
            local payload="$1" out="/tmp/mcp-$RANDOM.json"
            for attempt in $(seq 1 12); do
              if curl --http1.1 --fail --silent --show-error --connect-timeout 15 --max-time 60 \
                -X POST "$MCP_URL" -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
                -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
                --data "$payload" -o "$out"; then cat "$out"; rm -f "$out"; return 0; fi
              sleep 8
            done
            return 1
          }
          call_mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"android_tap","arguments":{"x":620,"y":790}}}' > /tmp/tap.json
          sleep 10
          call_mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{"include_screenshot":true,"annotate":false}}}' > /tmp/screen.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/screen.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          result=obj.get('result',{})
          if obj.get('error') or result.get('isError'): raise SystemExit('SCREEN_READ_FAILED')
          for x in result.get('content',[]):
              if x.get('type')=='text': print('PACKAGE_INSTALLER_SCREEN:',x.get('text','')[:14000])
          PY
