name: Confirm APK download on real Android phone
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/open-delta.yml
permissions:
  contents: write
jobs:
  confirm-download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Open the published APK and inspect installer prompt
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          MCP_URL="${ANDROID_MCP_URL%/}"
          case "$MCP_URL" in */mcp) ;; *) MCP_URL="$MCP_URL/mcp" ;; esac
          call_mcp() {
            curl --http1.1 --fail --silent --show-error --max-time 45 --retry 4 --retry-all-errors --retry-delay 3 \
              -X POST "$MCP_URL" -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
              -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" --data "$1"
          }
          call_mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"android_click_node","arguments":{"by":"text","value":"仍然下载","exact_match":true}}}' > /tmp/click.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/click.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          print('CONFIRM_DOWNLOAD:',json.dumps(obj.get('result',obj.get('error')),ensure_ascii=False)[:3000])
          if obj.get('error') or obj.get('result',{}).get('isError'): raise SystemExit('DOWNLOAD_CONFIRM_FAILED')
          PY
          sleep 12
          call_mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{"include_screenshot":true,"annotate":false}}}' > /tmp/screen.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/screen.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          for item in obj.get('result',{}).get('content',[]):
              if item.get('type')=='text': print('INSTALLER_SCREEN:',item.get('text','')[:10000])
          if obj.get('error') or obj.get('result',{}).get('isError'): raise SystemExit('SCREEN_READ_FAILED')
          PY
