name: Tap package installer choice on real phone
on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/open-delta.yml ]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Select installer and inspect
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          U="${ANDROID_MCP_URL%/}"; case "$U" in */mcp) ;; *) U="$U/mcp";; esac
          call(){ local p="$1" o="/tmp/m-$RANDOM"; for n in $(seq 1 10); do if curl --http1.1 -fsS --connect-timeout 12 --max-time 50 -X POST "$U" -H "Authorization: Bearer $ANDROID_MCP_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" --data "$p" -o "$o"; then cat "$o"; rm -f "$o"; return; fi; sleep 4; done; return 1; }
          call '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"android_tap","arguments":{"x":620,"y":2100}}}' >/tmp/tap
          sleep 6
          call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{"include_screenshot":true,"annotate":false}}}' >/tmp/screen
          python3 - <<'PY'
          import json
          s=open('/tmp/screen').read()
          for l in s.splitlines():
              if l.startswith('data:'): s=l[5:].strip()
          o=json.loads(s); r=o.get('result',{})
          if o.get('error') or r.get('isError'): raise SystemExit('SCREEN_ERROR')
          for x in r.get('content',[]):
              if x.get('type')=='text': print(x.get('text','')[:14000])
          PY
