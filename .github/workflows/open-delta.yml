name: Launch game on real Android phone
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/open-delta.yml
permissions:
  contents: read
jobs:
  launch-game:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check installed game and launch it on the real phone
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          MCP_URL="${ANDROID_MCP_URL%/}"
          case "$MCP_URL" in */mcp) ;; *) MCP_URL="$MCP_URL/mcp" ;; esac
          call_mcp() {
            curl --http1.1 --fail --silent --show-error --max-time 35 --retry 4 --retry-all-errors --retry-delay 3 \
              -X POST "$MCP_URL" \
              -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --data "$1"
          }
          call_mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"android_list_apps","arguments":{"filter":"user","name_query":"幻想"}}}' > /tmp/apps.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/apps.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          print('INSTALLED_APP_LOOKUP:',json.dumps(obj.get('result',{}),ensure_ascii=False)[:6000])
          PY
          OPEN_RESPONSE="$(call_mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_open_app","arguments":{"package_id":"com.hxsg.game"}}}')"
          printf '%s\n' "$OPEN_RESPONSE" > /tmp/open.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/open.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          print('GAME_LAUNCH_RESPONSE:',json.dumps(obj.get('result',obj.get('error')),ensure_ascii=False)[:5000])
          if obj.get('error') or obj.get('result',{}).get('isError'): raise SystemExit('GAME_LAUNCH_FAILED')
          PY
          sleep 10
          SCREEN_RESPONSE="$(call_mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{"include_screenshot":true,"annotate":false}}}')"
          printf '%s\n' "$SCREEN_RESPONSE" > /tmp/screen.json
          python3 - <<'PY'
          import json
          raw=open('/tmp/screen.json').read()
          for line in raw.splitlines():
              if line.startswith('data:'): raw=line[5:].strip()
          obj=json.loads(raw)
          result=obj.get('result',{})
          print('SCREEN_VERIFICATION:',json.dumps(result,ensure_ascii=False)[:10000])
          if obj.get('error') or result.get('isError'): raise SystemExit('SCREEN_READ_FAILED')
          PY
          echo "REAL_PHONE_GAME_LAUNCH_CHECK_COMPLETE"
