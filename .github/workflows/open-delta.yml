name: Inspect remote Android phone for game 3D test
on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/open-delta.yml
permissions:
  contents: read
jobs:
  inspect-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List available remote phone controls and read current screen
        env:
          ANDROID_MCP_URL: ${{ secrets.ANDROID_MCP_URL }}
          ANDROID_MCP_TOKEN: ${{ secrets.ANDROID_MCP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_MCP_URL:-}"
          test -n "${ANDROID_MCP_TOKEN:-}"
          MCP_URL="${ANDROID_MCP_URL%/}"
          case "$MCP_URL" in */mcp) ;; *) MCP_URL="$MCP_URL/mcp" ;; esac
          call_mcp() {
            curl --http1.1 --fail --silent --show-error --max-time 35 --retry 4 --retry-all-errors --retry-delay 3 \
              -X POST "$MCP_URL" \
              -H "Authorization: Bearer $ANDROID_MCP_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --data "$1"
          }
          TOOLS_RESPONSE="$(call_mcp '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          printf '%s\n' "$TOOLS_RESPONSE" > /tmp/tools-response.txt
          python3 - <<'PY'
          import json
          raw=open('/tmp/tools-response.txt').read()
          for line in raw.splitlines():
              if line.startswith('data:'):
                  raw=line[5:].strip()
          obj=json.loads(raw)
          tools=obj.get('result',{}).get('tools',[])
          print('REMOTE_PHONE_TOOL_COUNT:',len(tools))
          for t in tools:
              print(json.dumps({'name':t.get('name'),'description':t.get('description'),'inputSchema':t.get('inputSchema')},ensure_ascii=False))
          PY
          SCREEN_RESPONSE="$(call_mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"android_get_screen_state","arguments":{}}}')"
          printf '%s\n' "$SCREEN_RESPONSE" > /tmp/screen-response.txt
          python3 - <<'PY'
          import json
          raw=open('/tmp/screen-response.txt').read()
          for line in raw.splitlines():
              if line.startswith('data:'):
                  raw=line[5:].strip()
          obj=json.loads(raw)
          result=obj.get('result',{})
          print('SCREEN_STATE_CALL_OK:', not obj.get('error') and not result.get('isError',False))
          for item in result.get('content',[]):
              if item.get('type')=='text':
                  print('SCREEN_TEXT:',item.get('text','')[:3000])
              else:
                  print('SCREEN_CONTENT_TYPE:',item.get('type'))
          PY
          echo "REMOTE_PHONE_INSPECTION_COMPLETED"
