name: Android APK device test
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  install-and-launch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: huanxiang-sanguo-apk
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Boot Android emulator, install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            APK="$(find apk -name '*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell monkey -p com.hxsg.game 1
            sleep 15
            adb shell dumpsys activity activities | grep -q 'com.hxsg.game'
            adb logcat -d -s AndroidRuntime:E | tee /tmp/android-runtime-errors.txt
            if grep -q 'FATAL EXCEPTION' /tmp/android-runtime-errors.txt; then
              echo "Android app crashed during launch"
              exit 1
            fi
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml ./window.xml
            grep -Eq '新野|主城' window.xml
            adb shell screencap -p /sdcard/game-home.png
            adb pull /sdcard/game-home.png ./game-home.png
      - name: Upload emulator launch evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: |
            window.xml
            game-home.png
            /tmp/android-runtime-errors.txt
