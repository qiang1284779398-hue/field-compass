name: Shap-E Text-to-3D GLB

on:
  push:
    paths:
      - ".github/workflows/shap-e-text3d.yml"
      - "mobile-gpu-lab/generation/**"
  workflow_dispatch:
    inputs:
      prompt:
        description: English text description of the 3D object
        required: true
        default: "a stylized medieval wooden shield with a steel rim and a central boss"
        type: string
      steps:
        description: Karras sampling steps (16 for CPU smoke test; up to 64 for higher quality)
        required: true
        default: "16"
        type: string

permissions:
  contents: write

concurrency:
  group: shap-e-text3d-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PROMPT: ${{ github.event.inputs.prompt || 'a stylized medieval wooden shield with a steel rim and a central boss' }}
      GENERATION_STEPS: ${{ github.event.inputs.steps || '16' }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Shap-E and GLB exporter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/openai/shap-e.git" trimesh PyYAML
      - name: Generate full 3D mesh on CPU
        run: |
          python mobile-gpu-lab/generation/shap_e_text_to_glb.py \
            --device cpu \
            --prompt "$PROMPT" \
            --steps "$GENERATION_STEPS" \
            --seed 42 \
            --threads 2
      - name: Commit generated GLB and provenance manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-gpu-lab/generated/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Shap-E text-to-3D GLB asset"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shap-e-text3d-${{ github.run_number }}
          path: mobile-gpu-lab/generated/
          retention-days: 30
